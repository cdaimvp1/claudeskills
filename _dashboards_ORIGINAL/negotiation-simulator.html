01 in place of direct audit; extending direct-audit rights to every customer isn't operationally scalable for us.",rebuttal:"A direct audit right capped at once per 12 months with reasonable notice does not create the operational burden of an open-ended right. Lilly is asking for the standard playbook floor, not a bespoke enhancement.",fallback:"Direct audit right retained, but exercised only if the SOC 2 or ISO 27001 report shows a qualified opinion or a control exception; otherwise the certifications stand for the year.",benchmark:{pct:72,n:19,source:"negotiation-playbook-learning, IT SaaS/cloud category",asOf:"Jun 2026",confidence:"Medium"},personas:{Standard:"Per our playbook, we require a direct audit right over the systems and records relevant to this engagement, with reasonable notice. SOC 2 and ISO 27001 can supplement, not replace it.",Collaborative:"We'd like to keep this simple for both teams: your SOC 2 and ISO 27001 reports cover most of what we need, and we just want to retain a light, reasonable-notice audit right as a backstop, capped at once a year.",Aggressive:"Direct audit rights are non-negotiable at this contract value. Certifications alone do not satisfy our risk posture. Retain the clause as drafted or we escalate.",Curious:"Help us understand what makes a direct audit right operationally harder for you than the SOC 2 process you already run every year. Is it the notice window, the frequency, or something else?",Astonished:"We're surprised NorthPeak is asking Lilly to give up a direct audit right at this contract size. For a platform this central to our operations, that's a bigger ask than it might look on paper."}},{id:2,title:"Data Sovereignty and Breach Notification",tier:"Hold Firm",ref:"Playbook S9-10 (Data Protection and Privacy)",position:"Lilly-designated data must be hosted in a named, fixed set of regions with no unilateral relocation, and NorthPeak must notify Lilly of a confirmed breach within 24 hours of confirmation, consistent with Lilly's internal escalation timeline.",args:["The playbook floor is 72 hours or less; 24 hours sits inside that floor and matches Lilly's own internal incident-response SLA, so downstream reporting isn't bottlenecked by the vendor.","Unrestricted hosting-location flexibility creates a data-residency exposure Legal cannot pre-clear once and forget; a fixed region list keeps the compliance footprint known.","NorthPeak's own public trust center already commits to a small number of named regions; codifying that in contract restates an existing commitment, it does not add a new one."],pushback:"We need flexibility to shift workloads across our global data centers for performance and failover; locking to named regions limits our ability to route around outages.",rebuttal:"Failover within a pre-approved region list solves the same problem without opening residency risk. Add a secondary named region for failover rather than open-ended flexibility.",fallback:"Primary plus one pre-approved secondary region, with 5 business days' advance notice before any change to the named list. Breach notification at 48 hours if 24 cannot be met, with an interim 'confirmed incident, assessment ongoing' notice at 24 hours.",benchmark:{pct:44,n:16,source:"market-rate-benchmarking web read, comparable cloud-ERP renewals",asOf:"Jun 2026",confidence:"Medium"},personas:{Standard:"We require Lilly data to stay within a named set of regions, with no unilateral relocation, and breach notification within 24 hours of confirmation.",Collaborative:"We know infrastructure flexibility matters to you, so let's agree on a short, named list of regions, including a failover region, so you still have resilience and we still know exactly where our data lives.",Aggressive:"Open-ended hosting flexibility is not something Legal will clear. Lock the region list in the contract and hold to a 24-hour breach notification. This is not a point we will trade away.",Curious:"What's driving the need for unrestricted region flexibility, is it latency, cost, or disaster recovery? If it's DR, would a named secondary region solve that without going fully open-ended?",Astonished:"We're a little surprised a vendor processing this much of our operational data doesn't already commit to a fixed region list; that's usually table stakes at this contract size."}},{id:3,title:"Termination for Convenience",tier:"Hold Firm",ref:"Playbook S16 (Termination)",position:"Lilly retains the right to terminate for convenience with 30-day written notice. NorthPeak's request to remove termination for convenience entirely, or lock Lilly into the full multi-year term, is not acceptable given the size of the platform commitment.",args:["The playbook floor requires a termination-for-convenience right; removing it entirely is listed as Not Acceptable regardless of deal size.","At $50M+ of platform investment, Lilly is already accepting substantial switching-cost lock-in; removing the one contractual release valve compounds that risk instead of balancing it.","A termination-for-convenience right with reasonable notice does not threaten a well-performing relationship; it only matters if the relationship deteriorates, which is exactly when Lilly needs it."],pushback:"This is a multi-year platform investment on our side too; removing termination for convenience protects the mutual commitment behind the discounted multi-year pricing.",rebuttal:"The pricing commitment and the exit right are two different questions. Lilly can commit to the volume and pricing structure for the term while still holding a termination-for-convenience right, paired with an early-termination fee that compensates for the specific multi-year discount if exercised.",fallback:"60-day notice (instead of 30) plus an early-termination fee equal to a defined percentage of the remaining committed fees if termination for convenience is exercised in years 1 or 2.",benchmark:{pct:28,n:22,source:"negotiation-playbook-learning, platform/ERP subcategory",asOf:"Jun 2026",confidence:"Medium"},personas:{Standard:"We require a termination-for-convenience right with 30-day notice. Removing it entirely is not something we can accept regardless of deal size.",Collaborative:"We understand the multi-year pricing reflects a mutual commitment. We're glad to structure an early-termination fee that protects that commitment while still keeping a standard termination-for-convenience right in place.",Aggressive:"No termination for convenience is a non-starter at this contract value. Restore a 30-day right or the multi-year pricing structure is off the table.",Curious:"Is the concern here really about losing the multi-year revenue, or about losing the reference-customer relationship? Those call for different solutions; an early-termination fee solves the first.",Astonished:"We're surprised to see a request to remove termination for convenience altogether on a contract this size. Most of our vendor relationships at this scale still carry a standard exit right, just with an appropriate fee attached."}},{id:4,title:"Pricing Transparency on Future Modules",tier:"Trade Chip",ref:"Playbook S3 (Fees and Payment) - transparency principle, not a Hard Stop",position:"NorthPeak discloses list price and the applicable discount methodology for any future module Lilly adds during the term, rather than negotiating each addition from an undisclosed base. Any cross-module bundling discount is itemized, not blended.",args:["Playbook S3 already requires rate escalation to be capped and tied to a transparent index; opaque module pricing defeats that same transparency principle at the point of expansion.","Lilly is a reference-scale customer for NorthPeak; a standing disclosure norm removes the need to renegotiate pricing transparency from scratch every time a new module is added.","Itemized bundling discounts let Lilly evaluate each module on its own economics instead of accepting a blended number that could mask an above-market component."],pushback:"Our module pricing is customized per customer based on scale and use case; a published rate card doesn't reflect the value we deliver to an account like yours.",rebuttal:"Custom pricing is fine. The ask is disclosure of the methodology and base list price behind the custom number, not a fixed public rate card; that is a lower bar than what's being resisted.",fallback:"NorthPeak discloses list price and discount percentage (not full methodology) for any module added in the first 24 months of the term, with itemized, not blended, bundling.",benchmark:{pct:null,n:null,source:"",asOf:"",confidence:"Not available",note:"No comparable outcome records for module-pricing-transparency clauses yet. RESEARCH PENDING; treat this position qualitatively, not against a firm rate."},personas:{Standard:"We're asking for disclosed list pricing and discount methodology for any module added during the term, with bundling discounts itemized rather than blended.",Collaborative:"We'd like a simple standing agreement: when we add a module, we see the list price and discount basis up front, so neither side has to renegotiate transparency every time. That should be easy given the reference relationship we have.",Aggressive:"Blended, undisclosed module pricing is not acceptable going forward. Every future module needs a disclosed list price and discount percentage, itemized, not folded into a bundle.",Curious:"Would it work to share the list price and discount percentage, without the full internal methodology, just so we can evaluate each module's economics on its own?",Astonished:"We're a bit surprised pricing on future modules would stay opaque given how much of our roadmap already runs through your platform; that level of transparency is usually the norm for an account at our scale."}}],ru=["Hard Stop","Hold Firm","Trade Chip"].map(e=>({t:e,n:hn.filter(t=>t.tier===e).length})),Wp=hn.filter(e=>e.benchmark.pct!=null).length,Bp=[...hn].sort((e,t)=>(t.benchmark.pct??-1)-(e.benchmark.pct??-1)
