 A Addendum A discloses General Use Models (cross-client) and Client-Dedicated Models (Lilly-specific). If HITL feedback from Lilly data flows to General Use Models, violates \xA73.5.",msa:"AI Standard \xA72, \xA73.5; MSA A.1.19, A.1.37; Addendum A \xA73 (VERIFIED)",v:!0,impact:"Potential unauthorized use of Lilly data for cross-client model improvement.",action:"Add clause: HITL on Lilly Content improves only Client-Dedicated Models.",cat:"AI/Data"},{id:4,t:"MEDIUM",title:"Annual prepayment erodes TfC value",where:"Pricing; Table 2 billing",ev:"$205,984 at execution + $411,969 Aug/Sep. 30% discount conditioned on annual prepay. MSA \xA74.4 is Net-60. MSA \xA713.4: on TfC for SaaS, Lilly liable for unused remainder up to 12 months. Combined with prepayment, up to $617,953 may be unrecoverable on early termination.",msa:"MSA \xA74.4, \xA713.4 (VERIFIED)",v:!0,impact:"$617,953 at risk if Lilly terminates for convenience after annual prepayment.",action:"Negotiate pro-rata refund on TfC, or switch to quarterly billing.",cat:"Commercial"},{id:5,t:"MEDIUM",title:"Custom AI model ownership not explicit in WO",where:"WO Table 1 (Custom Classifiers, Quality Models, autoscoring)",ev:"Custom models = Work Product (MSA A.1.39) + Lilly Trained Models (AI Standard \xA72/\xA715). Both assign to Lilly. WO silent on this. In SaaS context where models run on vendor infra, explicit language prevents portability/deletion disputes.",msa:"MSA \xA79.1.2, AI Standard \xA715 (VERIFIED)",v:!0,impact:"Ambiguity about model ownership, portability, deletion at WO end.",action:"Add explicit ownership + export/deletion clause.",cat:"IP"},{id:6,t:"MEDIUM",title:"No AE/product complaint detection process at scale",where:"WO scope vs MSA \xA73.8",ev:"180K calls/yr with patients, HCPs, caregivers. MSA \xA73.8: 1-biz-day AE reporting. WO AI models cover experience, friction, quality but not AE detection. At 0.1-0.5% AE signal rate: 180-900 potential AE calls/yr. 5% false negative = 9-45 missed AE sig "98% annual allows individual months to drop far below without triggering credits.","The exclusion list is broader than MSA Force Majeure and could excuse most downtime events.","'Third-party acts' exclusion is a catch-all that could encompass cloud provider outages Supplier A should own."],push:"Our infrastructure can't guarantee 99.5%. The 98% annual is realistic for our platform. The exclusions are standard.",reb:"The exclusions in the MSA SaaS Exhibit Section 5.2 already address legitimate carve-outs. If infrastructure constraints exist, let's discuss 99.0% monthly as a compromise, but annual measurement and the broad exclusion list are not acceptable.",fall:"99.0% monthly (not annual). Narrow exclusions to FM only. Retain material breach trigger at <98% for 3/12.",acc:"67% (industry standard for SaaS, N=42)",personas:{Standard:"The proposed SLA departs from our MSA SaaS Exhibit framework. We require monthly measurement at 99.50% with exclusions limited to Force Majeure per MSA Section 17.",Collaborative:"We'd like to align the SLA with our existing MSA framework, which both parties agreed to. Could we work together to find a threshold that's realistic for your infrastructure while maintaining monthly measurement?",Aggressive:"This SLA is unacceptable. It drops 150 basis points from our agreed MSA framework and shifts to annual measurement that masks individual bad months. Restore Exhibit B Section 7.4 defaults.",Curious:"Can you help us understand why the SLA was set at 98% annual rather than using the MSA SaaS Exhibit framework? Is there an infrastructure constraint we should be aware of?",Astonished:"We're quite surprised to see the SLA set at 98% annually when our MSA SaaS Exhibit establishes 99.50% monthly as the baseline. This is a significant departure from the framework we negotiated."}},{term:"HITL training: Lilly-only models",pos:"All HITL and Supervised Training on Lilly Content improves only Client-Dedicated Models per Addendum A. No Lilly Content used for General Use Models.",args:["AI Standard \xA73.5 already bars Lilly Content as Supplier Training Content.","Definition trace: call recordings = Lilly Information (A.1.19), not Usage Data (A.1.37). Usage Data explicitly excludes Lilly Information.","Addendum A discloses General Use Models trained on 'anonymized pool including a wide range of healthcare interactions.' Lilly data must not flow there.","A one-line confirmation costs nothing if Supplier A already complies."],push:"Human labels are 'Usage Data' under A.1.37 that we can use to improve the platform.",reb:"Usage Data is defined as 'usage and operations data...including query logs and metadata' and explicitly excludes Lilly Information. Human labels derived from reviewing Lilly call recordings are derived from Lilly Content, not operational telemetry. The definition trace is unambiguous.",fall:"None. This is a compliance position under the executed AI Standard.",acc:"43% (N=28, emerging clause)",personas:{Standard:"Per AI Standard Section 3.5, Lilly Content cannot be used as Supplier Training Content. Please add a clause confirming HITL feedback from Lilly data improves only Client-Dedicated Models.",Collaborative:"We want to make sure both parties are comfortable with how HITL training data flows. Our AI Standard requires that Lilly Content only improve Lilly-dedicated models. Could we add a brief clause confirming this is already your practice?",Aggressive:"The AI Standard is clear: Lilly Content is not Supplier Training Content. The HITL section must explicitly restrict training feedback to Client-Dedicated Models. This is non-negotiable.",Curious:"The HITL section describes improving 'model accuracy' but doesn't specify which models. Can you confirm whether HITL feedback from Lilly data flows only to our dedicated models, or also to your general platform models?",Astonished:"We're concerned that the HITL description doesn't distinguish between your General Use Models and Client-Dedicated Models. Given that our AI Standard explicitly bars use of Lilly Content for supplier training, this omission is surprising."}},{term:"Prepay/TfC: pro-rata refund",pos:"If Lilly exercises TfC, pro-rata refund of prepaid unused fees.",args:["MSA \xA713.4 says Lilly liable for unused SaaS remainder up to 12 months, so prepaid fees may be unrecoverable.","Annual prepay of $617,953 combined with TfC liability creates maximum financial exposure.","MSA \xA74.4 is Net-60; annual prepay deviates from standard payment terms."],push:"The 30% discount is the consideration for annual prepay. Can't have the discount and the refund.",reb:"Then let's discuss quarterly billing at a reduced discount (e.g., 20%) that preserves some savings while eliminating the prepay/TfC exposure.",fall:"Quarterly billing at 20% discount instead of 30%. Eliminates prepay risk.",acc:"55% (N=31)",personas:{Standard:"Annual prepayment combined with MSA Section 13.4 creates up to $617,953 in unrecoverable exposure on termination for convenience. We require either a pro-rata refund clause or quarterly billing.",Collaborative:"We'd like to find a structure that works for both sides. The annual prepay creates a TfC exposure we need to manage. Would quarterly billing with an adjusted discount be workable?",Aggressive:"We will not prepay $617,953 without a refund mechanism on early termination. Either add a pro-rata refund clause or switch to quarterly billing.",Curious:"How does annual prepayment interact with the TfC provisions in our MSA? We want to understand whether prepaid fees are recoverable if we exercise termination for convenience.",Astonished:"We're surprised the WO requires annual prepayment given that our MSA establishes Net-60 payment terms. Combined with the TfC provisions, this creates significant unrecoverable exposure."}},{term:"Custom model ownership",pos:"Explicit WO clause: all custom models trained on Lilly data = Work Product (MSA \xA79.1.2) + Lilly Trained Models (AI Standard \xA715), owned by Lilly, with export and deletion obligations.",args:["MSA already assigns Work Product; the ask is clarification, not a new right.","In SaaS context, models run on vendor infrastructure, making explicit ownership language important for portability.","AI Standard \xA715 independently assigns Lilly Automated Property to Lilly."],push:"Our platform doesn't support model export. The models are embedded in our infrastructure.",reb:"Understood, but ownership and export are separate questions. We need ownership confirmed now; export mechanics can be addressed in a technical addendum. At minimum, deletion at termination must be confirmed.",fall:"Written email confirmation that custom models are Work Product under \xA79.1.2, without WO language. Deletion at termination confirmed.",trade:"Concede Insight Sessions minimum (#11) or June 15 deadline (#8).",acc:"61% (N=35)",personas:{Standard:"Please add a clause confirming that Custom Classifiers, Custom Quality Models, and Custom autoscoring models trained on Lilly data are Work Product per MSA Section 9.1.2 and Lilly Trained Models per AI Standard Section 15.",Collaborative:"We think both parties would benefit from explicit clarity on custom model ownership. Our MSA already addresses this through the Work Product assignment, so this is really just making the implicit explicit.",Aggressive:"Custom models trained on Lilly data are Lilly property under two independent assignment clauses. Add explicit confirmation to the WO.",Curious:"Can you describe how custom models trained on our data are managed in your infrastructure? We want to understand the ownership and portability picture so we can align the WO language.",Astonished:"We're surprised there's no ownership clause for the custom models, given that both our MSA and AI Standard independently assign these to Lilly."}},{term:"AE detection at scale",pos:"Configure AE/product complaint classifier. Flag potential AEs within 1 business day. Quarterly accuracy reporting.",args:["At 180K calls/year, even 0.1% AE rate = 180 potential AE conversations.","5% false negative rate = 9 missed AEs per year at that volume.","MSA \xA73.8 covers reactive reporting; this is proactive screening at AI scale."],push:"Our AI models aren't trained for AE detection. That would require new development.",reb:"Your topic classification models already identify 'fulfillment barriers' and 'competitive intel.' Configuring a flag for safety-related language patterns is comparable scope. We're not asking for a medical-grade diagnostic; we need a screening flag that routes calls to human PV review.",fall:"Quarterly report on potential AE/PC flags surfaced by existing topic models, without a dedicated classifier SLA.",trade:"Concede June 15 deadline (#8).",acc:"38% (N=22, pharma-specific)",personas:{Standard:"Given the volume of healthcare conversations processed (180K/year), we need an AE detection process. Please configure a classifier to flag potential adverse event signals and route them within 1 business day.",Collaborative:"We'd like to work together on an approach to AE detection that fits within your existing model architecture. At 180K calls per year, proactive screening would benefit both parties from a compliance standpoint.",Aggressive:"At 180K calls/year with patient and HCP conversations, proactive AE detection is a regulatory necessity. Add a classifier with quarterly accuracy reporting.",Curious:"Your AI models classify by sentiment, theme, and quality. Have you considered whether those models could also flag potential adverse event signals? At our call volume, this would be valuable for pharmacovigilance.",Astonished:"We're struck that a healthcare-specific AI platform processing 180K patient/HCP calls per year doesn't include adverse event detection as a standard feature."}},{term:"June 15 discount deadline extension",pos:"Extend the 30% discount through Lilly's approval cycle.",args:["$264,837 discount is significant and worth preserving.","The deadline compresses FRAP and review timelines."],push:"This is an end-of-quarter offer. We can't hold pricing indefinitely.",reb:"We're committed to closing promptly. A 30-day extension from today gives both sides time to finalize without compressing quality review.",fall:"Accept June 15 if all other items can be resolved in a single round.",acc:"72% (N=18)",personas:{Standard:"We request extending the 30% discount deadline to allow completion of our review and approval process.",Collaborative:"We're eager to close quickly and preserve the discount. Could we extend the deadline by 30 days to ensure both parties can complete their review processes?",Aggressive:"The June 15 deadline is artificial. Extend the discount through our approval cycle or we will evaluate the deal at the undiscounted price.",Curious:"Can you help us understand the constraint behind the June 15 deadline? Is there flexibility if we can commit to executing within a defined window?",Astonished:"We're surprised by a hard deadline that could force us to choose between a thorough review and a $264,837 discount. We'd expect more flexibility in a mature partnership."}}],sequencing:[{round:"Round 1: Collaborative alignment",c:_,bg:Zi,goal:"Resolve all items in a single collaborative exchange",items:["Lead with volume period fix (#1) as goodwill/editing correction.","Present SLA restoration (#2) as 'aligning with our MSA framework we already agreed to.'","Present HITL clause (#3) as 'clarifying the AI Standard both parties executed.'","Concede June 15 deadline (#8) immediately to signal flexibility and urgency to close.","Request acceptance criteria (#9) and migration plan (#7).","Raise prepay/TfC issue (#4): offer quarterly billing at 20% as alternative."],risk:"Low. Most items are error corrections or MSA alignment, not new asks."},{round:"Round 2: Deploy fallbacks if needed",c:F,bg:Yt,goal:"Close remaining items with calibrated fallbacks",items:["If SLA resisted: offer 99.0% monthly (do NOT accept annual measurement or broad exclusions).","If custom model ownership resisted: accept email confirmation instead of WO clause.","Trade Insight Sessions minimum (#11) for AE detection process (#6).","If prepay/TfC resisted: accept quarterly billing at reduced discount as compromise."],risk:"Low-Medium. If Round 1 is collaborative, Round 2 should be cleanup only."}],smes:[{name:"Legal AIPC / Privacy Contracts",email:"Mailbox_Privacy_Contracts@lilly.com",topic:"AI Standard \xA73.5 interpretation: HITL training data use",urgency:"Standard",brief:"Supplier A processes ~180K Lilly Direct calls/year using proprietary AI. Their AI Standard disclosure (Exhibit C Addendum A) describes three model types: General Use (cross-client), Client-Dedicated (Lilly-specific), and External Dataset. The WO HITL section describes training to 'improve model accuracy' without specifying which models. Definition trace shows call data is Lilly Content (not Usage Data per A.1.37 explicit exclusion), so \xA73.5 bars its use as Supplier Training Content. We plan to add a WO clause restricting HITL to Client-Dedicated Models only. Please confirm our interpretation is correct and review the proposed clause language.",asks:["Confirm AI Standard \xA73.5 interpretation re: HITL training data classification","Review proposed HITL restriction clause language","Advise whether Addendum A disclosure is sufficient or needs amendment"]},{name:"Contracts COE (or affiliate escalation path)",email:"",topic:"TfC/prepay exposure: pro-rata refund vs quarterly billing",urgency:"Standard",brief:"WO 10 requires annual prepayment of $617,953 ($205,984 at execution + $411,969 Aug/Sep). The 30% discount ($264,837) is conditioned on annual prepay. MSA \xA713.4 states that on TfC for SaaS subscriptions, Lilly remains liable for unused remainder up to 12 months. Combined with prepayment, up to $617,953 may be unrecoverable if Lilly terminates for convenience. MSA \xA74.4 standard payment terms are Net-60; annual prepay deviates. Two paths: (1) add a pro-rata refund clause for unused prepaid fees on TfC, or (2) switch to quarterly billing at a reduced discount (~20%). Please advise on preferred approach.",asks:["Advise on pro-rata refund clause vs quarterly billing for TfC exposure","Confirm whether annual prepay deviation from Net-60 needs additional approval"]},{name:"Cyber ISS Review",email:"Cyber_ISS_Review@lilly.com",topic:"Data escrow decision; SFTP/API integration security review",urgency:"Standard",brief:"WO 10 involves SFTP/API file transfer of Lilly Direct call recordings to Supplier A's Azure-hosted platform (Central US, East US, East US 2). The WO checked 'No' on data escrow. Given the volume (180K calls/year with patient/HCP/caregiver conversations), please confirm: (1) data escrow decision is appropriate, and (2) SFTP/API integration meets ISS requirements.",asks:["Confirm data escrow 'No' is appropriate for this scope","Review SFTP/API integration security posture"]}],pricing:{pre:882790,disc:264837,net:617953,components:[{n:"Platform (Insights+Quality)",v:49340,p:"5.6%"},{n:"AI Compute (Insights+Quality)",v:670800,p:"76.0%"},{n:"Professional Services",v:162650,p:"18.4%"},{n:"30% Discount",v:-264837,p:"-30.0%"}],waterfall:[{layer:"Gross list (implied)",val:"~$1.96M",note:"Estimated from stated 40-60% line-item discounts"},{layer:"Layer 1: Line-item discounts (40-60%)",val:"-~$1.08M",note:"Applied per line; waived items ($0) absorb cost into remaining lines"},{layer:"Subtotal after Layer 1",val:"$882,790",note:"Sum of discounted line items"},{layer:"Layer 2: Blanket 30%",val:"-$264,837",note:"Conditioned on annual prepay + June 15 execution"},{layer:"Net annual",val:"$617,953",note:"Final price after all layers"}],counter:[["Confirm 'per month' volume","Entire pricing basis unverifiable without it","Must-have"],["Pro-rata TfC refund or quarterly billing","Up to $617,953 unrecoverable on early termination","High"],["Remove/extend June 15 deadline","$264,837 at risk if review takes long
