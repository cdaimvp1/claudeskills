<script>
/* =============================================================================
 * helpers.js — shared render + interaction helpers for the Deal artifact.
 * The 5 tab builders (Brief / Contract / Commercials / Negotiation / Sources)
 * MUST use these verbatim so the artifact reads as one system.
 *
 * ─────────────────────────  BUILDER CONVENTION  ─────────────────────────────
 * 1. Every helper that renders returns an HTML STRING. Compose with template
 *    literals; never build detached DOM in a builder.
 * 2. Each tab builder is a function on window.DealTabs, e.g.
 *        window.DealTabs.brief = (d) => `...html...`;   // d === dashboardData
 *    The shell calls it once and injects the string into the tab panel.
 * 3. STRUCTURE the shell (built by the shell author, not the tab builders):
 *        <div class="tabbar"><div class="wrap">
 *           <button class="tab-btn" data-tab="brief" ...>…</button> … </div></div>
 *        <div data-tabpanel="brief">…</div>  (one per tab)
 *    Subtabs INSIDE a panel:
 *        <div class="subtabbar" data-subtab-group="contract"><div class="wrap">
 *           <button class="subtab-btn" data-subtab="map">…</button> …</div></div>
 *        <div data-subpanel="contract/map">…</div>  (id = "group/key")
 * 4. Interaction is DELEGATED and wired on load by DealUI.init() — builders only
 *    emit the right data-attributes (documented per helper below). No inline
 *    onclick. Allowed controls ONLY: show-evidence, expand/collapse, filter,
 *    sort, change-assumption+recalc+reset, copy, print, jump. Nothing else.
 * 5. Assumptions: emit assumptionSlider(a); register a recompute callback with
 *    DealUI.onRecalc(fn). Editing any slider updates dashboardData.assumptions
 *    live value and runs every registered fn. resetAssumptions() restores.
 * 6. EVERY material value must be followed by evidenceChip(type). No exceptions.
 * ─────────────────────────────────────────────────────────────────────────── */
(function (global) {
'use strict';

/* ---------- 0. tiny utils ------------------------------------------------- */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = (n, opts) => {
  if (n == null || isNaN(n)) return '—';
  const o = opts || {};
  if (o.compact && Math.abs(n) >= 1000) {
    const m = n / 1e6;
    return '$' + (Math.abs(m) >= 1 ? m.toFixed(2).replace(/\.00$/, '') + 'M'
                                   : (n / 1e3).toFixed(0) + 'K');
  }
  return '$' + Math.round(n).toLocaleString('en-US');
};
const pct = (n, d) => (n == null ? '—' : (d ? n.toFixed(d) : Math.round(n)) + '%');
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const uid = (() => { let i = 0; return (p) => (p || 'u') + '-' + (++i); })();

/* ---------- 1. ICON LIBRARY (inline SVG, no external assets) -------------- */
// Usage: icon('scale')  ->  '<svg …>…</svg>'. Add new icons HERE only.
const ICONS = {
  brief:     '<path d="M4 4h16v16H4z" opacity=".0"/><path d="M6 4h9l4 4v12H6z"/><path d="M15 4v4h4"/><path d="M9 13h6M9 16h4"/>',
  doc:       '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M10 12h6M10 15h6M10 18h3"/>',
  scale:     '<path d="M12 3v18"/><path d="M6 7h12"/><path d="M6 7l-3 6h6z"/><path d="M18 7l-3 6h6z"/><path d="M8 21h8"/>',
  shield:    '<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/>',
  money:     '<path d="M12 2v20M17 6.5c0-1.9-2.2-3-5-3s-5 1.3-5 3.2c0 4.3 10 2.2 10 6.6 0 1.9-2.2 3.2-5 3.2s-5-1.1-5-3"/>',
  scenarios: '<path d="M4 19V5M4 19h16"/><path d="M8 15l3-4 3 2 4-6"/>',
  bench:     '<path d="M4 20V4M4 20h16"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/>',
  handshake: '<path d="M8 12l3 3 2-2 3 3"/><path d="M3 8l4-2 5 3 5-3 4 2v6l-4 3-5-4-5 4-4-3z"/>',
  target:    '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/>',
  trade:     '<path d="M4 8h13l-3-3M20 16H7l3 3"/>',
  meeting:   '<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 21h8M12 18v3"/>',
  sources:   '<path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2"/>',
  assume:    '<path d="M12 3a9 9 0 100 18 9 9 0 000-18z"/><path d="M9.5 9a2.5 2.5 0 013.9-2c1.3.8 1 2.4-.4 3.2-.9.5-1 .9-1 1.8"/><path d="M12 17h.01"/>',
  gap:       '<path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.4 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  raci:      '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/>',
  clock:     '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  flag:      '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  eye:       '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  copy:      '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h8"/>',
  print:     '<path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M8 17h8v4H8z"/>',
  reset:     '<path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3M3 3v4h4"/>',
  chevron:   '<path d="M9 6l6 6-6 6"/>',
  info:      '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'
};
function icon(name) {
  return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.info) + '</svg>';
}

/* ---------- 2. EVIDENCE + COVERAGE ---------------------------------------- */
// evidenceType set (matches data.js): contract|internal|public|calculated|inference|assumption|unavailable
const EV_META = {
  contract:    { label: 'Contract fact',   cls: 'ev-contract' },
  internal:    { label: 'Internal fact',   cls: 'ev-internal' },
  public:      { label: 'Public fact',     cls: 'ev-public' },
  calculated:  { label: 'Calculated',      cls: 'ev-calculated' },
  inference:   { label: 'Claude inference',cls: 'ev-inference' },
  assumption:  { label: 'User assumption', cls: 'ev-assumption' },
  unavailable: { label: 'Unavailable',     cls: 'ev-unavailable' }
};
// evidenceChip(type, {short, sources}) -> chip; if sources given, becomes a jump-to-source affordance.
function evidenceChip(type, opts) {
  const o = opts || {}; const m = EV_META[type] || EV_META.inference;
  const txt = o.short ? m.label.split(' ')[0] : m.label;
  const src = (o.sources && o.sources.length)
    ? ' data-jump="tab:sources/sub:sources" title="' + esc(m.label) + ' · ' + esc(o.sources.join(', ')) + '"'
    : ' title="' + esc(m.label) + '"';
  return '<span class="ev ' + m.cls + '"' + src + '>' + esc(txt) + '</span>';
}
// coverageBadge('Strong'|'Moderate'|'Limited')
function coverageBadge(level) {
  const key = String(level || '').toLowerCase();
  const cls = key === 'strong' ? 'cov-strong' : key === 'limited' ? 'cov-limited' : 'cov-moderate';
  return '<span class="cov ' + cls + '"><span class="dots"><i></i><i></i><i></i></span>' +
         esc(level || 'Moderate') + ' evidence</span>';
}

/* ---------- 3. SEVERITY / STATUS PILLS ------------------------------------ */
const SEV_LABEL = { 'hard-stop':'Hard stop', high:'High', medium:'Medium', low:'Low' };
function severityPill(priority) {
  const p = priority || 'medium';
  return '<span class="pill sev-' + esc(p) + '">' + esc(SEV_LABEL[p] || p) + '</span>';
}
function statusPill(status, label) {
  const map = { aligned:'ok', partial:'warn', deviation:'danger', missing:'muted',
                accept:'ok', reject:'danger', trade:'info', pending:'warn' };
  return '<span class="pill ' + (map[status] || 'muted') + '">' + esc(label || status) + '</span>';
}

/* ---------- 4. SA-CARD ---------------------------------------------------- */
// saCard(title, innerHTML, {accent:'plum'|'teal'|'emph'|'danger'|'warn', icon:'scale',
//                           sub:'right-aligned meta html', id, bodyClass})
function saCard(title, inner, opts) {
  const o = opts || {};
  const acc = o.accent && o.accent !== 'plum' ? ' accent-' + o.accent : '';
  const ic = o.icon ? '<span class="ch-ic">' + icon(o.icon) + '</span>' : '';
  const sub = o.sub ? '<span class="cs">' + o.sub + '</span>' : '';
  const id = o.id ? ' id="' + esc(o.id) + '"' : '';
  const bc = o.bodyClass ? ' ' + o.bodyClass : '';
  return '<section class="sa-card' + acc + '"' + id + '>' +
    '<header class="card-hd">' + ic + '<span class="ct">' + esc(title) + '</span>' + sub + '</header>' +
    '<div class="card-bd' + bc + '">' + (inner || '') + '</div></section>';
}
// insight(text, tone) — a SHORT supporting narrative line (never a wall). tone: ''|'warn'|'danger'
function insight(text, tone) {
  return '<div class="insight ' + (tone || '') + '"><span class="ib"></span><span>' + text + '</span></div>';
}

/* ---------- 5. TABLE ------------------------------------------------------ */
// dataTable(cols, rows, opts)
//   cols: [{ key, label, align:'left'|'num', width, sort:true, render:(row)=>html }]
//   rows: array of plain objects
//   opts: { zebra, dense, id, sortable:true, filterId, rowClass:(row)=>'', expand:(row)=>html|null }
// Emits sortable headers (th[data-sort]) and, when expand() returns html, expandable rows.
function dataTable(cols, rows, opts) {
  const o = opts || {}; const tid = o.id || uid('tbl');
  const head = '<tr>' + cols.map(c => {
    const cls = (c.align === 'num' ? 'num' : '');
    const st = (o.sortable !== false && c.sort !== false) ? ' data-sort="' + esc(c.key) + '"' : '';
    const w = c.width ? ' style="width:' + esc(c.width) + '"' : '';
    return '<th class="' + cls + '"' + st + w + '>' + esc(c.label) + '</th>';
  }).join('') + '</tr>';
  const body = rows.map((r, i) => {
    const rc = o.rowClass ? o.rowClass(r) : '';
    const exp = o.expand ? o.expand(r) : null;
    const key = (r.id != null ? r.id : i);
    let tr = '<tr class="' + rc + (exp ? ' expandable' : '') + '"' +
      (exp ? ' data-exprow="' + esc(tid + '-' + key) + '"' : '') +
      ' data-rowkey="' + esc(key) + '">' +
      cols.map(c => {
        const cls = (c.align === 'num' ? 'num' : '');
        const val = c.render ? c.render(r) : esc(r[c.key]);
        const sv = c.sortVal ? ' data-sv="' + esc(c.sortVal(r)) + '"' : '';
        return '<td class="' + cls + '"' + sv + '>' + val + '</td>';
      }).join('') + '</tr>';
    if (exp) tr += '<tr class="expander-row is-hidden" data-expfor="' + esc(tid + '-' + key) +
      '"><td colspan="' + cols.length + '"><div class="exp-inner">' + exp + '</div></td></tr>';
    return tr;
  }).join('');
  const cls = 'dt' + (o.zebra ? ' zebra' : '') + (o.dense ? ' dense' : '');
  const filterAttr = o.filterId ? ' data-filter-target="' + esc(o.filterId) + '"' : '';
  return '<div class="tbl-wrap"><table class="' + cls + '" id="' + esc(tid) + '"' + filterAttr +
    '><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}

/* ---------- 6. COLLAPSIBLE / EXCERPT -------------------------------------- */
// collapsible(summaryHTML, innerHTML, {open, tone}) -> <details>
function collapsible(summary, inner, opts) {
  const o = opts || {};
  return '<details class="collapsible"' + (o.open ? ' open' : '') + '>' +
    '<summary>' + summary + '</summary><div class="cl-body">' + inner + '</div></details>';
}
function excerpt(text) { return '<div class="excerpt">' + esc(text) + '</div>'; }

/* ---------- 7. VIZ PRIMITIVES --------------------------------------------- */
// miniBar(value, max, {color:'teal'|'pri'|'emph'|'danger'|'warn', title}) -> inline bar
function miniBar(value, max, opts) {
  const o = opts || {}; const w = clamp(max ? (value / max) * 100 : 0, 0, 100);
  const c = o.color && o.color !== 'teal' ? ' ' + o.color : '';
  const t = o.title ? ' title="' + esc(o.title) + '"' : '';
  return '<span class="minibar' + c + '"' + t + '><span style="width:' + w.toFixed(1) + '%"></span></span>';
}
// barRow(label, value, max, formatted, opts) -> a labelled comparison bar row
function barRow(label, value, max, formatted, opts) {
  return '<div class="bar-row"><span class="bl">' + esc(label) + '</span>' +
    miniBar(value, max, opts) + '<span class="bv">' + (formatted != null ? formatted : value) + '</span></div>';
}
// heatCell(value, {scale:5, label, title}) -> intensity cell (0..scale -> heat-0..heat-5)
function heatCell(value, opts) {
  const o = opts || {}; const scale = o.scale || 5;
  const lvl = clamp(Math.round((value / scale) * 5), 0, 5);
  const t = o.title ? ' title="' + esc(o.title) + '"' : '';
  return '<span class="heatcell heat-' + lvl + '"' + t + '>' + esc(o.label != null ? o.label : value) + '</span>';
}
// matrixPlot(points, {xLabel, yLabel, xMax, yMax, quadrants:[tl,tr,bl,br]})
//   points: [{ x, y, label, color:'pri'|'teal'|'emph'|'danger', title, jump }]
function matrixPlot(points, opts) {
  const o = opts || {}; const xMax = o.xMax || 5, yMax = o.yMax || 5;
  const pts = points.map(p => {
    const left = clamp((p.x / xMax) * 100, 2, 98);
    const bottom = clamp((p.y / yMax) * 100, 2, 98);
    const c = p.color ? ' ' + p.color : '';
    const j = p.jump ? ' data-jump="' + esc(p.jump) + '"' : '';
    return '<button class="mx-pt' + c + '" style="left:' + left.toFixed(1) + '%;bottom:' + bottom.toFixed(1) +
      '%"' + j + ' title="' + esc(p.title || p.label) + '">' + esc(p.label) + '</button>';
  }).join('');
  const q = o.quadrants || [];
  const quad = (q.length === 4) ?
    '<span class="mx-quad" style="left:2%;top:4%">' + esc(q[0]) + '</span>' +
    '<span class="mx-quad" style="right:2%;top:4%">' + esc(q[1]) + '</span>' +
    '<span class="mx-quad" style="left:2%;bottom:4%">' + esc(q[2]) + '</span>' +
    '<span class="mx-quad" style="right:2%;bottom:4%">' + esc(q[3]) + '</span>' : '';
  return '<div style="padding:0 10px 26px 20px"><div class="matrix">' + quad + pts +
    '<span class="mx-axis-x">' + esc(o.xLabel || '') + '</span>' +
    '<span class="mx-axis-y">' + esc(o.yLabel || '') + '</span></div></div>';
}
// waterfall(steps, {height}) steps:[{label, value, kind:'total'|'up'|'down'|'final', display}]
//   Bars are sized to each step's absolute value against the max; kind sets colour + meaning.
function waterfall(steps, opts) {
  const o = opts || {}; const max = Math.max.apply(null, steps.map(s => Math.abs(s.value))) || 1;
  const cols = steps.map(s => {
    const h = clamp((Math.abs(s.value) / max) * 100, 3, 100);
    return '<div class="wf-col"><span class="wf-val">' + (s.display != null ? s.display : s.value) + '</span>' +
      '<div class="wf-bar ' + (s.kind || 'total') + '" style="height:' + h.toFixed(1) + '%"></div>' +
      '<span class="wf-lbl">' + esc(s.label) + '</span></div>';
  }).join('');
  return '<div class="waterfall">' + cols + '</div>';
}
// timeline(items) items:[{date, name, meta, tone:'pri'|'emph'|''}]
function timeline(items) {
  return '<div class="timeline"><span class="tl-track"></span>' + items.map(it =>
    '<div class="tl-item ' + (it.tone || '') + '"><div class="tl-date">' + esc(it.date) + '</div>' +
    '<div class="tl-name">' + esc(it.name) + '</div>' +
    (it.meta ? '<div class="tl-meta">' + it.meta + '</div>' : '') + '</div>').join('') + '</div>';
}
// gantt(rows, {start, end}) rows:[{label, start, end, tone}] dates as YYYY-MM-DD; positions by day.
function gantt(rows, opts) {
  const o = opts || {}; const t0 = +new Date(o.start), t1 = +new Date(o.end); const span = (t1 - t0) || 1;
  const body = rows.map(r => {
    const a = clamp(((+new Date(r.start) - t0) / span) * 100, 0, 100);
    const b = clamp(((+new Date(r.end) - t0) / span) * 100, 0, 100);
    return '<div class="gantt-row"><span class="bl" style="font-weight:600">' + esc(r.label) + '</span>' +
      '<div class="gantt-track"><div class="gantt-fill ' + (r.tone || '') + '" style="left:' + a.toFixed(1) +
      '%;width:' + Math.max(b - a, 4).toFixed(1) + '%">' + esc(r.badge || '') + '</div></div></div>';
  }).join('');
  return '<div class="gantt">' + body + '</div>';
}

/* ---------- 8. ASSUMPTION SLIDER (LOCAL) ---------------------------------- */
// assumptionSlider(a) — a is a dashboardData.assumptions[] entry.
// Emits a range input wired to DealUI; editing updates a.value and runs recalc callbacks.
function assumptionSlider(a) {
  const disp = a.unit === '%' ? a.value + '%' : (a.value.toLocaleString('en-US') + (a.unit ? ' ' + a.unit : ''));
  return '<div class="asm-ctrl">' +
    '<div class="asm-top"><label for="asm-' + esc(a.id) + '">' + esc(a.label) + '</label>' +
    '<span class="asm-val" data-asm-out="' + esc(a.id) + '">' + esc(disp) + '</span></div>' +
    '<input type="range" id="asm-' + esc(a.id) + '" data-assumption="' + esc(a.id) + '" data-unit="' + esc(a.unit || '') +
    '" min="' + a.min + '" max="' + a.max + '" step="' + a.step + '" value="' + a.value + '">' +
    '<div class="asm-badge">' + evidenceChip(a.evidenceType || a.classification, { short: true }) +
    ' <span class="local-flag">Local</span> · materiality: ' + esc(a.materiality) + '</div></div>';
}

/* ---------- 9. GAP CARD (renders instead of a fabricated empty panel) ----- */
function gapCard(title, note) {
  return '<div class="gap-card"><div class="gc-hd">' + icon('gap') + esc(title) + '</div>' +
    '<div class="card-note" style="margin-top:6px">' + note + '</div></div>';
}

/* ---------- 10. jump helper (for building data-jump strings) -------------- */
// jumpLink(text, target) target: "tab:commercials/sub:scenarios" or "el:SOME-ID"
function jumpLink(text, target) {
  return '<span class="jump" data-jump="' + esc(target) + '">' + esc(text) + '</span>';
}
function copyBtn(label, targetSel, rawText) {
  const data = rawText != null ? ' data-copy-text="' + esc(rawText) + '"' : ' data-copy="' + esc(targetSel) + '"';
  return '<button class="btn"' + data + '>' + icon('copy') + esc(label || 'Copy') + '</button>';
}

/* =========================================================================
 *  INTERACTION LAYER — DealUI  (wired once on load via DealUI.init())
 * ========================================================================= */
const recalcFns = [];
const assumptionOriginals = {};

const DealUI = {
  onRecalc(fn) { if (typeof fn === 'function') recalcFns.push(fn); },
  recalc() { recalcFns.forEach(fn => { try { fn(global.dashboardData); } catch (e) { console.error(e); } }); },

  // ---- tab + subtab routing ----
  showTab(key) {
    document.querySelectorAll('[data-tab]').forEach(b =>
      b.setAttribute('aria-selected', b.getAttribute('data-tab') === key ? 'true' : 'false'));
    document.querySelectorAll('[data-tabpanel]').forEach(p =>
      p.classList.toggle('is-active', p.getAttribute('data-tabpanel') === key));
    if (history.replaceState) history.replaceState(null, '', '#' + key);
    window.scrollTo({ top: 0, behavior: 'auto' });
  },
  showSubtab(group, key) {
    document.querySelectorAll('[data-subtab-group="' + group + '"] [data-subtab]').forEach(b =>
      b.setAttribute('aria-selected', b.getAttribute('data-subtab') === key ? 'true' : 'false'));
    document.querySelectorAll('[data-subpanel]').forEach(p => {
      const id = p.getAttribute('data-subpanel');
      if (id.indexOf(group + '/') === 0) p.classList.toggle('is-active', id === group + '/' + key);
    });
  },
  jump(target) {
    // "tab:contract/sub:terms"  |  "tab:brief"  |  "el:ISS-01"
    if (target.indexOf('el:') === 0) {
      const el = document.getElementById(target.slice(3));
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200); }
      return;
    }
    const tabM = target.match(/tab:([^/]+)/); const subM = target.match(/sub:([^/]+)/);
    if (tabM) this.showTab(tabM[1]);
    if (subM && tabM) this.showSubtab(tabM[1], subM[1]);
  },

  toast(msg) {
    let t = document.querySelector('.copied-toast');
    if (!t) { t = document.createElement('div'); t.className = 'copied-toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show'); clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 1500);
  },

  init() {
    // snapshot originals for reset
    (global.dashboardData.assumptions || []).forEach(a => { assumptionOriginals[a.id] = a.value; });

    // one delegated click handler for the whole document
    document.addEventListener('click', (e) => {
      const t = e.target.closest('[data-tab],[data-subtab],[data-jump],[data-copy],[data-copy-text],[data-print],[data-reset-assumptions],[data-exprow],tr.expandable,[data-filterchip],[data-theme-toggle]');
      if (!t) return;

      if (t.hasAttribute('data-tab')) { this.showTab(t.getAttribute('data-tab')); return; }
      if (t.hasAttribute('data-subtab')) {
        const grp = t.closest('[data-subtab-group]');
        if (grp) this.showSubtab(grp.getAttribute('data-subtab-group'), t.getAttribute('data-subtab'));
        return;
      }
      if (t.hasAttribute('data-jump')) { this.jump(t.getAttribute('data-jump')); return; }
      if (t.hasAttribute('data-print')) { window.print(); return; }
      if (t.hasAttribute('data-theme-toggle')) {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : (cur === 'light' ? 'dark'
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'));
        document.documentElement.setAttribute('data-theme', next); return;
      }
      if (t.hasAttribute('data-reset-assumptions')) { this.resetAssumptions(); return; }
      if (t.hasAttribute('data-copy') || t.hasAttribute('data-copy-text')) {
        let text = t.getAttribute('data-copy-text');
        if (text == null) { const el = document.querySelector(t.getAttribute('data-copy')); text = el ? el.innerText : ''; }
        this.copy(text); return;
      }
      // expandable table rows
      const rowKey = t.getAttribute('data-exprow') || (t.matches('tr.expandable') ? t.getAttribute('data-exprow') : null);
      if (rowKey) {
        t.classList.toggle('is-open');
        const exp = document.querySelector('[data-expfor="' + rowKey + '"]');
        if (exp) exp.classList.toggle('is-hidden');
        return;
      }
    });

    // assumptions: live update + recalc
    document.addEventListener('input', (e) => {
      const inp = e.target.closest('[data-assumption]');
      if (!inp) return;
      const id = inp.getAttribute('data-assumption');
      const a = (global.dashboardData.assumptions || []).find(x => x.id === id);
      if (!a) return;
      a.value = parseFloat(inp.value);
      const out = document.querySelector('[data-asm-out="' + id + '"]');
      if (out) out.textContent = a.unit === '%' ? a.value + '%'
        : (a.value.toLocaleString('en-US') + (a.unit ? ' ' + a.unit : ''));
      this.recalc();
    });

    // filter inputs (search box) + sortable headers
    document.addEventListener('input', (e) => {
      const box = e.target.closest('[data-filter-input]');
      if (box) this.applyFilter(box);
    });
    document.addEventListener('change', (e) => {
      const sel = e.target.closest('[data-filter-select]');
      if (sel) this.applyFilter(sel);
    });
    document.querySelectorAll('table.dt th[data-sort]').forEach(th =>
      th.addEventListener('click', () => this.sortTable(th)));
    // chip filters (aria-pressed toggles)
    document.addEventListener('click', (e) => {
      const chip = e.target.closest('[data-filterchip]');
      if (!chip) return;
      const on = chip.getAttribute('aria-pressed') === 'true';
      chip.setAttribute('aria-pressed', on ? 'false' : 'true');
      this.applyChipFilters(chip.closest('[data-filter-scope]') || document);
    });

    // deep-link to a tab via hash
    const h = (location.hash || '').replace('#', '');
    if (h && document.querySelector('[data-tabpanel="' + h + '"]')) this.showTab(h);
    else { const first = document.querySelector('[data-tab]'); if (first) this.showTab(first.getAttribute('data-tab')); }

    this.recalc();
  },

  copy(text) {
    const done = () => this.toast('Copied to clipboard');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => this.fallbackCopy(text, done));
    } else this.fallbackCopy(text, done);
  },
  fallbackCopy(text, cb) {
    const ta = document.createElement('textarea'); ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) {} document.body.removeChild(ta);
  },

  resetAssumptions() {
    (global.dashboardData.assumptions || []).forEach(a => {
      a.value = assumptionOriginals[a.id];
      const inp = document.querySelector('[data-assumption="' + a.id + '"]');
      if (inp) inp.value = a.value;
      const out = document.querySelector('[data-asm-out="' + a.id + '"]');
      if (out) out.textContent = a.unit === '%' ? a.value + '%'
        : (a.value.toLocaleString('en-US') + (a.unit ? ' ' + a.unit : ''));
    });
    this.recalc(); this.toast('Assumptions reset');
  },

  // free-text filter over a target table (data-filter-input has data-filter-for="tableId")
  applyFilter(control) {
    const scope = control.closest('[data-filter-scope]') || document;
    const tableId = control.getAttribute('data-filter-for');
    const table = tableId ? document.getElementById(tableId) : scope.querySelector('table.dt');
    if (!table) return;
    const q = (scope.querySelector('[data-filter-input]') || {}).value || '';
    this._filterTable(table, q.toLowerCase(), scope);
  },
  applyChipFilters(scope) {
    const table = scope.querySelector('table.dt'); if (!table) return;
    const box = scope.querySelector('[data-filter-input]');
    this._filterTable(table, ((box && box.value) || '').toLowerCase(), scope);
  },
  _filterTable(table, q, scope) {
    const chips = Array.from(scope.querySelectorAll('[data-filterchip][aria-pressed="true"]'))
      .map(c => c.getAttribute('data-filterchip').toLowerCase());
    let shown = 0, total = 0;
    table.querySelectorAll('tbody tr').forEach(tr => {
      if (tr.classList.contains('expander-row')) { return; }
      total++;
      const txt = tr.textContent.toLowerCase();
      const facet = (tr.getAttribute('data-facet') || '').toLowerCase();
      const okText = !q || txt.indexOf(q) !== -1;
      const okChip = !chips.length || chips.some(c => facet.split(' ').indexOf(c) !== -1 || facet.indexOf(c) !== -1);
      const show = okText && okChip;
      tr.classList.toggle('is-hidden', !show);
      const exp = tr.getAttribute('data-exprow');
      if (exp) { const e2 = table.querySelector('[data-expfor="' + exp + '"]');
        if (e2 && !tr.classList.contains('is-open')) e2.classList.add('is-hidden');
        if (e2 && !show) e2.classList.add('is-hidden'); }
      if (show) shown++;
    });
    const cnt = scope.querySelector('.filter-count');
    if (cnt) cnt.textContent = shown + ' of ' + total + ' shown';
  },

  sortTable(th) {
    const table = th.closest('table'); const tbody = table.querySelector('tbody');
    const idx = Array.from(th.parentNode.children).indexOf(th);
    const cur = th.getAttribute('aria-sort');
    const dir = cur === 'ascending' ? 'descending' : 'ascending';
    table.querySelectorAll('th[data-sort]').forEach(h => h.removeAttribute('aria-sort'));
    th.setAttribute('aria-sort', dir);
    // group main rows with their (optional) expander rows
    const rows = Array.from(tbody.querySelectorAll('tr')).filter(r => !r.classList.contains('expander-row'));
    const getVal = (tr) => {
      const td = tr.children[idx]; if (!td) return '';
      const sv = td.getAttribute('data-sv'); if (sv != null) { const n = parseFloat(sv); return isNaN(n) ? sv : n; }
      const n = parseFloat(td.textContent.replace(/[^0-9.\-]/g, ''));
      return isNaN(n) ? td.textContent.trim().toLowerCase() : n;
    };
    rows.sort((a, b) => {
      const va = getVal(a), vb = getVal(b);
      if (va < vb) return dir === 'ascending' ? -1 : 1;
      if (va > vb) return dir === 'ascending' ? 1 : -1;
      return 0;
    });
    rows.forEach(r => {
      tbody.appendChild(r);
      const exp = r.getAttribute('data-exprow');
      if (exp) { const e2 = tbody.querySelector('[data-expfor="' + exp + '"]'); if (e2) tbody.appendChild(e2); }
    });
  }
};

/* ---------- EXPORTS ------------------------------------------------------- */
const api = {
  // formatting
  esc, money, pct, uid, icon,
  // evidence + status
  evidenceChip, coverageBadge, severityPill, statusPill,
  // layout
  saCard, insight, dataTable, collapsible, excerpt, gapCard, jumpLink, copyBtn,
  // viz
  miniBar, barRow, heatCell, matrixPlot, waterfall, timeline, gantt, assumptionSlider,
  // interaction
  DealUI
};
Object.assign(global, api);            // expose helpers as globals for terse builders
global.DealUI = DealUI;
global.DealTabs = global.DealTabs || {};   // builders attach: DealTabs.brief = d => '...'
global.dealRecalc = () => DealUI.recalc();  // brief-named recalc hook

if (document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', () => DealUI.init());
else DealUI.init();

})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/* =============================================================================
 * tab-brief.js — "Brief" tab: the 2-minute pre-meeting readout.
 * NO subtabs (per DEAL-REDESIGN-BRIEF.md). Reads ONLY from dashboardData (param d);
 * every fact is looked up from the canonical model, never re-authored.
 *
 * Sections (top -> bottom):
 *   1. Recommended position (stance + rationale + conditions + limitations)
 *   2. Deal snapshot (kv facts)
 *   3. Issue landscape — category x priority heatmap (dominant visual)
 *   4. Top 5 issues (expandable register excerpt)
 *   5. Negotiation boundaries (target / fallback / hard-stop for the signature issues)
 *   6. Commercial headline (scenario Y1 comparison + 3-yr TCV gap)
 *   7. Immediate next actions (meeting sequence, planning not tasks)
 *   8. Critical unknowns (top gaps)
 * ========================================================================== */
function renderTab_brief(d) {
  const rankPriority = { 'hard-stop': 4, high: 3, medium: 2, low: 1 };
  const rankGap = { critical: 3, important: 2, helpful: 1 };
  const priorityOrder = ['hard-stop', 'high', 'medium', 'low'];
  const priorityLabel = { 'hard-stop': 'Hard stop', high: 'High', medium: 'Medium', low: 'Low' };
  const contractSetLabel = {
    'msa-only': 'MSA only',
    'sow-under-msa': 'SOW under existing MSA',
    'new-msa-plus-sow': 'New MSA + initial SOW',
    'multiple-sows': 'Multiple SOWs',
    'amendment': 'Amendment',
    'renewal': 'Renewal'
  }[d.meta.contractSet] || d.meta.contractSet;

  const rec = d.deal.recommendation;
  const sortedIssues = d.issues.slice().sort((a, b) => (rankPriority[b.priority] || 0) - (rankPriority[a.priority] || 0));
  const topIssues = sortedIssues.slice(0, 5);

  /* ============================= 1. RECOMMENDED POSITION ============================= */
  const recapText = [
    rec.stance, '', rec.headline, '', rec.rationale, '',
    'Conditions to close before signature:',
    ...rec.conditions.map(c => '- ' + c.text),
    '', 'Analysis limitations:',
    ...rec.limitations.map(l => '- ' + l)
  ].join('\n');

  const recommendationHTML = `
    <div class="eyebrow" style="color:var(--pri-tx);font-size:13px;letter-spacing:.03em;margin-bottom:5px">${esc(rec.stance)}</div>
    <p style="font-weight:700;font-size:14.5px;line-height:1.4;margin:0 0 8px">${esc(rec.headline)}</p>
    <p style="font-size:var(--fz-sm);color:var(--ink2);line-height:1.55;margin:0 0 13px">${esc(rec.rationale)}</p>
    <div class="eyebrow" style="margin-bottom:7px">Conditions before signature</div>
    <div class="kv" style="grid-template-columns:1fr;gap:9px;margin-bottom:4px">
      ${rec.conditions.map(c => {
        const iss = d.issues.find(i => i.id === c.issueId);
        return `<dd style="display:block;padding-bottom:8px;border-bottom:1px solid var(--line)">
          <div style="font-weight:600;margin-bottom:3px">${esc(c.text)}</div>
          ${evidenceChip(iss ? iss.evidenceType : 'inference', { short: true, sources: iss ? iss.sourceIds : [] })}
          ${jumpLink('View in register →', 'tab:contract/sub:terms')}
        </dd>`;
      }).join('')}
    </div>
    ${collapsible(
      '<span>Analysis limitations (' + rec.limitations.length + ')</span>',
      '<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">' +
        rec.limitations.map(l => `<li style="font-size:var(--fz-sm);color:var(--ink2)">${esc(l)}</li>`).join('') +
      '</ul>',
      { open: true }
    )}
    <div class="btn-row">${copyBtn('Copy recommendation', null, recapText)}</div>
  `;

  /* ============================= 2. DEAL SNAPSHOT ============================= */
  const snap = d.deal;
  const snapshotHTML = `
    <dl class="kv">
      <dt>Deal</dt><dd>${esc(snap.title)}</dd>
      <dt>Supplier</dt><dd>${esc(snap.supplier)} <span class="tiny muted">(${esc(snap.supplierCategory)})</span></dd>
      <dt>Type</dt><dd>${esc(snap.negotiationType)}</dd>
      <dt>Contract set</dt><dd>${esc(contractSetLabel)}</dd>
      <dt>Stage</dt><dd>${esc(snap.stage)}</dd>
      <dt>Counterparties</dt><dd>${esc(snap.counterparties.buyer)} <span class="muted">&harr;</span> ${esc(snap.counterparties.supplier)}</dd>
      <dt>Analysis date</dt><dd class="mono">${esc(snap.analysisDate)}</dd>
      <dt>Evidence</dt><dd>${coverageBadge(snap.evidenceCoverage)}</dd>
    </dl>
    <div class="card-note">${esc(d.meta.disclaimer)}</div>
  `;

  /* ============================= 3. ISSUE LANDSCAPE HEATMAP ============================= */
  const categories = d.analysisAreas;
  const counts = {};
  categories.forEach(cat => { counts[cat] = {}; priorityOrder.forEach(p => { counts[cat][p] = 0; }); });
  d.issues.forEach(iss => { if (counts[iss.category]) counts[iss.category][iss.priority]++; });
  let maxCellCount = 1;
  categories.forEach(cat => priorityOrder.forEach(p => { maxCellCount = Math.max(maxCellCount, counts[cat][p]); }));
  const totalsByPriority = {};
  priorityOrder.forEach(p => { totalsByPriority[p] = d.issues.filter(i => i.priority === p).length; });

  const heatRows = categories.map(cat => {
    const cells = priorityOrder.map(p => {
      const v = counts[cat][p];
      const cellHTML = heatCell(v, { scale: maxCellCount, label: v || '–', title: cat + ' · ' + priorityLabel[p] + ': ' + v + ' issue' + (v === 1 ? '' : 's') });
      return `<button data-jump="tab:contract/sub:terms" style="background:none;border:0;padding:0;cursor:pointer;display:flex;justify-content:center" title="${esc(cat)} · ${esc(priorityLabel[p])}">${cellHTML}</button>`;
    }).join('');
    return `<div class="hg-lbl">${esc(cat)}</div>${cells}`;
  }).join('');

  const heatmapHTML = `
    <div class="heat-grid" style="grid-template-columns:150px repeat(${priorityOrder.length},1fr);align-items:center">
      <div></div>
      ${priorityOrder.map(p => `<div class="hg-col">${esc(priorityLabel[p])}<br><span class="tiny muted">(${totalsByPriority[p]})</span></div>`).join('')}
      ${heatRows}
    </div>
    ${insight('Both hard-stop issues sit in Liability and Data &amp; Privacy; Commercial carries the largest single-category cluster of high-priority items.', 'danger')}
    ${insight('Counts are the full evidence-based register &mdash; ' + d.issues.length + ' issues across ' + categories.length + ' categories. Click any cell to open the filterable register.')}
  `;

  /* ============================= 4. TOP 5 ISSUES ============================= */
  const top5Cols = [
    { key: 'priority', label: '', width: '96px', sortVal: r => rankPriority[r.priority] || 0, render: r => severityPill(r.priority) },
    { key: 'title', label: 'Issue', render: r => `<strong>${esc(r.title)}</strong><div class="tiny muted">${esc(r.category)} · ${esc(r.clause)}</div>` },
    { key: 'ev', label: 'Evidence', width: '120px', sort: false, render: r => evidenceChip(r.evidenceType, { short: true, sources: r.sourceIds }) }
  ];
  const top5HTML = dataTable(top5Cols, topIssues, {
    id: 'brief-top-issues', zebra: true,
    expand: r => `
      <div class="kv" style="margin-bottom:10px">
        <dt>Recommended</dt><dd>${esc(r.recommendedPosition)}</dd>
        <dt>Fallback</dt><dd>${esc(r.fallback)}</dd>
        <dt>Hard stop</dt><dd style="color:var(--danger-fg);font-weight:600">${esc(r.hardStop)}</dd>
      </div>
      ${excerpt(r.sourceExcerpt)}
      <div class="btn-row">
        ${jumpLink('Full issue register →', 'tab:contract/sub:terms')}
        ${jumpLink('Negotiation position →', 'tab:negotiation/sub:positions')}
      </div>
    `
  });
  const top5SectionHTML = `
    ${top5HTML}
    ${insight('These 5 span both hard-stops plus the highest-value high-priority items; the full ' + d.issues.length + '-issue register is in Contract → Terms &amp; Risk.')}
  `;

  /* ============================= 5. NEGOTIATION BOUNDARIES ============================= */
  const boundaryCols = [
    { key: 'title', label: 'Issue', render: r => `<strong>${esc(r.title)}</strong><div class="tiny muted">${esc(r.clause)}</div>` },
    { key: 'target', label: 'Target / ask for', render: r => esc(r.recommendedPosition) },
    { key: 'fallback', label: 'Fallback', render: r => esc(r.fallback) },
    { key: 'hardstop', label: 'Hard stop', render: r => `<span style="color:var(--danger-fg);font-weight:600">${esc(r.hardStop)}</span>` }
  ];
  const boundaryRows = rec.conditions.map(c => d.issues.find(i => i.id === c.issueId)).filter(Boolean);
  const boundaryHTML = `
    ${dataTable(boundaryCols, boundaryRows, { id: 'brief-boundaries', dense: true, sortable: false })}
    ${insight('All three are signature conditions — non-negotiable gates, not trade items on their own.', 'warn')}
  `;

  /* ============================= 6. COMMERCIAL HEADLINE ============================= */
  const scAsk = d.scenarios.find(s => s.id === 'SC-ask');
  const scTarget = d.scenarios.find(s => s.id === 'SC-target');
  const scFallback = d.scenarios.find(s => s.id === 'SC-fallback');
  const scMax = d.scenarios.find(s => s.id === 'SC-max');
  const maxY1 = Math.max(scAsk.y1Total, scTarget.y1Total, scFallback.y1Total, scMax.y1Total);

  // Reuse the SAME pre-computed tcvGap the persistent summary strip shows — never
  // re-derive this figure independently (would risk disagreeing with the strip).
  const tcvGapEntry = d.deal.summaryStrip.find(s => s.key === 'tcvGap') || { label: 'Target vs ask (3-yr)', value: '—', evidenceType: 'calculated' };

  function updateBriefCommercialNumbers() {
    const ask = d.scenarios.find(s => s.id === 'SC-ask');
    const target = d.scenarios.find(s => s.id === 'SC-target');
    const fallback = d.scenarios.find(s => s.id === 'SC-fallback');
    const max = d.scenarios.find(s => s.id === 'SC-max');
    const ids = { 'brief-y1-ask': ask.y1Total, 'brief-y1-target': target.y1Total, 'brief-y1-fallback': fallback.y1Total, 'brief-y1-max': max.y1Total };
    Object.keys(ids).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.textContent = money(ids[id], { compact: true });
    });
  }
  if (typeof DealUI !== 'undefined') DealUI.onRecalc(updateBriefCommercialNumbers);

  const commercialHTML = `
    ${barRow('Ask', scAsk.y1Total, maxY1, `<span id="brief-y1-ask">${money(scAsk.y1Total, { compact: true })}</span>`, { color: 'danger' })}
    ${barRow('Target', scTarget.y1Total, maxY1, `<span id="brief-y1-target">${money(scTarget.y1Total, { compact: true })}</span>`, { color: 'pri' })}
    ${barRow('Fallback', scFallback.y1Total, maxY1, `<span id="brief-y1-fallback">${money(scFallback.y1Total, { compact: true })}</span>`, { color: 'teal' })}
    ${barRow('Max acceptable', scMax.y1Total, maxY1, `<span id="brief-y1-max">${money(scMax.y1Total, { compact: true })}</span>`, { color: 'warn' })}
    <div class="card-note">Year-1 all-in by scenario. ${esc(tcvGapEntry.label)}: <strong class="mono">${esc(tcvGapEntry.value)}</strong> ${evidenceChip(tcvGapEntry.evidenceType, { short: true })}</div>
    ${insight('Ask is anchored on platform + support loading; target reflects the internal precedent discount and day-rate norms (see Commercials → Benchmarks).')}
  `;

  /* ============================= 7. IMMEDIATE NEXT ACTIONS ============================= */
  const seqItems = d.negotiation.sequence.map(s => {
    const pkg = d.negotiation.packages.find(p => p.id === s.packageId);
    const tone = pkg ? (pkg.priority === 1 ? 'pri' : pkg.priority === 3 ? 'emph' : '') : '';
    const meta = (pkg ? `<span class="tiny muted">${esc(pkg.name)}</span> ` : '') + evidenceChip(s.evidenceType, { short: true });
    return { date: 'Step ' + s.step, name: s.text, meta, tone };
  });
  const nextActionsHTML = `
    ${timeline(seqItems)}
    ${insight('A planning sequence for the meeting, not a task list — packages so protection terms are agreed before commercials are discussed.')}
  `;

  /* ============================= 8. CRITICAL UNKNOWNS ============================= */
  const topGaps = d.gaps.slice().sort((a, b) => {
    const pr = (rankGap[b.priority] || 0) - (rankGap[a.priority] || 0);
    return pr !== 0 ? pr : (b.decisionImpact || 0) - (a.decisionImpact || 0);
  }).slice(0, 5);
  const gapCols = [
    { key: 'input', label: 'Missing input', render: r => `<strong>${esc(r.input)}</strong><div class="tiny muted">${esc(r.whyItMatters)}</div>` },
    { key: 'priority', label: 'Priority', width: '100px', render: r => `<span class="pill ${r.priority === 'critical' ? 'danger' : r.priority === 'important' ? 'warn' : 'muted'}">${esc(r.priority)}</span>` },
    { key: 'impact', label: 'Decision impact', width: '130px', align: 'num', sortVal: r => r.decisionImpact, render: r => heatCell(r.decisionImpact, { scale: 5, label: r.decisionImpact, title: 'Decision impact ' + r.decisionImpact + '/5' }) },
    { key: 'ease', label: 'Ease to get', width: '110px', align: 'num', sortVal: r => r.ease, render: r => heatCell(r.ease, { scale: 5, label: r.ease, title: 'Ease ' + r.ease + '/5' }) },
    { key: 'ev', label: 'Status', width: '116px', sort: false, render: () => evidenceChip('unavailable', { short: true }) }
  ];
  const gapsHTML = `
    ${dataTable(gapCols, topGaps, { id: 'brief-gaps', zebra: true })}
    <div class="btn-row" style="margin-top:4px">${jumpLink('Full gap register &amp; assumptions →', 'tab:sources/sub:missing')}</div>
    ${insight('Two of the top gaps (DPA text, Security Exhibit) are both critical and quick to obtain — request them before the meeting if at all possible.')}
  `;

  /* ============================= ASSEMBLE ============================= */
  return `
  <div class="tab-body"><div class="wrap">

    <div class="tab-intro">
      <h2>Pre-Meeting Brief</h2>
      <div class="q">What is being negotiated, what blocks signature, what to ask for, and what is still missing &mdash; read in about two minutes.</div>
      <div class="tiny muted" style="margin-top:7px">Session snapshot generated ${esc(d.meta.generatedAt.replace('T', ' '))} &middot; ${coverageBadge(d.deal.evidenceCoverage)} overall evidence coverage</div>
    </div>

    <div class="grid">
      <div class="col-8">${saCard('Recommended Position', recommendationHTML, { icon: 'shield', sub: esc(d.deal.stage) })}</div>
      <div class="col-4">${saCard('Deal Snapshot', snapshotHTML, { accent: 'teal', icon: 'doc', sub: esc(d.deal.projectId) })}</div>
    </div>

    <div class="grid" style="margin-top:16px">
      <div class="col-12">${saCard('Issue Landscape — Category × Priority', heatmapHTML, { icon: 'scale' })}</div>
    </div>

    <div class="grid" style="margin-top:16px">
      <div class="col-7">${saCard('Top 5 Issues', top5SectionHTML, { icon: 'flag', sub: topIssues.length + ' of ' + d.issues.length })}</div>
      <div class="col-5">${saCard('Negotiation Boundaries', boundaryHTML, { accent: 'emph', icon: 'target' })}</div>
    </div>

    <div class="grid" style="margin-top:16px">
      <div class="col-6">${saCard('Commercial Headline', commercialHTML, { accent: 'teal', icon: 'money' })}</div>
      <div class="col-6">${saCard('Immediate Next Actions', nextActionsHTML, { accent: 'emph', icon: 'clock' })}</div>
    </div>

    <div class="grid" style="margin-top:16px">
      <div class="col-12">${saCard('Critical Unknowns', gapsHTML, { icon: 'gap', sub: topGaps.length + ' of ' + d.gaps.length })}</div>
    </div>

  </div></div>
  `;
}

if (typeof window !== 'undefined') {
  window.renderTab_brief = renderTab_brief;
  window.DealTabs = window.DealTabs || {};
  window.DealTabs.brief = renderTab_brief;
}

</script>
<script>
/* =============================================================================
 * tab-contract.js — "Contract" tab builder for the Deal artifact.
 * Subtabs: Document Map · Scope & Performance · Terms & Risk.
 * Reads ONLY from dashboardData (param d). Every material value carries an
 * evidenceChip; every count/derived figure is computed live from d, never
 * hard-coded, so it stays consistent if the underlying model changes.
 * Depends on globals from helpers.js (esc, money, icon, saCard, dataTable, …)
 * which are loaded before this file. Attaches:
 *   window.renderTab_contract(d)   — the function itself
 *   window.DealTabs.contract       — same fn, per the shell's tab-builder convention
 * ========================================================================== */
(function (global) {
'use strict';

/* ---------- small local utilities (this file only) ------------------------ */
const ROLE_LABEL = { governing:'Governing', ordering:'Ordering', scope:'Scope',
                     data:'Data', security:'Security', correspondence:'Correspondence' };
function roleLabel(role) { return ROLE_LABEL[role] || role; }
function findDoc(id, d) { return (d.documents || []).find(x => x.id === id); }
function docTypeOf(id, d) { const doc = findDoc(id, d); return doc ? doc.type : id; }
function gapForDocId(docId, d) { return (d.gaps || []).find(g => (g.input || '').indexOf(docId) !== -1); }
function sevRank(p) { return ({ 'hard-stop':4, high:3, medium:2, low:1 })[p] || 0; }
function decisionLabel(v) { return ({ pending:'Pending', accept:'Accepted', reject:'Rejected', trade:'Trade' })[v] || v; }
function hasRealHardStop(text) { return !!text && !/^none\b/i.test(text.trim()); }

/* ============================================================================
 * SUBTAB 1 — Document Map
 * ========================================================================== */
function docNode(doc, isRoot) {
  const missing = doc.evidenceType === 'unavailable';
  const cls = 'ddm-child' + (missing ? ' ddm-missing' : '') + (isRoot ? ' ddm-rootbox' : '');
  return '<div class="' + cls + '">' +
    '<div class="ddm-role">' + esc(roleLabel(doc.role)) + '</div>' +
    '<div class="ddm-name">' + esc(doc.name) + '</div>' +
    '<div class="ddm-meta">' + esc(doc.type) + (doc.pages ? ' &middot; ' + doc.pages + ' pp' : '') +
      (doc.date ? ' &middot; ' + esc(doc.date) : '') + '</div>' +
    '<div class="ddm-status">' + esc(doc.status) + '</div>' +
    '<div class="ddm-bottom">' + evidenceChip(doc.evidenceType, { short:true, sources:[doc.id] }) + '</div>' +
  '</div>';
}

function renderDocMap(d) {
  const docs = d.documents || [];
  const root = docs.find(x => x.role === 'governing') || docs[0];
  const children = docs.filter(x => x !== root);
  const missingDocs = docs.filter(x => x.evidenceType === 'unavailable');

  const treeHtml =
    '<style>' +
    '.ddm-tree{padding:16px 6px 30px}' +
    '.ddm-root{display:flex;justify-content:center}' +
    '.ddm-branch{width:2px;height:20px;background:var(--line2);margin:0 auto}' +
    '.ddm-children{position:relative;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding-top:16px}' +
    '.ddm-children::before{content:"";position:absolute;top:0;left:12%;right:12%;height:2px;background:var(--line2)}' +
    '.ddm-child{position:relative;flex:1 1 160px;max-width:200px;background:var(--surface);border:1px solid var(--line2);' +
      'border-radius:var(--r-sm);padding:10px 12px;box-shadow:var(--shadow-1)}' +
    '.ddm-child::before{content:"";position:absolute;top:-16px;left:50%;width:2px;height:16px;background:var(--line2)}' +
    '.ddm-child.ddm-missing{background:var(--panel);border-style:dashed}' +
    '.ddm-rootbox{max-width:260px;border-color:var(--pri);border-width:1.5px}' +
    '.ddm-role{font-size:var(--fz-floor);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700}' +
    '.ddm-name{font-weight:700;font-size:var(--fz-sm);margin:3px 0 2px;color:var(--ink)}' +
    '.ddm-meta{font-size:var(--fz-meta);color:var(--mut)}' +
    '.ddm-status{font-size:var(--fz-meta);color:var(--mut2);margin:2px 0 6px;font-style:italic}' +
    '.ddm-bottom{display:flex;gap:6px;flex-wrap:wrap;align-items:center}' +
    '</style>' +
    '<div class="ddm-tree">' +
      '<div class="ddm-root">' + docNode(root, true) + '</div>' +
      '<div class="ddm-branch"></div>' +
      '<div class="ddm-children">' + children.map(c => docNode(c, false)).join('') + '</div>' +
    '</div>';

  const mapInsights =
    insight(docs.length + ' documents make up this deal; <strong>' + missingDocs.length +
      '</strong> (' + missingDocs.map(x => x.type).join(', ') + ') are referenced in the ' + esc(root.name) +
      ' but were not provided in this session.', 'warn') +
    insight('The MSA (' + esc(root.id) + ') is the sole governing instrument; the Order Form and SOW-01 operate under it and were reviewed as a set.', '');

  const docMapCard = saCard('Document Relationship Map', treeHtml + mapInsights,
    { icon:'doc', sub: docs.length + ' documents &middot; ' + missingDocs.length + ' unavailable' });

  /* ---- Document inventory table ---- */
  const invCols = [
    { key:'id', label:'ID', width:'64px' },
    { key:'name', label:'Document', render: r => '<strong>' + esc(r.name) + '</strong>' },
    { key:'role', label:'Role', render: r => esc(roleLabel(r.role)) },
    { key:'status', label:'Status', render: r => esc(r.status) },
    { key:'date', label:'Date', render: r => r.date ? esc(r.date) : '&mdash;', sortVal: r => r.date || '' },
    { key:'pages', label:'Pages', align:'num', render: r => r.pages != null ? r.pages : '&mdash;' },
    { key:'evidence', label:'Evidence', sort:false, render: r => evidenceChip(r.evidenceType, { short:true, sources:[r.id] }) }
  ];
  const invTable = dataTable(invCols, docs, {
    zebra:true, dense:true, id:'tbl-doc-inventory',
    expand: r => {
      const related = (r.relatedTo || []).map(id => { const rd = findDoc(id, d); return rd ? rd.type + ' (' + rd.id + ')' : id; }).join(', ');
      const lim = (r.limitations || []).length ? insight(esc(r.limitations.join(' ')), 'warn') : '';
      return '<div class="kv"><dt>Source</dt><dd>' + esc(r.sourceType) + '</dd>' +
        '<dt>Related to</dt><dd>' + (related || '&mdash;') + '</dd></div>' + lim;
    }
  });
  const invCard = saCard('Document Inventory', invTable, { icon:'sources', accent:'teal' });

  /* ---- Governing terms & precedence ---- */
  const precRows = docs.map(doc =>
    '<dt>' + esc(roleLabel(doc.role)) + '</dt><dd><strong>' + esc(doc.type) + '</strong> &mdash; ' + esc(doc.name) +
      (doc.evidenceType === 'unavailable' ? ' ' + evidenceChip('unavailable', { short:true }) : '') + '</dd>').join('');
  const precInner = '<dl class="kv">' + precRows + '</dl>' +
    insight('Precedence inferred from each document’s stated role (governing &rarr; ordering/scope &rarr; data/security); ' +
      'no explicit order-of-precedence clause appeared in the reviewed text. ' + evidenceChip('inference', { short:true }));
  const precCard = saCard('Governing Terms & Precedence', precInner, { icon:'scale', accent:'emph' });

  /* ---- Cross-document consistency / conflicts ---- */
  const crossRows = [
    { docA:'DOC-01', docB:'DOC-04', topic:'Data protection terms', ok:false, issueId:'ISS-03',
      note:'MSA incorporates a DPA "by reference," but the DPA text itself is not in session.' },
    { docA:'DOC-01', docB:'DOC-04', topic:'Sub-processor change control', ok:false, issueId:'ISS-08',
      note:'Sub-processor notice/objection mechanism would normally sit in the DPA; unavailable.' },
    { docA:'DOC-01', docB:'DOC-05', topic:'SLA credit schedule &amp; security controls', ok:false, issueId:'ISS-06',
      note:'MSA sets the uptime target; the credit schedule and controls sit in the missing Security Exhibit.' },
    { docA:'DOC-01', docB:'DOC-03', topic:'Renewal notice &amp; price', ok:true, issueId:'ISS-04',
      note:'MSA and Order Form agree; both are silent on a renewal price cap (the deviation is vs. playbook, not between the two documents).' },
    { docA:'DOC-02', docB:'DOC-03', topic:'Fee schedule totals', ok:true, issueId:'ISS-12',
      note:'Order Form (subscription) and SOW-01 (services) fee lines combine into the Year-1 total; no discrepancy found between the two.' }
  ];
  const crossCols = [
    { key:'docs', label:'Documents', sort:false, render: r => docTypeOf(r.docA, d) + ' ↔ ' + docTypeOf(r.docB, d) },
    { key:'topic', label:'Topic', sort:false, render: r => r.topic },
    { key:'consistency', label:'Consistency', sort:false, render: r => r.ok ? statusPill('aligned','Aligned') : statusPill('deviation','Gap') },
    { key:'issue', label:'Linked issue', sort:false, render: r => jumpLink(r.issueId, 'tab:contract/sub:terms') + ' ' + severityPill((d.issues.find(i=>i.id===r.issueId)||{}).priority || 'medium') },
    { key:'note', label:'Note', sort:false, render: r => '<span class="tiny muted">' + r.note + '</span>' }
  ];
  const crossTable = dataTable(crossCols, crossRows, { zebra:true, dense:true, id:'tbl-crossdoc', sortable:false });
  const crossInsights =
    insight('No directly contradicting clause language was found between the three present documents (MSA, SOW-01, Order Form); the material cross-document issues are <strong>gaps</strong> created by the two missing exhibits.', 'warn') +
    insight('Both data-protection gaps (DPA text, sub-processor notice) resolve together once the DPA is obtained &mdash; see Missing Documents.');
  const crossCard = saCard('Cross-Document Consistency & Conflicts', crossTable + crossInsights, { icon:'scale' });

  /* ---- Missing documents ---- */
  const missingHtml = missingDocs.map(md => {
    const gap = gapForDocId(md.id, d);
    const body = '<div class="kv" style="margin-bottom:6px">' +
      '<dt>Referenced at</dt><dd>' + esc(md.sourceType) + '</dd>' +
      (gap ? '<dt>Why it matters</dt><dd>' + esc(gap.whyItMatters) + '</dd>' +
             '<dt>Possible source</dt><dd>' + esc(gap.possibleSource) + '</dd>' : '') +
      '</div>' +
      (md.limitations || []).map(l => '<div class="tiny muted">' + esc(l) + '</div>').join('') +
      '<div style="margin-top:6px">' + evidenceChip('unavailable') + ' ' +
      jumpLink('View in Missing Inputs →', 'tab:sources/sub:gaps') + '</div>';
    return gapCard(md.type + ' — ' + md.name, body);
  }).join('<div class="divider"></div>');
  const missingCard = saCard('Missing Documents', missingHtml || '<div class="card-note">No referenced documents are missing.</div>',
    { icon:'gap', accent:'danger', sub: missingDocs.length + ' unavailable' });

  return '<div class="tab-intro"><h2>Document Map</h2><p class="q">Inventory, relationship structure, governing precedence and cross-document gaps for the MSA + SOW-01 + Order Form set. ' +
    coverageBadge(d.deal.evidenceCoverage) + '</p></div>' +
    '<div class="grid">' +
      '<div class="col-12">' + docMapCard + '</div>' +
      '<div class="col-8">' + invCard + '</div>' +
      '<div class="col-4">' + precCard + '</div>' +
      '<div class="col-7">' + crossCard + '</div>' +
      '<div class="col-5">' + missingCard + '</div>' +
    '</div>';
}

/* ============================================================================
 * SUBTAB 2 — Scope & Performance
 * ========================================================================== */
function raciCell(val) {
  if (!val) return '<span class="pill muted" title="No role assigned">&mdash;</span>';
  const cls = val === 'A' ? 'warn' : (val === 'R' ? 'ok' : 'muted');
  return '<span class="pill ' + cls + '">' + val + '</span>';
}

function renderScopePerf(d) {
  const sc = d.scope || {};

  /* ---- Delivery timeline (milestones) + deliverables legend ---- */
  const ms = sc.milestones || [];
  const ganttRows = ms.map((m, i) => ({ label: m.name, start: m.date, end: m.end, tone: i === 0 ? 'pri' : '', badge: m.id }));
  const ganttHtml = ms.length
    ? gantt(ganttRows, { start: ms[0].date, end: ms[ms.length - 1].end })
    : gapCard('Milestone schedule', 'No dated milestones available in this session.');
  const delivLegend = '<dl class="kv" style="margin-top:12px">' +
    (sc.deliverables || []).map(dl => {
      const m = ms.find(x => x.id === dl.milestone);
      return '<dt>' + esc(dl.id) + '</dt><dd><strong>' + esc(dl.name) + '</strong> &mdash; ' +
        (m ? esc(m.name) + ' (' + esc(dl.milestone) + ')' : esc(dl.milestone)) + ' &middot; owner: ' + esc(dl.owner) +
        ' ' + evidenceChip(dl.evidenceType, { short:true }) + '</dd>';
    }).join('') + '</dl>';
  const timelineInsight = insight('Data onboarding (M2) is the schedule’s critical dependency &mdash; every later milestone chains from it, and buyer HRIS/payroll access is due within 5 days of kickoff.', 'warn');
  const timelineCard = saCard('Delivery Timeline', ganttHtml + delivLegend + timelineInsight,
    { icon:'clock', sub: ms.length + ' milestones &middot; ' + (sc.deliverables || []).length + ' deliverables' });

  /* ---- Dependencies & risk ---- */
  const depCols = [
    { key:'text', label:'Dependency', render: r => r.text },
    { key:'owner', label:'Owner', width:'80px', render: r => esc(r.owner) },
    { key:'risk', label:'Risk', render: r => severityPill(r.risk) },
    { key:'evidence', label:'Evidence', sort:false, render: r => evidenceChip(r.evidenceType, { short:true }) }
  ];
  const depTable = dataTable(depCols, sc.dependencies || [], { zebra:true, dense:true, id:'tbl-dependencies',
    rowClass: r => r.risk === 'high' ? 'rowtint-danger' : '' });

    .concat(raci.roles.map((role, i) => ({ key:'role' + i, label: role, sort:false, render: r => raciCell(r.vals[i]) })));
  const raciTable = dataTable(raciCols, raci.rows || [], { zebra:false, dense:true, id:'tbl-raci', sortable:false,

  const raciCard = saCard('Responsibility (RACI)', raciTable + raciLegend, { icon:'raci' });

  /* ---- SLAs & change control ---- */

  const changeHtml = (sc.changeControl || []).map(c => insight(esc(c.text) + ' ' + evidenceChip(c.evidenceType, { short:true }))).join('');
  const slaCard = saCard('SLAs & Change Control', slaTable + '<div class="divider"></div>' + changeHtml, { icon:'shield', accent:'emph' });

  return '<div class="tab-intro"><h2>Scope &amp; Performance</h2><p class="q">SOW-01 objective, delivery schedule, acceptance standards, responsibility split and service levels. ' +

function renderTermsRisk(d) {

  const chartCard = saCard('Issues by Category', barsHtml + prLegend + chartInsights,

  /* ---- full filterable, expandable, sortable register ---- */
  const toolbar =
    '<div class="toolbar">' +
      '<input type="search" placeholder="Search issues, clauses, categories…" data-filter-input data-filter-for="tbl-issue-register">' +
      '<button class="chip-filter" data-filterchip="hard-stop" aria-pressed="false">Hard stop</button>' +
      '<button class="chip-filter" data-filterchip="high" aria-pressed="false">High</button>' +
      '<button class="chip-filter" data-filterchip="medium" aria-pressed="false">Medium</button>' +
      '<button class="chip-filter" data-filterchip="low" aria-pressed="false">Low</button>' +
      '<span class="spacer"></span>' +
      '<span class="filter-count">' + issues.length + ' of ' + issues.length + ' shown</span>' +
    '</div>';
  const registerTable =
    '<div class="tbl-wrap"><table class="dt zebra dense" id="tbl-issue-register">' +
      '<thead><tr>' +
        '<th data-sort="id">ID</th>' +
        '<th data-sort="title">Issue</th>' +
        '<th data-sort="priority">Priority</th>' +
        '<th data-sort="doc">Document</th>' +
        '<th data-sort="decision">Decision</th>' +
        '<th>Evidence</th>' +
      '</tr></thead>' +
      '<tbody>' + issues.map(iss => issueRowHtml(iss, d)).join('') + '</tbody>' +
    '</table></div>';
  const registerCard = saCard('Issue Register — Full Detail',
    '<div data-filter-scope>' + toolbar + registerTable + '</div>',
    { icon:'flag', accent:'plum', sub:'click a row to expand' });

  return '<div class="tab-intro"><h2>Terms &amp; Risk</h2><p class="q">Every tracked issue across the MSA, SOW-01 and Order Form &mdash; filter by priority, expand any row for supplier position, playbook comparison, recommended response and trade options. ' +
    coverageBadge(d.deal.evidenceCoverage) + '</p></div>' +
    '<div class="grid">' +
      '<div class="col-4">' + chartCard + '</div>' +

}

function renderTab_contract(d) {
