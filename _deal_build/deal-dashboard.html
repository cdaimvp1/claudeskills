</script>
<script>
/* =============================================================================
 * tab-commercials.js — "Commercials" primary tab builder for the Deal artifact.
 *
 * Exposes:  window.renderTab_commercials(d)  ->  HTML string for the whole tab
 *           (subtab bar + 3 subtab panels), plus window.DealTabs.commercials
 *           as an alias (builder convention in helpers.js).
 *
 * Subtabs: Proposal (line items + cash flow + terms + concerns) ·
 *          Scenarios (ask/target/fallback/max + editable assumptions + recalc
 *          + tornado sensitivity) · Benchmarks (only real comparisons).
 *
 * Reads ONLY from dashboardData (param d). No fact is hard-coded here that
 * already lives in data.js — commercialLines / scenarios / benchmarks /
 * assumptions / issues are looked up by id and rendered, never restated.
 *
 * LIVE RECALC DESIGN (see helpers.js comment on DealUI.onRecalc):
 *   Moving an assumption slider must not fabricate new precision — it re-runs
 *   a transparent, locally-defined model and shows the delta from the
 *   generation-time snapshot. At the assumptions' ORIGINAL values the model
 *   reproduces the original scenario figures exactly (ratio = 1); away from
 *   the original values it scales proportionally. Sortable-table headers are
 *   bound once at DealUI.init() and are NOT delegated, so recalculation never
 *   replaces a <table> — it patches only the value spans + their data-sv
 *   sort-cache in place.
 * ========================================================================== */
(function (global) {
'use strict';

/* ---------- 0. small local utils (not exported — helpers.js owns the API) - */
function assumVal(d, id, fallback, overrides) {
  if (overrides && Object.prototype.hasOwnProperty.call(overrides, id)) return overrides[id];
  const a = (d.assumptions || []).find(x => x.id === id);
  return a ? a.value : fallback;
}
function findLine(d, id) { return (d.commercialLines || []).find(l => l.id === id) || {}; }
function findIssue(d, id) { return (d.issues || []).find(i => i.id === id); }
function negPill(level) {
  const lvl = String(level || '').toLowerCase();
  return '<span class="pill ' + (lvl === 'high' ? 'info' : 'muted') + '">' + esc(level) + '</span>';
}
function compPill(level) {
  const lvl = String(level || '').toLowerCase();
  return '<span class="pill ' + (lvl === 'moderate' ? 'info' : 'muted') + '">Comparability: ' + esc(level) + '</span>';
}

/* ---------- 1. the pricing model (drives waterfall / table / tornado) ----- */
// Year-by-year cash for one scenario under given (or current) assumption
// overrides. Only the platform line (CL-1) is headcount/discount-sensitive,
// matching ASM-1.usedIn / ASM-4.usedIn in data.js; everything else uses the
// scenario's own values{} as drafted.
function yearlyCashFlow(d, scenario, overrides) {
  const empRatio = assumVal(d, 'ASM-1', 18000, overrides) / 18000;
  const term = Math.max(1, Math.round(assumVal(d, 'ASM-2', 3, overrides)));
  const uplift = assumVal(d, 'ASM-3', 4, overrides) / 100;
  const discount = assumVal(d, 'ASM-4', 18, overrides) / 100;
  const askCL1 = findLine(d, 'CL-1').supplierAmount || 0;
  let cl1 = scenario.values['CL-1'] || 0;
  if (scenario.id === 'SC-target') cl1 = askCL1 * (1 - discount);
  cl1 = cl1 * empRatio;
  const cl3 = scenario.values['CL-3'] || 0;
  const oneTime = (scenario.values['CL-2'] || 0) + (scenario.values['CL-4'] || 0) + (scenario.values['CL-5'] || 0);
  const annual = cl1 + cl3;
  const years = [];
  for (let k = 0; k < term; k++) years.push(annual * Math.pow(1 + uplift, k) + (k === 0 ? oneTime : 0));
  return years;
}
function scenarioModel(d, scenario, overrides) {
  const years = yearlyCashFlow(d, scenario, overrides);
  return { y1: years[0] || 0, total: years.reduce((a, b) => a + b, 0) };
}
function npv(years, ratePct) {
  const r = (ratePct || 0) / 100;
  return years.reduce((sum, v, idx) => sum + v / Math.pow(1 + r, idx), 0);
}
// baseline captured once, at first render (i.e. the generation-time values),
// so a moved-then-reset slider reproduces the original figures exactly.
let _baseline = null;
function baseline(d) {
  if (_baseline) return _baseline;
  _baseline = {};
  (d.scenarios || []).forEach(s => { _baseline[s.id] = scenarioModel(d, s); });
  return _baseline;
}
// scenarios re-scaled: at unmoved assumptions this returns the ORIGINAL
// s.y1Total / s.total exactly; away from baseline it scales by the model's
// ratio. Never invents a number unrelated to the generation-time snapshot.
function liveScenarios(d) {
  const base = baseline(d);
  return (d.scenarios || []).map(s => {
    const m = scenarioModel(d, s);
    const b = base[s.id] || { y1: 1, total: 1 };
    return Object.assign({}, s, {
      liveY1: s.y1Total * (m.y1 / (b.y1 || 1)),
      liveTotal: s.total * (m.total / (b.total || 1))
    });
  });
}
function liveAsk(d) {
  const empRatio = assumVal(d, 'ASM-1', 18000) / 18000;
  const l = findLine(d, 'CL-1');
  return (l.supplierAmount || 0) * empRatio;
}
function liveTarget(d, line) {
  if (line.id !== 'CL-1') return line.target;
  const askCL1 = findLine(d, 'CL-1').supplierAmount || 0;
  const discount = assumVal(d, 'ASM-4', 18) / 100;
  const empRatio = assumVal(d, 'ASM-1', 18000) / 18000;
  return askCL1 * (1 - discount) * empRatio;
}

/* ---------- 2. PROPOSAL — render fns (each re-invoked on recalc) ---------- */
function renderLineChart(d) {
  const lines = d.commercialLines || [];
  const recurring = lines.filter(l => l.frequency === 'annual');
  const oneTime = lines.filter(l => l.frequency === 'one-time');
  const group = (title, rows) => {
    const max = Math.max.apply(null, rows.map(l => Math.max(l.id === 'CL-1' ? liveAsk(d) : l.supplierAmount, liveTarget(d, l))).concat([1]));
    return '<div class="eyebrow" style="margin:10px 0 4px">' + esc(title) + '</div>' +
      rows.map(l => {
        const ask = l.id === 'CL-1' ? liveAsk(d) : l.supplierAmount;
        const tgt = liveTarget(d, l);
        return barRow(esc(l.item) + ' — ask', ask, max, money(ask, { compact: true }), { color: 'pri', title: l.item + ' as drafted' }) +
          barRow(esc(l.item) + ' — target', tgt, max, money(tgt, { compact: true }), { color: 'teal', title: l.item + ' target position' });
      }).join('<div style="height:6px"></div>');
  };
  return group('Recurring (annual)', recurring) + group('One-time (services)', oneTime);
}
function renderLineItemsTable(d) {
  const cols = [
    { key: 'item', label: 'Line item', render: r => '<strong>' + esc(r.item) + '</strong><div class="tiny muted">' + esc(r.unit) + ' · ' + esc(r.frequency) + '</div>' },
    { key: 'ask', label: 'Ask (Y1)', align: 'num', sortVal: r => (r.id === 'CL-1' ? liveAsk(d) : r.supplierAmount),
      render: r => '<span id="li-ask-' + esc(r.id) + '">' + money(r.id === 'CL-1' ? liveAsk(d) : r.supplierAmount, { compact: true }) + '</span>' },
    { key: 'target', label: 'Target', align: 'num', sortVal: r => liveTarget(d, r),
      render: r => '<span id="li-target-' + esc(r.id) + '">' + money(liveTarget(d, r), { compact: true }) + '</span>' },
    { key: 'fallback', label: 'Fallback', align: 'num', sortVal: r => r.fallback, render: r => money(r.fallback, { compact: true }) },
    { key: 'maximumAcceptable', label: 'Max acceptable', align: 'num', sortVal: r => r.maximumAcceptable, render: r => money(r.maximumAcceptable, { compact: true }) },
    { key: 'negotiability', label: 'Negotiability', render: r => negPill(r.negotiability) },
    { key: 'evidenceType', label: 'Evidence', render: r => evidenceChip(r.evidenceType, { sources: r.sourceIds, short: true }) }
  ];
  return dataTable(cols, d.commercialLines || [], {
    id: 'cml-lineitems-tbl', zebra: true, dense: true,
    expand: r => '<div class="kv"><dt>Quantity</dt><dd>' + esc(r.quantity) + ' ' + esc(r.unit) + '</dd>' +
      '<dt>Sources</dt><dd>' + evidenceChip(r.evidenceType, { sources: r.sourceIds }) + '</dd></div>'
  });
}
function renderCashFlow(d) {
  const ask = (d.scenarios || []).find(s => s.id === 'SC-ask') || {};
  const years = yearlyCashFlow(d, ask);
  const max = Math.max.apply(null, years.concat([1]));
  return years.map((v, i) => barRow('Year ' + (i + 1), v, max, money(v, { compact: true }), { color: 'pri', title: 'Modeled Year ' + (i + 1) + ' cash, supplier-ask basis' })).join('');
}

/* ---------- 3. SCENARIOS — render fns (each re-invoked on recalc) -------- */
function renderWaterfall(d) {
  const scs = liveScenarios(d);
  const order = [
    ['SC-ask', 'total'], ['SC-max', 'down'], ['SC-fallback', 'down'], ['SC-target', 'final']
  ];
  const steps = order.map(([id, kind]) => {
    const s = scs.find(x => x.id === id) || { name: id, liveTotal: 0 };
    return { label: s.name, value: s.liveTotal, kind, display: money(s.liveTotal, { compact: true }) };
  });
  return waterfall(steps, {});
}
function renderTornado(d) {
  const target = (d.scenarios || []).find(s => s.id === 'SC-target');
  if (!target) return '';
  const rows = (d.assumptions || []).map(a => {
    const lo = scenarioModel(d, target, { [a.id]: a.min }).total;
    const hi = scenarioModel(d, target, { [a.id]: a.max }).total;
    return { a, lo: Math.min(lo, hi), hi: Math.max(lo, hi), swing: Math.abs(hi - lo) };
  }).sort((x, y) => y.swing - x.swing);
  const max = Math.max.apply(null, rows.map(r => r.swing).concat([1]));
  return rows.map(r => barRow(
    esc(r.a.label), r.swing, max, money(r.swing, { compact: true }),
    { color: 'emph', title: 'Range if set to min/max: ' + money(r.lo, { compact: true }) + ' – ' + money(r.hi, { compact: true }) + ' · materiality: ' + r.a.materiality }
  )).join('');
}
function patchScenarioTable(d) {
  liveScenarios(d).forEach(s => {
    const y1 = document.getElementById('sc-y1-' + s.id);
    if (y1) { y1.textContent = money(s.liveY1, { compact: true }); const td = y1.closest('td'); if (td) td.setAttribute('data-sv', String(s.liveY1)); }
    const tot = document.getElementById('sc-tot-' + s.id);
    if (tot) { tot.textContent = money(s.liveTotal, { compact: true }); const td = tot.closest('td'); if (td) td.setAttribute('data-sv', String(s.liveTotal)); }
  });
}
function patchLineTable(d) {
  (d.commercialLines || []).forEach(l => {
    const ask = document.getElementById('li-ask-' + l.id);
    if (ask) { const v = l.id === 'CL-1' ? liveAsk(d) : l.supplierAmount; ask.textContent = money(v, { compact: true }); const td = ask.closest('td'); if (td) td.setAttribute('data-sv', String(v)); }
    const tgt = document.getElementById('li-target-' + l.id);
    if (tgt) { const v = liveTarget(d, l); tgt.textContent = money(v, { compact: true }); const td = tgt.closest('td'); if (td) td.setAttribute('data-sv', String(v)); }
  });
}
function patchMisc(d) {
  const scs = liveScenarios(d);
  const ask = scs.find(s => s.id === 'SC-ask'), tgt = scs.find(s => s.id === 'SC-target');
  const gap = document.getElementById('cml-tcv-gap');
  if (gap && ask && tgt) gap.textContent = money(tgt.liveTotal - ask.liveTotal, { compact: true }) + ' vs. ask';
  const term = document.getElementById('cml-term-mirror');
  if (term) term.textContent = assumVal(d, 'ASM-2', 3) + ' yrs';
  const up = document.getElementById('cml-uplift-mirror');
  if (up) up.textContent = assumVal(d, 'ASM-3', 4) + '%';
  const npvEl = document.getElementById('cml-npv-target');
  if (npvEl && tgt) {
    const years = yearlyCashFlow(d, (d.scenarios || []).find(s => s.id === 'SC-target'));
    npvEl.textContent = money(npv(years, assumVal(d, 'ASM-5', 6)), { compact: true });
  }
}

/* ---------- 4. BENCHMARKS — numeric extraction from grounded strings ----- */
// Only the 3 real comparisons in d.benchmarks are used; numbers are parsed
// from the model's own comparisonValue / issue text, never invented.
function benchNumbers(bench, d) {
  if (bench.id === 'BENCH-int') {
    const nums = (bench.comparisonValue.match(/[\d.]+/g) || []).map(Number);
    return { ours: nums[0], compare: nums[1], oursLabel: 'This ask', compareLabel: 'Internal precedent', fmt: v => '$' + v };
  }
  if (bench.id === 'BENCH-svc') {
    const oursM = bench.comparisonValue.match(/\$([\d,]+)\/day/);
    const rangeM = bench.comparisonValue.match(/\$([\d,]+)[–-]([\d,]+)/);
    const ours = oursM ? parseFloat(oursM[1].replace(/,/g, '')) : null;
    const lo = rangeM ? parseFloat(rangeM[1].replace(/,/g, '')) : null;
    const hi = rangeM ? parseFloat(rangeM[2].replace(/,/g, '')) : null;
    const compare = (lo != null && hi != null) ? (lo + hi) / 2 : null;
    return { ours, compare, oursLabel: 'This SOW ($/day)', compareLabel: 'Internal norm (' + (lo != null ? '$' + lo.toLocaleString() + '–$' + hi.toLocaleString() : 'range') + ')', fmt: v => '$' + Math.round(v).toLocaleString() };
  }
  if (bench.id === 'BENCH-pub') {
    const iss = findIssue(d, 'ISS-04');
    const oursM = iss && iss.supplierPosition ? iss.supplierPosition.match(/(\d+)\s*days/i) : null;
    const ours = oursM ? parseFloat(oursM[1]) : null;
    const nums = (bench.comparisonValue.match(/\d+/g) || []).map(Number);
    const compare = nums.length ? (nums.reduce((a, b) => a + b, 0) / nums.length) : null;
    return { ours, compare, oursLabel: 'Our draft (notice days)', compareLabel: 'Market typical (' + bench.comparisonValue + ')', fmt: v => Math.round(v) + 'd' };
  }
  return { ours: null, compare: null, fmt: v => String(v) };
}
function renderBenchmarkCard(bench, d) {
  const n = benchNumbers(bench, d);
  const max = Math.max(n.ours || 0, n.compare || 0, 1) * 1.15;
  const chart = (n.ours != null && n.compare != null)
    ? barRow(n.oursLabel, n.ours, max, n.fmt(n.ours), { color: 'pri' }) + barRow(n.compareLabel, n.compare, max, n.fmt(n.compare), { color: 'teal' })
    : gapCard('Not directly comparable', 'This benchmark is context only — no like-for-like figure to bar-chart.');
  return saCard(bench.item, chart +
    '<div style="margin-top:9px; display:flex; gap:8px; align-items:center; flex-wrap:wrap">' +
      compPill(bench.comparability) + evidenceChip(bench.evidenceType, { sources: [bench.sourceId] }) +
    '</div>' +
    collapsible('Methodology & caveat', '<p style="margin:0">' + esc(bench.explanation) + '</p>'),
    { accent: 'teal', icon: 'bench' }
  );
}

/* ---------- 5. TAB ASSEMBLY ----------------------------------------------- */
function renderTab_commercials(d) {
  baseline(d); // lock in generation-time figures before any interaction

  const scs = liveScenarios(d);
  const concernIssues = (d.issues || []).filter(i => i.category === 'Commercial' || i.id === 'ISS-04');

  /* ---- PROPOSAL subtab ---- */
  const proposal =
    '<div class="tab-intro"><h2>Proposal</h2><p class="q">What Visier is proposing, normalized against Lilly’s internal ' +
    'negotiating positions — a sample session-snapshot read of DOC-01/02/03.</p></div>' +
    '<div class="grid">' +
      '<div class="col-7">' + saCard('Ask vs. Target — By Line Item', '<div id="cml-linechart">' + renderLineChart(d) + '</div>' +
        insight('Ask reflects the Order Form / SOW figure (contract fact); target, fallback and maximum-acceptable are calculated negotiation positions, not contract terms.'),
        { accent: 'plum', icon: 'money', sub: coverageBadge('Strong') }) + '</div>' +
      '<div class="col-5">' + saCard('Normalized Line Items', '<div id="cml-lineitems-table">' + renderLineItemsTable(d) + '</div>',
        { icon: 'doc', sub: '5 lines · ' + esc((d.commercialLines || []).length) + ' rows' }) + '</div>' +
      '<div class="col-6">' + saCard('Cash Flow by Contract Year', '<div id="cml-cashflow">' + renderCashFlow(d) + '</div>' +
        insight('Supplier-ask basis; one-time services land in Year 1 only, recurring lines carry the post-term uplift assumption from Year 2 onward.'),
        { accent: 'teal', icon: 'scenarios' }) + '</div>' +
      '<div class="col-6">' + saCard('Commercial Terms', (function () {
        const term = findIssue(d, 'ISS-04'); const uplift = findIssue(d, 'ISS-11');
        const initTerm = (d.assumptions || []).find(a => a.id === 'ASM-2') || { value: 3, evidenceType: 'contract' };
        const upliftA = (d.assumptions || []).find(a => a.id === 'ASM-3') || { value: 4, evidenceType: 'assumption' };
        return '<dl class="kv">' +
          '<dt>Initial term</dt><dd><span id="cml-term-mirror">' + esc(initTerm.value) + ' yrs</span> ' + evidenceChip(initTerm.evidenceType, { short: true }) + '</dd>' +
          '<dt>Auto-renewal</dt><dd>' + (term ? severityPill(term.priority) : '') + ' ' + (term ? esc(term.title) : 'n/a') + ' ' + jumpLink('view →', 'tab:contract/sub:terms') + '</dd>' +
          '<dt>Post-term uplift (model input)</dt><dd><span id="cml-uplift-mirror">' + esc(upliftA.value) + '%</span> ' + evidenceChip(upliftA.evidenceType, { short: true }) + ' <span class="tiny muted">local assumption, used for Y2+ modeling only</span></dd>' +
          '<dt>Post-term price cap</dt><dd>' + (uplift ? severityPill(uplift.priority) : '') + ' ' + (uplift ? esc(uplift.title) : 'n/a') + ' ' + jumpLink('view →', 'tab:contract/sub:terms') + '</dd>' +
          '<dt>Payment / invoicing schedule</dt><dd>' + evidenceChip('unavailable') + ' <span class="tiny muted">not specified in this session</span></dd>' +
        '</dl>';
      })(), { icon: 'scale' }) + '</div>' +
      '<div class="col-12">' + saCard('Commercial Concerns Feeding This Analysis', concernIssues.map(i =>
        '<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 0">' +
          severityPill(i.priority) + '<strong style="flex:1 1 260px; min-width:0">' + esc(i.title) + '</strong>' +
          '<span class="tiny muted" style="flex:2 1 320px">' + esc(i.deviation) + '</span>' +
          evidenceChip(i.evidenceType, { sources: i.sourceIds, short: true }) +
          jumpLink('Register →', 'tab:contract/sub:terms') +
        '</div>'
      ).join('<div class="divider"></div>'), { accent: 'emph', icon: 'flag' }) + '</div>' +
    '</div>';

  /* ---- SCENARIOS subtab ---- */
  const scenarioTable = dataTable(
    [
      { key: 'name', label: 'Scenario', render: r => '<strong>' + esc(r.name) + '</strong><div class="tiny muted">' + esc(r.basis) + '</div>' },
      { key: 'liveY1', label: 'Year-1', align: 'num', sortVal: r => r.liveY1, render: r => '<span id="sc-y1-' + esc(r.id) + '">' + money(r.liveY1, { compact: true }) + '</span>' },
      { key: 'liveTotal', label: 'TCV (initial term)', align: 'num', sortVal: r => r.liveTotal, render: r => '<span id="sc-tot-' + esc(r.id) + '">' + money(r.liveTotal, { compact: true }) + '</span>' },
      { key: 'evidenceType', label: 'Evidence', render: r => evidenceChip(r.evidenceType, { short: true }) }
    ],
    scs,
    { id: 'cml-scenario-tbl', zebra: true, expand: r => insight(r.interpretation) }
  );
  const assumptionsHtml = (d.assumptions || []).map(a => assumptionSlider(a)).join('');
  const scenarios =
    '<div class="tab-intro"><h2>Scenarios</h2><p class="q">If Lilly holds firm at each position, what is the total contract value over the ' +
    'initial term — and which assumption moves that number most? <span class="tiny muted">Sliders are local to this snapshot; reset restores the generated figures exactly.</span></p></div>' +
    '<div class="grid">' +
      '<div class="col-7">' + saCard('Ask → Negotiated Value Ladder', '<div id="cml-waterfall">' + renderWaterfall(d) + '</div>' +
        '<div class="kv" style="margin-top:10px">' +
          '<dt>Target vs. ask (initial term)</dt><dd><span id="cml-tcv-gap" class="mono">' + money((scs.find(s => s.id === 'SC-target') || {}).liveTotal - (scs.find(s => s.id === 'SC-ask') || {}).liveTotal, { compact: true }) + ' vs. ask</span></dd>' +
          '<dt>NPV of target (at prepay discount rate)</dt><dd><span id="cml-npv-target" class="mono">' + money(npv(yearlyCashFlow(d, (d.scenarios || []).find(s => s.id === 'SC-target')), assumVal(d, 'ASM-5', 6)), { compact: true }) + '</span> ' + evidenceChip('calculated', { short: true }) + '</dd>' +
        '</div>',
        { accent: 'plum', icon: 'scenarios', sub: coverageBadge('Moderate') }) + '</div>' +
      '<div class="col-5">' + saCard('Scenario Comparison', scenarioTable, { icon: 'target' }) + '</div>' +
      '<div class="col-6">' + saCard('Assumptions (editable, local)', assumptionsHtml +
        '<div class="btn-row"><button class="btn" data-reset-assumptions>' + icon('reset') + 'Reset to generated values</button></div>',
        { icon: 'assume', accent: 'emph' }) + '</div>' +
      '<div class="col-6">' + saCard('Sensitivity — Swing on the Target TCV', '<div id="cml-tornado">' + renderTornado(d) + '</div>' +
        insight('Each bar is the target scenario’s total swing when that assumption moves across its full min–max range, others held at current value; sorted by size.'),
        { icon: 'scale' }) + '</div>' +
    '</div>';

  /* ---- BENCHMARKS subtab ---- */
  const benches = d.benchmarks || [];
  const benchmarks = benches.length
    ? '<div class="tab-intro"><h2>Benchmarks</h2><p class="q">Only comparisons backed by a real source are shown here — no fabricated ' +
      'market percentiles or should-cost precision.</p></div>' +
      '<div class="grid">' + benches.map(b => '<div class="col-4">' + renderBenchmarkCard(b, d) + '</div>').join('') + '</div>' +
      '<div style="margin-top:14px">' + insight('Benchmark coverage rests on a single internal precedent plus one weak-comparability public figure; a prior Visier quote or competing bid (' + jumpLink('GAP-4', 'tab:sources') + ') would firm the platform-pricing target.', 'warn') + '</div>'
    : '<div class="tab-intro"><h2>Benchmarks</h2></div>' + gapCard('No comparable benchmark in this session', 'No internal precedent or credible external comparison was available at generation time.');

  /* ---- assemble ---- */
  const html =
    '<div class="subtabbar" data-subtab-group="commercials"><div class="wrap">' +
      '<button class="subtab-btn" data-subtab="proposal" aria-selected="true">Proposal</button>' +
      '<button class="subtab-btn" data-subtab="scenarios">Scenarios</button>' +
      '<button class="subtab-btn" data-subtab="benchmarks">Benchmarks</button>' +
    '</div></div>' +
    '<div class="tab-body"><div class="wrap">' +
      '<div data-subpanel="commercials/proposal" class="is-active">' + proposal + '</div>' +
      '<div data-subpanel="commercials/scenarios">' + scenarios + '</div>' +
      '<div data-subpanel="commercials/benchmarks">' + benchmarks + '</div>' +
    '</div></div>';

  return html;
}

/* ---------- 6. wire recalculation once at module load -------------------- */
if (typeof global.DealUI !== 'undefined' && typeof global.DealUI.onRecalc === 'function') {
  global.DealUI.onRecalc(function (d) {
    const wf = document.getElementById('cml-waterfall'); if (wf) wf.innerHTML = renderWaterfall(d);
    const tornado = document.getElementById('cml-tornado'); if (tornado) tornado.innerHTML = renderTornado(d);
    const lc = document.getElementById('cml-linechart'); if (lc) lc.innerHTML = renderLineChart(d);
    const cf = document.getElementById('cml-cashflow'); if (cf) cf.innerHTML = renderCashFlow(d);
    patchScenarioTable(d);
    patchLineTable(d);
    patchMisc(d);
  });
}

/* ---------- 7. exports ----------------------------------------------------*/
global.renderTab_commercials = renderTab_commercials;
global.DealTabs = global.DealTabs || {};
global.DealTabs.commercials = renderTab_commercials;

})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/* =============================================================================
 * tab-negotiation.js — "Negotiation" primary tab builder for the Deal artifact.
 * Attaches window.renderTab_negotiation(d) and window.DealTabs.negotiation(d).
 * Reads ONLY from dashboardData (param d). No fact is restated/hard-coded —
 * every value is looked up from d.issues / d.negotiation / d.assumptions etc.
 *
 * Subtabs (group="negotiation"): positions | tradeplan | meeting
 * ========================================================================== */
(function (global) {
'use strict';

const PR_RANK = { 'hard-stop': 0, high: 1, medium: 2, low: 3 };
const STRENGTH_RANK = { Strong: 0, Moderate: 1, Weak: 2 };
const MAG_LEVEL = { low: 1.4, medium: 3, high: 4.6 };

function magPill(level) {
  const cls = level === 'high' ? 'warn' : level === 'medium' ? 'info' : 'muted';
  return '<span class="pill ' + cls + '">' + esc(level) + '</span>';
}

function wordingPair(text) {
  return '<span class="word-collab clamp2">We would like to move toward: ' + esc(text) + '</span>' +
         '<span class="word-direct clamp2">We require: ' + esc(text) + '</span>';
}

function hardStopCell(row) {
  if (/^none/i.test(row.hardStop || '')) {
    return '<span class="muted tiny">No walk-away line drawn</span>';
  }
  return '<span class="hs-line">' + icon('flag') + '<span>' + esc(row.hardStop) + '</span></span>';
}

function renderTab_negotiation(d) {
  const issueById = (id) => d.issues.find((i) => i.id === id);
  const docById = (id) => d.documents.find((x) => x.id === id);
  const pkgById = (id) => d.negotiation.packages.find((p) => p.id === id);

  // small cross-reference chip — every negotiation view points back at the SAME
  // issue objects that drive Contract; never restates the issue, just links to it.
  function issueTag(id) {
    const iss = issueById(id);
    const t = iss ? iss.title : id;
    return '<span class="pill info neg-tag" data-jump="tab:contract/sub:terms" title="' +
      esc(id + ' — ' + t + ' (jump to Terms &amp; Risk register)') + '">' + esc(id) + '</span>';
  }

  /* ================================ POSITIONS =============================== */
  function buildPositions() {
    const rows = d.issues.slice().sort((a, b) =>
      (PR_RANK[a.priority] - PR_RANK[b.priority]) || a.id.localeCompare(b.id));

    const cols = [
      { key: 'title', label: 'Issue', width: '19%', render: (r) =>
          '<div style="font-weight:700"><span class="row-chevron">' + icon('chevron') + '</span>' + esc(r.title) + '</div>' +
          '<div class="tiny muted" style="padding-left:19px">' + esc(r.category) + ' · ' + esc(r.id) + '</div>',
        sortVal: (r) => r.title.toLowerCase() },
      { key: 'priority', label: 'Priority', width: '9%', render: (r) => severityPill(r.priority),
        sortVal: (r) => PR_RANK[r.priority] },
      { key: 'basis', label: 'Basis', width: '15%', render: (r) =>
          '<div class="tiny">' + esc(r.clause) + '</div><div style="margin-top:3px">' +
          evidenceChip(r.evidenceType, { short: true, sources: r.sourceIds }) + '</div>',
        sort: false },
      { key: 'supplierPosition', label: 'Supplier position', width: '19%', render: (r) =>
          '<span class="clamp2">' + esc(r.supplierPosition) + '</span>', sort: false },
      { key: 'recommendedPosition', label: 'Recommended (target)', width: '17%',
        render: (r) => wordingPair(r.recommendedPosition), sort: false },
      { key: 'fallback', label: 'Fallback', width: '13%',
        render: (r) => wordingPair(r.fallback), sort: false },
      { key: 'hardStop', label: 'Hard stop', width: '8%', render: hardStopCell, sort: false }
    ];

    const expand = (r) => {
      const doc = docById(r.documentId);
      return '<div class="grid">' +
        '<div class="col-7">' +
        '<div class="eyebrow" style="margin-bottom:5px">Source excerpt · ' + esc(doc ? doc.name : r.documentId) + '</div>' +
        excerpt(r.sourceExcerpt) +
        '<div class="insight" style="margin-top:8px"><span class="ib"></span><span><b>Playbook position:</b> ' + esc(r.playbookPosition) + '</span></div>' +
        '<div class="insight warn"><span class="ib"></span><span><b>Deviation:</b> ' + esc(r.deviation) + '</span></div>' +
        '<div class="insight danger"><span class="ib"></span><span><b>Impact:</b> ' + esc(r.impact) + '</span></div>' +
        '</div>' +
        '<div class="col-5">' +
        '<div class="eyebrow" style="margin-bottom:5px">Negotiation notes</div>' +
        '<div class="tiny" style="margin-bottom:6px"><b>Supplier pushback:</b> ' + esc(r.supplierPushback) + '</div>' +
        '<div class="tiny" style="margin-bottom:6px"><b>Recommended response:</b> ' + esc(r.recommendedResponse) + '</div>' +
        '<div class="tiny" style="margin-bottom:8px"><b>Trade opportunity:</b> ' + esc(r.tradeOpportunity) + '</div>' +
        '<div>' + statusPill(r.internalDecision, r.internalDecision === 'pending' ? 'Decision pending' : r.internalDecision) +
        ' ' + evidenceChip(r.evidenceType, { sources: r.sourceIds }) + '</div>' +
        '</div></div>';
    };

    // rowClass injects a real data-facet attribute (per the chip-filter convention) by
    // deliberately reopening the attribute string dataTable() concatenates; this means the
    // built-in ".expandable" class/chevron never lands on the <tr> (it gets absorbed into the
    // data-facet value instead, harmlessly, since substring matching still finds each priority).
    // We render our own chevron + hover cursor below instead of relying on ".expandable".
    const table = dataTable(cols, rows, {
      id: 'negPositionsTable', zebra: true, sortable: true, expand,
      rowClass: (r) => 'pos-row" data-facet="' + esc(r.priority)
    });

    const chips = ['hard-stop', 'high', 'medium', 'low'].map((p) =>
      '<button class="chip-filter" data-filterchip="' + p + '" aria-pressed="false">' +
      esc(SEV_LABEL_LOCAL[p]) + '</button>').join('');

    // data-filter-scope must wrap BOTH the toolbar controls and the table itself —
    // applyFilter()/applyChipFilters() look for "table.dt" *inside* the scope element.
    const toolbar =
      '<div data-filter-scope>' +
      '<div class="toolbar">' +
      '<input type="search" placeholder="Filter by keyword, clause, category…" data-filter-input data-filter-for="negPositionsTable">' +
      chips +
      '<span class="spacer"></span><span class="filter-count">' + rows.length + ' of ' + rows.length + ' shown</span>' +
      '</div>' +
      '<input type="radio" id="wm-collab-pos" name="wm-pos" value="collab" class="sr-only" checked>' +
      '<input type="radio" id="wm-direct-pos" name="wm-pos" value="direct" class="sr-only">' +
      '<div class="word-toggle-row">' +
      '<span class="eyebrow">Wording</span>' +
      '<label for="wm-collab-pos" class="chip-filter word-lbl">Collaborative</label>' +
      '<label for="wm-direct-pos" class="chip-filter word-lbl">Direct</label>' +
      '</div>' +
      '<div class="word-scope">' + table + '</div>' +
      '</div>';

    const body =
      insight('Same ' + rows.length + ' issues that drive Contract → Terms &amp; Risk — positions, not a duplicate register. Expand a row for the source excerpt, playbook gap, and supplier pushback.') +
      toolbar;

    return saCard('Negotiation positions', body, { accent: 'plum', icon: 'target', id: 'negPositionsCard',
      sub: coverageBadge(d.deal.evidenceCoverage) });
  }
  const SEV_LABEL_LOCAL = { 'hard-stop': 'Hard stop', high: 'High', medium: 'Medium', low: 'Low' };

  /* ================================ TRADE PLAN ============================== */
  function buildTradePlan() {
    const objectives = d.negotiation.objectives.slice().sort((a, b) => a.priority - b.priority);
    const objHtml = objectives.map((o) =>
      '<div class="obj-row"><span class="obj-num">' + o.priority + '</span>' +
      '<div class="obj-body"><div>' + esc(o.text) + ' ' + evidenceChip(o.evidenceType, { short: true }) + '</div>' +
      '<div class="obj-issues">' + o.issueIds.map(issueTag).join(' ') + '</div></div></div>').join('');
    const objectivesCard = saCard('Objectives (priority order)', objHtml, { accent: 'plum', icon: 'flag' });

    const leverage = d.negotiation.leverage.slice().sort((a, b) => STRENGTH_RANK[a.strength] - STRENGTH_RANK[b.strength]);
    const levCols = [
      { key: 'text', label: 'Leverage', width: '46%', render: (r) => esc(r.text), sort: false },
      { key: 'strength', label: 'Strength', width: '16%', render: (r) => {
          const cls = r.strength === 'Strong' ? 'ok' : r.strength === 'Weak' ? 'muted' : 'warn';
          return '<span class="pill ' + cls + '">' + esc(r.strength) + '</span>';
        }, sortVal: (r) => STRENGTH_RANK[r.strength] },
      { key: 'basis', label: 'Basis', width: '38%', render: (r) =>
          '<span class="tiny">' + esc(r.basis) + '</span> ' + evidenceChip(r.evidenceType, { short: true }), sort: false }
    ];
    const leverageCard = saCard('Leverage — evidence-based', dataTable(levCols, leverage, { id: 'negLeverageTable', dense: true }),
      { accent: 'teal', icon: 'scale' });

    // give-get matrix: x = give cost (low->high), y = get value (low->high)
    const points = d.negotiation.giveGets.map((g) => {
      const linked = g.issueIds.map(issueById).filter(Boolean);
      const color = linked.some((i) => i.priority === 'hard-stop') ? 'danger'
        : linked.some((i) => i.priority === 'high') ? 'emph' : 'teal';
      return {
        x: MAG_LEVEL[g.giveCost], y: MAG_LEVEL[g.getValue], label: g.id,
        color, title: g.id + ': give ' + g.give + ' → get ' + g.get, jump: 'tab:contract/sub:terms'
      };
    });
    const matrix = matrixPlot(points, {
      xLabel: 'Give cost (low → high)', yLabel: 'Get value (low → high)', xMax: 6, yMax: 6,
      quadrants: ['Easy wins — do first', 'Key trades', 'Low priority', 'High cost, low return — avoid']
    });
    const ggCols = [
      { key: 'give', label: 'Give', width: '26%', render: (r) => esc(r.give), sort: false },
      { key: 'giveCost', label: 'Cost', width: '10%', render: (r) => magPill(r.giveCost), sortVal: (r) => MAG_LEVEL[r.giveCost] },
      { key: 'get', label: 'Get', width: '26%', render: (r) => esc(r.get), sort: false },
      { key: 'getValue', label: 'Value', width: '10%', render: (r) => magPill(r.getValue), sortVal: (r) => MAG_LEVEL[r.getValue] },
      { key: 'issues', label: 'Linked issues', width: '18%', render: (r) => r.issueIds.map(issueTag).join(' '), sort: false }
    ];
    const ggTable = dataTable(ggCols, d.negotiation.giveGets, { id: 'negGiveGetTable', dense: true, zebra: true });
    const ggMatrixCard = saCard('Give-get matrix', matrix, { accent: 'emph', icon: 'trade',
      sub: evidenceChip('inference', { short: true }) });
    const ggTableCard = saCard('Give / get detail', ggTable, { accent: 'plum', icon: 'handshake' });

    // concession ladders — one timeline per issue, laid out side by side
    const laddersInner = '<div class="grid">' + d.negotiation.concessionLadders.map((cl) => {
      const iss = issueById(cl.issueId);
      const items = cl.steps.map((s, i) => ({
        date: 'Step ' + (i + 1), name: s,
        tone: i === 0 ? 'pri' : (i === cl.steps.length - 1 ? 'emph' : '')
      }));
      return '<div class="col-4"><div class="ladder-hd">' + (iss ? issueTag(iss.id) : cl.issueId) +
        '<span style="margin-left:6px">' + esc(iss ? iss.title : cl.issueId) + '</span></div>' +
        timeline(items) + '</div>';
    }).join('') + '</div>';
    const laddersCard = saCard('Concession ladders', laddersInner, { accent: 'teal', icon: 'clock' });

    // packages — 2-3 bundled asks that trade together
    const pkgCards = d.negotiation.packages.map((p, i) => {
      const accent = i === 0 ? 'plum' : i === 1 ? 'teal' : 'emph';
      const inner =
        '<div class="tiny muted" style="margin-bottom:6px">Priority ' + p.priority + '</div>' +
        '<div style="margin-bottom:6px"><b>Give:</b> ' + esc(p.give) + '</div>' +
        '<div style="margin-bottom:8px"><b>Get:</b> ' + esc(p.get) + '</div>' +
        '<div style="margin-bottom:6px">' + p.issueIds.map(issueTag).join(' ') + '</div>' +
        evidenceChip(p.evidenceType, { short: true });
      return '<div class="col-4">' + saCard(p.name, inner, { accent, icon: 'target' }) + '</div>';
    }).join('');
    const packagesRow = '<div class="grid">' + pkgCards + '</div>';

    // sequence — the order packages are opened in a session
    const seqItems = d.negotiation.sequence.map((s) => {
      const p = pkgById(s.packageId);
      return { date: 'Step ' + s.step, name: s.text, meta: p ? esc(p.name) : s.packageId, tone: s.step === 1 ? 'pri' : '' };
    });
    const sequenceCard = saCard('Sequence', timeline(seqItems) +
      insight('Open with protection, move to commercials once terms are verbally agreed, close on service and exit.'),
      { accent: 'plum', icon: 'clock' });

    return '<div class="grid">' +
      '<div class="col-5">' + objectivesCard + '</div>' +
      '<div class="col-7">' + leverageCard + '</div>' +
      '<div class="col-7">' + ggMatrixCard + '</div>' +
      '<div class="col-5">' + ggTableCard + '</div>' +
      '<div class="col-12">' + laddersCard + '</div>' +
      '<div class="col-12">' + packagesRow + '</div>' +
      '<div class="col-12">' + sequenceCard + '</div>' +
      '</div>';
  }

  /* ================================ MEETING BRIEF ============================ */
  function buildMeetingBrief() {
    const mb = d.negotiation.meetingBrief;

    const fullBriefText = [
      'MEETING BRIEF — ' + d.deal.title,
      '',
      'Objective: ' + mb.objective,
      '',
      'Agenda:',
      ...mb.agenda.map((a) => '  ' + a.block + ' — ' + a.item),
      '',
      'Opening statement:',
      mb.opening,
      '',
      'Asks:',
      ...mb.asks.map((a) => '  - ' + a.text + ' (' + a.issueId + ')'),
      '',
      'Questions:',
      ...mb.questions.map((q) => '  - ' + q.text),
      '',
      'Expected pushback:',
      ...mb.expectedPushback.map((p) => '  Q: ' + p.pushback + '\n  A: ' + p.response),
      '',
      'Closing:',
      mb.closing
    ].join('\n');

    const agendaCard = saCard('Objective &amp; agenda',
      '<div style="margin-bottom:10px">' + esc(mb.objective) + ' ' + evidenceChip(mb.objectiveEvidence, { short: true }) + '</div>' +
      timeline(mb.agenda.map((a) => ({ date: a.block, name: a.item, tone: '' }))),
      { accent: 'plum', icon: 'meeting', sub: copyBtn('Copy full brief', null, fullBriefText) });

    const openingCard = saCard('Opening statement',
      '<div class="excerpt" style="border-left-color:var(--pri)">' + esc(mb.opening) + '</div>' +
      '<div class="btn-row">' + copyBtn('Copy opening', null, mb.opening) + '</div>',
      { accent: 'plum', icon: 'handshake' });

    const closingCard = saCard('Closing recap',
      '<div class="excerpt" style="border-left-color:var(--emph)">' + esc(mb.closing) + '</div>' +
      '<div class="btn-row">' + copyBtn('Copy closing', null, mb.closing) + '</div>',
      { accent: 'emph', icon: 'meeting' });

    const asksText = mb.asks.map((a) => '- ' + a.text).join('\n');
    const asksCard = saCard('Exact asks',
      '<ul class="plain-list">' + mb.asks.map((a) =>
        '<li>' + esc(a.text) + ' ' + issueTag(a.issueId) + ' ' + evidenceChip(a.evidenceType, { short: true }) + '</li>').join('') + '</ul>' +
      '<div class="btn-row">' + copyBtn('Copy asks', null, asksText) + '</div>',
      { accent: 'teal', icon: 'flag' });

    const questionsText = mb.questions.map((q) => '- ' + q.text).join('\n');
    const questionsCard = saCard('Questions to ask',
      '<ul class="plain-list">' + mb.questions.map((q) =>
        '<li>' + esc(q.text) + ' ' + issueTag(q.issueId) + ' ' + evidenceChip(q.evidenceType, { short: true }) + '</li>').join('') + '</ul>' +
      '<div class="btn-row">' + copyBtn('Copy questions', null, questionsText) + '</div>',
      { accent: 'teal', icon: 'info' });

    const pbCols = [
      { key: 'pushback', label: 'Expected pushback', width: '38%', render: (r) => '<span class="tiny">' + esc(r.pushback) + '</span>', sort: false },
      { key: 'response', label: 'Recommended response', width: '38%', render: (r) => esc(r.response), sort: false },
      { key: 'issue', label: 'Issue', width: '24%', render: (r) => issueTag(r.issueId) + ' ' + evidenceChip(r.evidenceType, { short: true }), sort: false }
    ];
    const pbText = mb.expectedPushback.map((p) => 'Q: ' + p.pushback + '\nA: ' + p.response).join('\n\n');
    const pushbackCard = saCard('Expected pushback',
      dataTable(pbCols, mb.expectedPushback, { id: 'negPushbackTable', zebra: true, dense: true }) +
      '<div class="btn-row">' + copyBtn('Copy pushback table', null, pbText) + '</div>',
      { accent: 'plum', icon: 'scale' });

    return '<div class="grid">' +
      '<div class="col-12">' + agendaCard + '</div>' +
      '<div class="col-6">' + openingCard + '</div>' +
      '<div class="col-6">' + closingCard + '</div>' +
      '<div class="col-6">' + asksCard + '</div>' +
      '<div class="col-6">' + questionsCard + '</div>' +
      '<div class="col-12">' + pushbackCard + '</div>' +
      '</div>';
  }

  /* ================================ SHELL ==================================== */
  const scopedStyle = '<style>' +
    '.neg-tab .obj-row{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}' +
    '.neg-tab .obj-row:first-child{border-top:0}' +
    '.neg-tab .obj-num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--pri);color:var(--pri-fg);' +
    'font:800 var(--fz-sm)/24px var(--sans);text-align:center}' +
    '.neg-tab .obj-body{font-size:var(--fz-sm)}' +
    '.neg-tab .obj-issues{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}' +
    '.neg-tab .neg-tag{cursor:pointer;font-family:var(--mono)}' +
    '.neg-tab .ladder-hd{font-weight:700;font-size:var(--fz-sm);margin-bottom:8px;display:flex;align-items:center}' +
    '.neg-tab .hs-line{display:flex;gap:5px;align-items:flex-start;color:var(--danger-fg);font-weight:600;font-size:var(--fz-sm)}' +
    '.neg-tab .hs-line svg{width:13px;height:13px;flex:none;margin-top:2px;stroke:currentColor;fill:none;stroke-width:2}' +
    '.neg-tab .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}' +
    '.neg-tab .word-direct{display:none}' +
    '.neg-tab .word-toggle-row{display:flex;align-items:center;gap:6px;margin:10px 0}' +
    '.neg-tab #wm-collab-pos:checked + label,.neg-tab #wm-direct-pos:checked + label{background:var(--pri);color:var(--pri-fg);border-color:var(--pri)}' +
    '.neg-tab #wm-direct-pos:checked ~ .word-scope .word-collab{display:none}' +
    '.neg-tab #wm-direct-pos:checked ~ .word-scope .word-direct{display:-webkit-box}' +
    '.neg-tab .plain-list{margin:0;padding-left:18px;font-size:var(--fz-sm);line-height:1.6}' +
    '.neg-tab .plain-list li{margin-bottom:6px}' +
    '.neg-tab .subtab-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px;margin-right:2px}' +
    '.neg-tab #negPositionsTable tbody tr:not(.expander-row){cursor:pointer}' +
    '.neg-tab .row-chevron{display:inline-flex;margin-right:5px;color:var(--mut);transition:transform .15s;vertical-align:-3px}' +
    '.neg-tab .row-chevron svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}' +
    '.neg-tab tr.is-open .row-chevron{transform:rotate(90deg)}' +
    '</style>';

  return scopedStyle + '<div class="neg-tab">' +
    '<div class="wrap"><div class="tab-intro"><h2>Negotiation</h2>' +
    '<p class="q">Positions to open with, the trades available, and a copy-ready meeting brief — keyed to the same evidence-based issue register used in Contract. ' +
    coverageBadge(d.deal.evidenceCoverage) + '</p></div></div>' +
    '<div class="subtabbar" data-subtab-group="negotiation"><div class="wrap">' +
    '<button class="subtab-btn" data-subtab="positions" aria-selected="true">' + icon('target') + ' Positions</button>' +
    '<button class="subtab-btn" data-subtab="tradeplan">' + icon('trade') + ' Trade Plan</button>' +
    '<button class="subtab-btn" data-subtab="meeting">' + icon('meeting') + ' Meeting Brief</button>' +
    '</div></div>' +
    '<div class="tab-body"><div class="wrap">' +
    '<div data-subpanel="negotiation/positions" class="is-active">' + buildPositions() + '</div>' +
    '<div data-subpanel="negotiation/tradeplan">' + buildTradePlan() + '</div>' +
    '<div data-subpanel="negotiation/meeting">' + buildMeetingBrief() + '</div>' +
    '</div></div>' +
    '</div>';
}

if (typeof global !== 'undefined') {
  global.renderTab_negotiation = renderTab_negotiation;
  global.DealTabs = global.DealTabs || {};
  global.DealTabs.negotiation = renderTab_negotiation;
}

})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/* =============================================================================
 * tab-sources.js — "Sources & Gaps" primary tab.
 * Subtabs: Sources (inventory + coverage matrix) · Assumptions (register +
 * classification + impact ranking) · Missing Inputs (ranked gaps + impact/ease
 * matrix + a plain future-ready list).
 *
 * Reads ONLY from dashboardData (param d). No fact is restated/hard-coded here
 * that isn't already in the model — this tab is the honesty layer for every
 * other tab's evidence chips.
 * ========================================================================== */
(function (global) {
  'use strict';

  /* ---------- local helpers (not exported — scoped to this file) ---------- */

  // materiality/priority -> pill using the shared .pill modifier classes
  function gapPriorityPill(p) {
    var map = { critical: ['danger', 'Critical'], important: ['warn', 'Important'], helpful: ['info', 'Helpful'] };
    var m = map[p] || ['muted', p];
    return '<span class="pill ' + m[0] + '">' + esc(m[1]) + '</span>';
  }

  // best-effort jump target for a cross-reference id or "Tab/Subtab" label found
  // in usedIn[] / affectedAnalysis[] arrays.
  function pathJump(text) {
    var t = String(text || '').toLowerCase();
    if (/^iss-/.test(t)) return 'tab:contract/sub:terms';
    if (/^sc-/.test(t)) return 'tab:commercials/sub:scenarios';
    if (/^cl-/.test(t)) return 'tab:commercials/sub:proposal';
    if (/^bench-/.test(t)) return 'tab:commercials/sub:benchmarks';
    if (t.indexOf('terms & risk') !== -1 || t === 'issues') return 'tab:contract/sub:terms';
    if (t.indexOf('scope') !== -1 || t.indexOf('sla') !== -1) return 'tab:contract/sub:scope';
    if (t.indexOf('scenario') !== -1) return 'tab:commercials/sub:scenarios';
    if (t.indexOf('benchmark') !== -1) return 'tab:commercials/sub:benchmarks';
    if (t.indexOf('sources') !== -1) return 'tab:sources/sub:sources';
    return null;
  }
  function analysisTag(text) {
    var j = pathJump(text);
    return j ? jumpLink(text, j) : '<span class="tiny muted">' + esc(text) + '</span>';
  }

  // source coverage x analysis-area heat grid (flat CSS-grid children — matches .heat-grid)
  function buildCoverageMatrix(d) {
    var areas = d.analysisAreas;
    var strength = { contract: 5, internal: 4, calculated: 4, public: 3, inference: 2, assumption: 2, unavailable: 0 };
    var evLabel = { contract: 'Contract fact', internal: 'Internal fact', public: 'Public fact', calculated: 'Calculated', inference: 'Claude inference', assumption: 'User assumption', unavailable: 'Unavailable' };
    var cells = '<div class="hg-lbl"></div>' + areas.map(function (a) { return '<div class="hg-col">' + esc(a) + '</div>'; }).join('');
    d.sources.forEach(function (src) {
      cells += '<div class="hg-lbl" title="' + esc(src.label + ' — ' + src.detail) + '">' + esc(src.id) + '</div>';
      areas.forEach(function (a) {
        var covers = src.coverage.indexOf(a) !== -1;
        if (!covers) {
          cells += '<span class="heatcell heat-0" title="' + esc(src.label + ' does not cover ' + a) + '">–</span>';
        } else if (src.evidenceType === 'unavailable') {
          cells += heatCell(0, { label: '?', title: src.label + ' references "' + a + '" but the document was not provided this session — coverage there is unverified.' });
        } else {
          var lvl = strength[src.evidenceType] != null ? strength[src.evidenceType] : 2;
          cells += heatCell(lvl, { label: '●', title: src.label + ' → ' + a + ' · ' + (evLabel[src.evidenceType] || src.evidenceType) });
        }
      });
    });
    return '<div class="heat-grid" style="grid-template-columns:150px repeat(' + areas.length + ',1fr)">' + cells + '</div>';
  }

  function buildSourceKindBars(d) {
    var kindLabel = { contract: 'Contract documents', playbook: 'Playbook', template: 'Template', m365: 'M365 / correspondence', finance: 'Finance', web: 'Public web' };
    var kindColor = { contract: 'pri', playbook: 'teal', template: 'teal', m365: 'teal', finance: 'teal', web: 'warn' };
    var counts = {};
    d.sources.forEach(function (s) { counts[s.kind] = (counts[s.kind] || 0) + 1; });
    var keys = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    var max = Math.max.apply(null, keys.map(function (k) { return counts[k]; })) || 1;
    return keys.map(function (k) {
      return barRow(kindLabel[k] || k, counts[k], max, String(counts[k]), { color: kindColor[k] || 'teal' });
    }).join('');
  }

  /* ---------- subtab 1: Sources --------------------------------------------- */
  function buildSourcesPanel(d) {
    var missingSrc = d.sources.filter(function (s) { return s.evidenceType === 'unavailable'; });
    var areaCounts = d.analysisAreas.map(function (a) {
      return { area: a, n: d.sources.filter(function (s) { return s.coverage.indexOf(a) !== -1 && s.evidenceType !== 'unavailable'; }).length };
    });
    var weakest = areaCounts.slice().sort(function (a, b) { return a.n - b.n; })[0];
    var strongestSrc = d.sources.slice().sort(function (a, b) { return b.coverage.length - a.coverage.length; })[0];

    var matrixCard = saCard('Source coverage — by analysis area', buildCoverageMatrix(d), {
      accent: 'teal', icon: 'sources', id: 'src-matrix',
      sub: d.sources.length + ' sources · ' + d.analysisAreas.length + ' areas'
    });

    var kindCard = saCard('Sources by kind', buildSourceKindBars(d), { icon: 'bench', sub: d.sources.length + ' total' });

    var tableCard = saCard('Source inventory', '' +
      '<div class="toolbar" data-filter-scope>' +
        '<input type="search" placeholder="Filter sources…" data-filter-input data-filter-for="tbl-sources">' +
        '<span class="spacer"></span><span class="filter-count"></span>' +
      '</div>' +
      dataTable([
        { key: 'id', label: 'ID', width: '80px' },
        { key: 'label', label: 'Source', render: function (r) { return '<strong>' + esc(r.label) + '</strong><div class="tiny muted">' + esc(r.detail) + '</div>'; } },
        { key: 'kind', label: 'Kind', render: function (r) { return '<span style="text-transform:capitalize">' + esc(r.kind) + '</span>'; } },
        { key: 'coverage', label: 'Areas', align: 'num', sortVal: function (r) { return r.coverage.length; }, render: function (r) { return String(r.coverage.length); } },
        { key: 'evidenceType', label: 'Evidence', render: function (r) { return evidenceChip(r.evidenceType, { short: true }); } }
      ], d.sources, {
        id: 'tbl-sources', zebra: true,
        expand: function (r) {
          return '<div class="kv"><dt>Coverage areas</dt><dd>' + r.coverage.map(function (a) { return '<span class="tiny">' + esc(a) + '</span>'; }).join(', ') +
            '</dd><dt>Detail</dt><dd>' + esc(r.detail) + '</dd><dt>Evidence</dt><dd>' + evidenceChip(r.evidenceType) + '</dd></div>';
        }
      }),
      { icon: 'doc', sub: 'click a row to expand' });

    var gapNote = missingSrc.length ? gapCard(
      missingSrc.length + ' referenced source' + (missingSrc.length === 1 ? '' : 's') + ' not provided this session',
      'Referenced but unavailable: ' + missingSrc.map(function (s) { return jumpLink(s.id, 'el:' + s.id); }).join(', ') +
      '. Coverage on their analysis areas rests on inference from the surrounding contract text, not a reviewed document.'
    ) : '';

    var insights = [
      insight('The weakest-covered analysis area is <strong>' + esc(weakest.area) + '</strong> (' + weakest.n + ' verified source' + (weakest.n === 1 ? '' : 's') + ') — treat conclusions there as directional.', 'warn'),
      insight('<strong>' + esc(strongestSrc.label) + '</strong> carries the broadest coverage (' + strongestSrc.coverage.length + ' of ' + d.analysisAreas.length + ' areas) and is the primary anchor for this analysis.'),
      insight('Overall evidence coverage for this deal is rated <strong>' + esc(d.deal.evidenceCoverage) + '</strong>' +
        (missingSrc.length ? ' — strong on terms already in hand, limited wherever ' + missingSrc.map(function (s) { return s.id; }).join(' / ') + ' would otherwise apply.' : '.'))
    ].join('');

    return '<div class="grid">' +
      '<div class="col-12">' + matrixCard + '</div>' +
      '<div class="col-7">' + tableCard + '</div>' +
      '<div class="col-5">' + kindCard + '<div style="margin-top:16px">' + saCard('Evidence notes', insights + gapNote, { icon: 'info', accent: 'emph' }) + '</div></div>' +
    '</div>';
  }

  /* ---------- subtab 2: Assumptions ----------------------------------------- */
  function buildAssumptionsPanel(d) {
    var weight = { high: 3, medium: 2, low: 1 };
    var ranked = d.assumptions.slice().sort(function (a, b) {
      return (weight[b.materiality] || 0) - (weight[a.materiality] || 0) || b.usedIn.length - a.usedIn.length;
    });
    var maxReach = Math.max.apply(null, d.assumptions.map(function (a) { return a.usedIn.length; })) || 1;

    var rankCard = saCard('Impact ranking — materiality × downstream reach', ranked.map(function (a) {
      return barRow(a.label + ' (' + a.materiality + ')', a.usedIn.length, maxReach, a.usedIn.length + ' use' + (a.usedIn.length === 1 ? '' : 's'),
        { color: a.materiality === 'high' ? 'emph' : a.materiality === 'medium' ? 'teal' : 'pri' });
    }).join(''), { accent: 'teal', icon: 'target', sub: d.assumptions.length + ' local inputs' });

    var registerCard = saCard('Assumption register (editable — Local)', d.assumptions.map(function (a) { return assumptionSlider(a); }).join(''), {
      accent: 'emph', icon: 'assume', sub: 'drag to test scenarios'
    });

    var tableCard = saCard('Assumption detail', dataTable([
      { key: 'id', label: 'ID', width: '64px' },
      { key: 'label', label: 'Assumption' },
      { key: 'value', label: 'Value', align: 'num', sortVal: function (a) { return a.value; }, render: function (a) {
          return '<span data-asm-live="' + esc(a.id) + '">' + (a.unit === '%' ? a.value + '%' : a.value.toLocaleString('en-US') + (a.unit ? ' ' + a.unit : '')) + '</span>';
        } },
      { key: 'classification', label: 'Classification', render: function (a) { return evidenceChip(a.evidenceType || a.classification, { short: true }); } },
      { key: 'materiality', label: 'Materiality', render: function (a) { return severityPill(a.materiality); } },
      { key: 'usedIn', label: 'Feeds', render: function (a) { return a.usedIn.map(analysisTag).join(' '); } }
    ], d.assumptions, {
      id: 'tbl-assumptions', zebra: true,
      expand: function (a) {
        return '<div class="kv"><dt>Range</dt><dd>' + a.min + '–' + a.max + ' ' + esc(a.unit || '') + ' (step ' + a.step + ')</dd>' +
          '<dt>Used in</dt><dd>' + a.usedIn.map(analysisTag).join(' ') + '</dd></div>';
      }
    }), { icon: 'doc' });

    var nUser = d.assumptions.filter(function (a) { return a.classification === 'assumption'; }).length;
    var nInternal = d.assumptions.filter(function (a) { return a.classification === 'internal'; }).length;
    var nContract = d.assumptions.filter(function (a) { return a.classification === 'contract'; }).length;
    var highs = d.assumptions.filter(function (a) { return a.materiality === 'high'; });

    var insights = [
      insight(nUser + ' of ' + d.assumptions.length + ' inputs are user assumptions (editable, Local) rather than contract or internal facts; ' +
        nContract + ' come straight from the contract and ' + nInternal + ' from internal finance.', nUser ? 'warn' : ''),
      highs.length ? insight('High-materiality: ' + highs.map(function (a) { return esc(a.label); }).join(', ') + ' — small changes here move the scenario totals the most.') : '',
      insight('Sliders here are Local — editing one live-updates every dependent total (scenarios, 3-yr TCV) wherever it is used across this artifact.')
    ].filter(Boolean).join('');

    return '<div class="grid">' +
      '<div class="col-7">' + rankCard + '</div>' +
      '<div class="col-5">' + registerCard + '</div>' +
      '<div class="col-12">' + tableCard + '</div>' +
      '<div class="col-12">' + saCard('Evidence notes', insights, { icon: 'info', accent: 'emph' }) + '</div>' +
    '</div>';
  }

  /* ---------- subtab 3: Missing Inputs (gaps) ------------------------------- */
  function buildGapsPanel(d) {
    var points = d.gaps.map(function (g) {
      return {
        x: g.ease, y: g.decisionImpact, label: g.id.replace('GAP-', ''),
        color: g.priority === 'critical' ? 'danger' : g.priority === 'important' ? 'emph' : 'teal',
        title: g.input + ' — ' + g.priority + ' · impact ' + g.decisionImpact + '/5, ease ' + g.ease + '/5',
        jump: 'el:' + g.id
      };
    });
    var matrixCard = saCard('Decision impact vs. ease to obtain', matrixPlot(points, {
      xLabel: 'Ease to obtain →', yLabel: 'Decision impact →', xMax: 5, yMax: 5,
      quadrants: ['Hard, high stakes', 'Quick win — get first', 'Low priority', 'Easy, low value']
    }), { accent: 'danger', icon: 'gap', sub: d.gaps.length + ' open inputs' });

    var counts = { critical: 0, important: 0, helpful: 0 };
    d.gaps.forEach(function (g) { counts[g.priority] = (counts[g.priority] || 0) + 1; });
    var maxC = Math.max(counts.critical, counts.important, counts.helpful) || 1;
    var countsCard = saCard('Gaps by priority',
      barRow('Critical', counts.critical, maxC, String(counts.critical), { color: 'danger' }) +
      barRow('Important', counts.important, maxC, String(counts.important), { color: 'warn' }) +
      barRow('Helpful', counts.helpful, maxC, String(counts.helpful), { color: 'teal' }),
      { icon: 'flag' });

    var tableCard = saCard('Missing-input register', '' +
      '<div class="toolbar" data-filter-scope>' +
        '<input type="search" placeholder="Filter missing inputs…" data-filter-input data-filter-for="tbl-gaps">' +
        '<span class="spacer"></span><span class="filter-count"></span>' +
      '</div>' +
      dataTable([
        { key: 'priority', label: 'Priority', render: function (g) { return gapPriorityPill(g.priority); }, sortVal: function (g) { return ({ critical: 3, important: 2, helpful: 1 })[g.priority] || 0; } },
        { key: 'input', label: 'Missing input', render: function (g) { return '<strong id="' + esc(g.id) + '">' + esc(g.input) + '</strong>'; } },
        { key: 'decisionImpact', label: 'Impact', align: 'num', sortVal: function (g) { return g.decisionImpact; }, render: function (g) { return heatCell(g.decisionImpact, { title: 'Decision impact ' + g.decisionImpact + '/5' }); } },
        { key: 'ease', label: 'Ease', align: 'num', sortVal: function (g) { return g.ease; }, render: function (g) { return heatCell(g.ease, { title: 'Ease to obtain ' + g.ease + '/5' }); } },
        { key: 'possibleSource', label: 'Possible source' },
        { key: 'evidenceType', label: 'Status', render: function (g) { return evidenceChip(g.evidenceType, { short: true }); } }
      ], d.gaps, {
        id: 'tbl-gaps', zebra: true,
        expand: function (g) {
          return '<div class="kv"><dt>Why it matters</dt><dd>' + esc(g.whyItMatters) + '</dd>' +
            '<dt>Possible source</dt><dd>' + esc(g.possibleSource) + '</dd>' +
            '<dt>Affects</dt><dd>' + g.affectedAnalysis.map(analysisTag).join(' ') + '</dd></div>';
        }
      }),
      { icon: 'doc' });

    var helpful = d.gaps.filter(function (g) { return g.priority === 'helpful'; });
    var futureCard = helpful.length ? saCard('Future-ready inputs (nice-to-have)',
      '<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:9px">' +
        helpful.map(function (g) {
          return '<li><strong>' + esc(g.input) + '</strong> — ' + esc(g.whyItMatters) +
            '<div class="tiny muted">Possible source: ' + esc(g.possibleSource) + '</div></li>';
        }).join('') +
      '</ul>',
      { accent: 'teal', icon: 'clock', sub: helpful.length + ' item' + (helpful.length === 1 ? '' : 's') }) : '';

    var critical = d.gaps.filter(function (g) { return g.priority === 'critical'; });
    var quickWins = d.gaps.filter(function (g) { return g.ease >= 4 && g.decisionImpact >= 4; });
    var affectedSet = {};
    d.gaps.forEach(function (g) { (g.affectedAnalysis || []).forEach(function (x) { affectedSet[x] = 1; }); });

    var insights = [
      critical.length ? insight(critical.length + ' critical gap' + (critical.length === 1 ? '' : 's') + ' — ' +
        critical.map(function (g) { return jumpLink(g.input, 'el:' + g.id); }).join(', ') +
        ' — sit upstream of a signature condition or the commercial anchor.', 'danger') : '',
      quickWins.length ? insight('Quick wins (high impact, easy to obtain): ' + quickWins.map(function (g) { return esc(g.input); }).join(', ') + ' — worth chasing before the next draft.') : '',
      insight(d.gaps.length + ' inputs are marked unavailable, touching ' + Object.keys(affectedSet).length + ' downstream analyses across the artifact.')
    ].filter(Boolean).join('');

    return '<div class="grid">' +
      '<div class="col-7">' + matrixCard + '</div>' +
      '<div class="col-5">' + countsCard + '<div style="margin-top:16px">' + saCard('Evidence notes', insights, { icon: 'info', accent: 'emph' }) + '</div></div>' +
      '<div class="col-12">' + tableCard + '</div>' +
      (futureCard ? '<div class="col-12">' + futureCard + '</div>' : '') +
    '</div>';
  }

  /* ---------- tab entry point ------------------------------------------------ */
  function renderTab_sources(d) {
    var introRight = coverageBadge(d.deal.evidenceCoverage);

    var sourcesHtml = buildSourcesPanel(d);
    var assumptionsHtml = buildAssumptionsPanel(d);
    var gapsHtml = buildGapsPanel(d);

    return '' +
      '<div class="tab-body"><div class="wrap">' +
        '<div class="tab-intro" style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap">' +
          '<div>' +
            '<h2>Sources &amp; Gaps</h2>' +
            '<p class="q">Where every fact, figure, and assumption in this snapshot came from — and what is still missing before signature. This is the evidence layer behind every chip on the other four tabs.</p>' +
          '</div>' +
          '<div>' + introRight + '</div>' +
        '</div>' +
      '</div></div>' +
      '<div class="subtabbar" data-subtab-group="sources"><div class="wrap">' +
        '<button class="subtab-btn" data-subtab="sources" aria-selected="true">Sources</button>' +
        '<button class="subtab-btn" data-subtab="assumptions" aria-selected="false">Assumptions</button>' +
        '<button class="subtab-btn" data-subtab="gaps" aria-selected="false">Missing Inputs</button>' +
      '</div></div>' +
      '<div class="tab-body"><div class="wrap">' +
        '<div data-subpanel="sources/sources" class="is-active">' + sourcesHtml + '</div>' +
        '<div data-subpanel="sources/assumptions">' + assumptionsHtml + '</div>' +
        '<div data-subpanel="sources/gaps">' + gapsHtml + '</div>' +
      '</div></div>';
  }

  // live-update the Assumptions detail table's value cells on every recalc
  // (assumptionSlider() already wires its own [data-asm-out] label via helpers.js;
  // this covers the separate table copy of the same value).
  if (global.DealUI && typeof global.DealUI.onRecalc === 'function') {
    global.DealUI.onRecalc(function (dd) {
      (dd.assumptions || []).forEach(function (a) {
        var nodes = document.querySelectorAll('[data-asm-live="' + a.id + '"]');
        nodes.forEach(function (el) {
          el.textContent = a.unit === '%' ? a.value + '%' : (a.value.toLocaleString('en-US') + (a.unit ? ' ' + a.unit : ''));
        });
      });
    });
  }

  global.renderTab_sources = renderTab_sources;
  global.DealTabs = global.DealTabs || {};
  global.DealTabs.sources = renderTab_sources;

})(typeof window !== 'undefined' ? window : this);

</script>
<script>
(function(){
  var mounts = ['brief','contract','commercials','negotiation','sources'];
  mounts.forEach(function(key){
    var panel = document.querySelector('[data-tabpanel="'+key+'"]');
    var fn = window.DealTabs && window.DealTabs[key];
    if (panel && typeof fn === 'function') panel.innerHTML = fn(dashboardData);
  });
  var ss = document.getElementById('ss');
  if (ss) {
    ss.innerHTML = dashboardData.deal.summaryStrip.map(function(s){
      return '<button class="ss-item tone-'+s.tone+'" data-jump="'+s.jump+'">'
        + '<span class="ss-val">'+s.value+'</span><span class="ss-lbl">'+s.label+'</span></button>';
    }).join('');
  }
})();
</script>
</body>
</html>
