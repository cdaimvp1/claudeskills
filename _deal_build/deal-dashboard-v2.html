    const html = `
      <dl class="kv">
        <dt>Deal</dt><dd>${esc(snap.title)}</dd>
        <dt>Supplier</dt><dd>${esc(snap.supplier)} <span class="tiny muted">(${esc(snap.supplierCategory)})</span></dd>
        <dt>Type</dt><dd>${esc(snap.negotiationType)}</dd>
        <dt>Contract set</dt><dd>${esc(setLabel)}</dd>
        <dt>Stage</dt><dd>${esc(snap.stage)}</dd>
        <dt>Counterparties</dt><dd>${esc(snap.counterparties.buyer)} <span class="muted">&harr;</span> ${esc(snap.counterparties.supplier)}</dd>
        <dt>Analysis date</dt><dd class="mono">${esc(snap.analysisDate)}</dd>
        <dt>Evidence</dt><dd>${coverageBadge(snap.evidenceCoverage)}</dd>
      </dl>
      <div class="card-note">${esc(d.meta.disclaimer)}</div>
    `;
    return saCard('Deal Snapshot', html, { accent: 'teal', icon: 'doc', sub: esc(snap.projectId) });
  }

  /* ============================= 3. STATE-OF-PLAY DIGEST ============================= */
  function buildStateOfPlay(d) {
    const sop = d.deal.stateOfPlay;
    const pen = d.deal.whoHasPen;
    const html = `
      <dl class="kv" style="grid-template-columns:1fr">
        <dt>Who has the pen</dt>
        <dd>${esc(sop.whoHasPen)} <span class="tiny muted">(${esc(pen.confidence)} confidence, as of ${esc(pen.asOf)})</span></dd>
        <dt>Last material event</dt>
        <dd>${esc(sop.lastMaterialEvent)}</dd>
        <dt>Next expected move</dt>
        <dd>${esc(sop.nextExpectedMove)}</dd>
      </dl>
      <div class="card-note">${evidenceChip(sop.evidenceType, { short: true })} Best-effort read of process position; not a monitored, live-tracked signal.</div>
      <div class="btn-row">${jumpLink('Full communications thread →', 'tab:negotiation')}</div>
    `;
    return saCard('State of Play', html, { accent: 'emph', icon: 'meeting' });
  }

  /* ============================= 4. TOP-5 ISSUES ============================= */
  function buildTopIssues(d) {
    const sorted = d.issues.slice().sort((a, b) => (rankPriority[b.priority] || 0) - (rankPriority[a.priority] || 0));
    const top5 = sorted.slice(0, 5);
    const cols = [
      { key: 'priority', label: '', width: '96px', sortVal: r => rankPriority[r.priority] || 0, render: r => severityPill(r.priority) },
      { key: 'title', label: 'Issue', render: r => `<strong>${esc(r.title)}</strong><div class="tiny muted">${esc(r.category)} · ${esc(r.clause)}</div>` },
      { key: 'ev', label: 'Evidence', width: '120px', sort: false, render: r => evidenceChip(r.evidenceType, { short: true, sources: r.sourceIds }) }
    ];
    const table = dataTable(cols, top5, {
      id: 'ov-top-issues', zebra: true,
      expand: r => `
        <div class="kv" style="margin-bottom:10px">
          <dt>Recommended</dt><dd>${esc(r.recommendedPosition)}</dd>
          <dt>Fallback</dt><dd>${esc(r.fallback)}</dd>
          <dt>Hard stop</dt><dd style="color:var(--danger-fg);font-weight:600">${esc(r.hardStop)}</dd>
        </div>
        ${excerpt(r.sourceExcerpt)}
        <div class="btn-row">
          ${jumpLink('Full issue register →', 'tab:contract/sub:legal')}
          ${jumpLink('Negotiation position →', 'tab:negotiation/sub:positions')}
        </div>
      `
    });
    const html = table + insight('These 5 span both hard-stops plus the highest-value high-priority items; the full ' +
      d.issues.length + '-issue register is in Terms &amp; Review → Terms &amp; Risk.');
    return saCard('Top 5 Issues', html, { icon: 'flag', sub: top5.length + ' of ' + d.issues.length });
  }

  /* ============================= 5. COMMERCIAL HEADLINE + TOTAL-DEAL ZOPA ============================= */
  function buildCommercial(d) {
    const scAsk = d.scenarios.find(s => s.id === 'SC-ask');
    const scTarget = d.scenarios.find(s => s.id === 'SC-target');
    const scFallback = d.scenarios.find(s => s.id === 'SC-fallback');
    const scMax = d.scenarios.find(s => s.id === 'SC-max');
    const maxY1 = Math.max(scAsk.y1Total, scTarget.y1Total, scFallback.y1Total, scMax.y1Total);
    const maxTotal = Math.max(scAsk.total, scTarget.total, scFallback.total, scMax.total);
    const batna = d.negotiation.batna;
    // The BATNA trigger text references the max-acceptable scenario figure directly
    // ("...cannot be brought at or below the max-acceptable (~$2.80M)"); reuse SC-max.total
    // rather than asserting a second, independently-typed number for the same walk-away line.
    const batnaFloor = scMax.total;

    const tcvGapEntry = d.deal.summaryStrip.find(s => s.key === 'tcvGap') ||
      { label: 'Target vs ask (3-yr)', value: '—', evidenceType: 'calculated' };

    function updateOverviewCommercialNumbers() {
      const ask = d.scenarios.find(s => s.id === 'SC-ask');
      const target = d.scenarios.find(s => s.id === 'SC-target');
      const fallback = d.scenarios.find(s => s.id === 'SC-fallback');
      const max = d.scenarios.find(s => s.id === 'SC-max');
      const ids = {
        'ov-y1-ask': ask.y1Total, 'ov-y1-target': target.y1Total, 'ov-y1-fallback': fallback.y1Total, 'ov-y1-max': max.y1Total,
        'ov-tcv-target': target.total, 'ov-tcv-fallback': fallback.total, 'ov-tcv-max': max.total, 'ov-tcv-ask': ask.total
      };
      Object.keys(ids).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = money(ids[id], { compact: true });
      });
    }
    if (typeof DealUI !== 'undefined') DealUI.onRecalc(updateOverviewCommercialNumbers);

    const y1Html =
      barRow('Ask', scAsk.y1Total, maxY1, `<span id="ov-y1-ask">${money(scAsk.y1Total, { compact: true })}</span>`, { color: 'danger' }) +
      barRow('Target', scTarget.y1Total, maxY1, `<span id="ov-y1-target">${money(scTarget.y1Total, { compact: true })}</span>`, { color: 'pri' }) +
      barRow('Fallback', scFallback.y1Total, maxY1, `<span id="ov-y1-fallback">${money(scFallback.y1Total, { compact: true })}</span>`, { color: 'teal' }) +
      barRow('Max acceptable', scMax.y1Total, maxY1, `<span id="ov-y1-max">${money(scMax.y1Total, { compact: true })}</span>`, { color: 'warn' });

    const zopaHtml =
      barRow('Target', scTarget.total, maxTotal, `<span id="ov-tcv-target">${money(scTarget.total, { compact: true })}</span>`, { color: 'pri' }) +
      barRow('Fallback', scFallback.total, maxTotal, `<span id="ov-tcv-fallback">${money(scFallback.total, { compact: true })}</span>`, { color: 'teal' }) +
      barRow('Max acceptable', scMax.total, maxTotal, `<span id="ov-tcv-max">${money(scMax.total, { compact: true })}</span>`, { color: 'warn' }) +
      barRow('BATNA walk-away trigger', batnaFloor, maxTotal,
        money(batnaFloor, { compact: true }) + ' ' + evidenceChip(batna.evidenceType, { short: true }), { color: 'warn' }) +
      barRow('Ask', scAsk.total, maxTotal, `<span id="ov-tcv-ask">${money(scAsk.total, { compact: true })}</span>`, { color: 'danger' });

    const batnaNote = insight(
      (batna.hasRealAlternative ? 'A real alternative exists: ' : 'No real alternative exists: ') + esc(batna.alternative) +
      '. Cost of invoking it: ' + esc(batna.costDelta) + '. Trigger: ' + esc(batna.trigger),
      'warn'
    );

    const html = `
      <div class="eyebrow" style="margin-bottom:7px">Year-1 all-in by scenario</div>
      ${y1Html}
      <div class="card-note">${esc(tcvGapEntry.label)}: <strong class="mono">${esc(tcvGapEntry.value)}</strong> ${evidenceChip(tcvGapEntry.evidenceType, { short: true })}</div>
      <div class="eyebrow" style="margin:14px 0 7px">Total-deal ZOPA (3-yr TCV)</div>
      ${zopaHtml}
      ${batnaNote}
      ${insight('Ask is anchored on platform + support loading; target reflects the internal precedent discount and day-rate norms (see Economics → Benchmarks).')}
    `;
    return saCard('Commercial Headline & Total-Deal ZOPA', html, { accent: 'teal', icon: 'money' });
  }

  /* ============================= 6. NEXT-ACTIONS TIMELINE ============================= */
  function buildNextActions(d) {
    const items = d.negotiation.sequence.map(s => {
      const pkg = d.negotiation.packages.find(p => p.id === s.packageId);
      const tone = pkg ? (pkg.priority === 1 ? 'pri' : pkg.priority === 3 ? 'emph' : '') : '';
      const meta = (pkg ? `<span class="tiny muted">${esc(pkg.name)}</span> ` : '') + evidenceChip(s.evidenceType, { short: true });
      return { date: 'Step ' + s.step, name: s.text, meta, tone };
    });
    const html = timeline(items) +
      insight('A planning sequence for the meeting, not a task list: packages are sequenced so protection terms are agreed before commercials are discussed.');
    return saCard('Immediate Next Actions', html, { accent: 'emph', icon: 'clock' });
  }

  /* ============================= 7. EVIDENCE & GAPS BAND ============================= */
  // Compact source x analysis-area coverage STRIP (one rollup row, not the full matrix).
  function buildCoverageStrip(d) {
    const areas = d.analysisAreas;
    const counts = areas.map(a => d.sources.filter(s => s.coverage.indexOf(a) !== -1 && s.evidenceType !== 'unavailable').length);
    const max = Math.max(...counts) || 1;
    let weakest = areas[0], weakestCount = counts[0];
    areas.forEach((a, i) => { if (counts[i] < weakestCount) { weakest = a; weakestCount = counts[i]; } });

    const header = '<div></div>' + areas.map(a => '<div class="hg-col">' + esc(a) + '</div>').join('');
    const cells = areas.map((a, i) =>
      `<button type="button" style="background:none;border:0;padding:0;cursor:pointer;display:flex;justify-content:center" ` +
      `data-jump="tab:contract/sub:legal" title="${esc(a)}: ${counts[i]} verified source${counts[i] === 1 ? '' : 's'}">` +
      heatCell(counts[i], { scale: max, label: String(counts[i]) }) + `</button>`
    ).join('');

    return '<div class="heat-grid" style="grid-template-columns:150px repeat(' + areas.length + ',1fr)">' +
      header + '<div class="hg-lbl">Verified sources</div>' + cells + '</div>' +
      insight('Weakest-covered analysis area: <strong>' + esc(weakest) + '</strong>; treat conclusions there as directional. ' +
        'Overall evidence coverage is rated <strong>' + esc(d.deal.evidenceCoverage) + '</strong>.', 'warn');
  }

  // Top-5 critical gaps (ranked by priority then decision impact).
  function buildTopGaps(d) {
    const topGaps = d.gaps.slice().sort((a, b) => {
      const pr = (rankGap[b.priority] || 0) - (rankGap[a.priority] || 0);
      return pr !== 0 ? pr : (b.decisionImpact || 0) - (a.decisionImpact || 0);
    }).slice(0, 5);
    const cols = [
      { key: 'input', label: 'Missing input', render: r => `<strong>${esc(r.input)}</strong><div class="tiny muted">${esc(r.whyItMatters)}</div>` },
      { key: 'priority', label: 'Priority', width: '100px', render: r => `<span class="pill ${r.priority === 'critical' ? 'danger' : r.priority === 'important' ? 'warn' : 'muted'}">${esc(r.priority)}</span>` },
      { key: 'impact', label: 'Decision impact', width: '130px', align: 'num', sortVal: r => r.decisionImpact, render: r => heatCell(r.decisionImpact, { scale: 5, label: r.decisionImpact, title: 'Decision impact ' + r.decisionImpact + '/5' }) },
      { key: 'ease', label: 'Ease to get', width: '110px', align: 'num', sortVal: r => r.ease, render: r => heatCell(r.ease, { scale: 5, label: r.ease, title: 'Ease ' + r.ease + '/5' }) },
      { key: 'ev', label: 'Status', width: '116px', sort: false, render: () => evidenceChip('unavailable', { short: true }) }
    ];
    return dataTable(cols, topGaps, { id: 'ov-top-gaps', zebra: true }) +
      insight('Top 5 of ' + d.gaps.length + ' tracked gaps, ranked by priority then decision impact. Quick wins (high impact, easy to get) are worth chasing before the next draft.');
  }

  // Expander 1: full source inventory register.
  function buildFullSourceInventory(d) {
    return dataTable([
      { key: 'id', label: 'ID', width: '80px' },
      { key: 'label', label: 'Source', render: r => `<strong>${esc(r.label)}</strong><div class="tiny muted">${esc(r.detail)}</div>` },
      { key: 'kind', label: 'Kind', render: r => `<span style="text-transform:capitalize">${esc(r.kind)}</span>` },
      { key: 'coverage', label: 'Areas', align: 'num', sortVal: r => r.coverage.length, render: r => String(r.coverage.length) },
      { key: 'evidenceType', label: 'Evidence', render: r => evidenceChip(r.evidenceType, { short: true }) }
    ], d.sources, {
      id: 'ov-source-inventory', zebra: true,
      expand: r => `<div class="kv"><dt>Coverage areas</dt><dd>${r.coverage.map(a => '<span class="tiny">' + esc(a) + '</span>').join(', ')}</dd>` +
        `<dt>Detail</dt><dd>${esc(r.detail)}</dd><dt>Evidence</dt><dd>${evidenceChip(r.evidenceType)}</dd></div>`
    });
  }

  // Expander 2: full impact-vs-ease missing-inputs matrix (all gaps, not just the top 5).
  function buildFullGapsMatrix(d) {
    const points = d.gaps.map(g => ({
      x: g.ease, y: g.decisionImpact, label: g.id.replace('GAP-', ''),
      color: g.priority === 'critical' ? 'danger' : g.priority === 'important' ? 'emph' : 'teal',
      title: g.input + ' (' + g.priority + ') impact ' + g.decisionImpact + '/5, ease ' + g.ease + '/5'
    }));
    return matrixPlot(points, {
      xLabel: 'Ease to obtain →', yLabel: 'Decision impact →', xMax: 5, yMax: 5,
      quadrants: ['Hard, high stakes', 'Quick win: get first', 'Low priority', 'Easy, low value']
    });
  }

  function buildEvidenceGapsBand(d) {
    const html = `
      ${buildCoverageStrip(d)}
      <div class="eyebrow" style="margin:16px 0 7px">Top 5 critical gaps</div>
      ${buildTopGaps(d)}
      <div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">
        ${collapsible('<span>Full source inventory (' + d.sources.length + ')</span>', buildFullSourceInventory(d))}
        ${collapsible('<span>Impact vs. ease: all missing inputs (' + d.gaps.length + ')</span>', buildFullGapsMatrix(d))}
      </div>
    `;
    return saCard('Evidence & Gaps', html, { icon: 'gap', sub: coverageBadge(d.deal.evidenceCoverage) });
  }

  /* ============================= ASSEMBLE ============================= */
  function renderTab_brief(d) {
    return `
    <div class="tab-body"><div class="wrap">

      <div class="tab-intro">
        <h2>Overview</h2>
        <div class="q">What is being negotiated, what blocks signature, what to ask for, and what is still missing; read in about two minutes.</div>
        <div class="tiny muted" style="margin-top:7px">Session snapshot generated ${esc(d.meta.generatedAt.replace('T', ' '))} · ${coverageBadge(d.deal.evidenceCoverage)} overall evidence coverage</div>
      </div>

      <div class="grid">
        <div class="col-8">${buildVerdict(d)}</div>
        <div class="col-4">${buildSnapshot(d)}</div>
      </div>

      <div class="grid" style="margin-top:16px">
        <div class="col-4">${buildStateOfPlay(d)}</div>
        <div class="col-8">${buildTopIssues(d)}</div>
      </div>

      <div class="grid" style="margin-top:16px">
        <div class="col-6">${buildCommercial(d)}</div>
        <div class="col-6">${buildNextActions(d)}</div>
      </div>

      <div class="grid" style="margin-top:16px">
        <div class="col-12">${buildEvidenceGapsBand(d)}</div>
      </div>

    </div></div>
    `;
  }

  global.renderTab_brief = renderTab_brief;
  global.DealTabs = global.DealTabs || {};
  global.DealTabs.brief = renderTab_brief;

})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/* =============================================================================
 * tab-contract.js, "Terms & Review" tab builder for the Deal artifact (id `contract`).
 * Question this tab answers: "can I trust the paper?"
 * Subtabs: 2A Documents & Conflicts (map) · 2B Legal & Protection (legal) ·
 *          2C Scope & Performance (scope, adaptive on meta.contractSet).
 *
 * Reads ONLY from dashboardData (param d). Every material value carries an
 * evidenceChip; every count/derived figure is computed live from d, never
 * hard-coded, so it stays consistent if the underlying model changes.
 * Depends on globals from helpers.js (esc, money, icon, saCard, dataTable, …)
 * which are loaded before this file. Attaches:
 *   window.renderTab_contract(d)  , the function itself
 *   window.DealTabs.contract      , same fn, per the shell's tab-builder convention
 *
 * BUG FIX (was tab-contract.js:111-121): the cross-document conflict table used
 * to be a hardcoded `crossRows` array. It now renders from d.documentConflicts[]
 * (see renderDocMap -> crossCard below). No fact is restated in this file that
 * isn't already in the canonical data object.
 * ========================================================================== */
(function (global) {
'use strict';

/* ---------- small local utilities (this file only) ------------------------ */
const ROLE_LABEL = { governing:'Governing', ordering:'Ordering', scope:'Scope',
                     data:'Data', security:'Security', correspondence:'Correspondence', reference:'Reference' };
function roleLabel(role) { return ROLE_LABEL[role] || role; }
function findDoc(id, d) { return (d.documents || []).find(x => x.id === id); }
function docTypeOf(id, d) { const doc = findDoc(id, d); return doc ? doc.type : id; }
function gapForDocId(docId, d) { return (d.gaps || []).find(g => (g.input || '').indexOf(docId) !== -1); }
function sevRank(p) { return ({ 'hard-stop':4, high:3, medium:2, low:1 })[p] || 0; }
function decisionLabel(v) { return ({ pending:'Pending', accept:'Accepted', reject:'Rejected', trade:'Trade' })[v] || v; }
function hasRealHardStop(text) { return !!text && !/^none\b/i.test(text.trim()); }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function cap1(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }

// findings-register jump target lives on THIS tab now (Terms & Risk merged into
// 2B Legal & Protection). Every internal cross-reference to "the register" points
// here, not the old standalone "terms" subtab.
const JUMP_LEGAL = 'tab:contract/sub:legal';
const JUMP_MAP = 'tab:contract/sub:map';
// The old standalone "Sources & Gaps" tab is folded into Overview's evidence &
// gaps band (see tab-brief.js "Critical Unknowns"); jump there for gap detail.
const JUMP_GAPS = 'tab:brief';

function issueJump(id, priority) {
  return jumpLink(id, JUMP_LEGAL) + (priority ? ' ' + severityPill(priority) : '');
}

/* ============================================================================
 * SUBTAB 2A, Documents & Conflicts
 * ========================================================================== */
function docNode(doc, isRoot) {
  const missing = doc.evidenceType === 'unavailable';
  const cls = 'ddm-child' + (missing ? ' ddm-missing' : '') + (isRoot ? ' ddm-rootbox' : '');
  return '<div class="' + cls + '">' +
    '<div class="ddm-role">' + esc(roleLabel(doc.role)) + '</div>' +
    '<div class="ddm-name">' + esc(doc.name) + '</div>' +
    '<div class="ddm-meta">' + esc(doc.type) + (doc.pages ? ' &middot; ' + doc.pages + ' pp' : '') +
      (doc.date ? ' &middot; ' + esc(doc.date) : '') + '</div>' +
    '<div class="ddm-status">' + esc(doc.status) + '</div>' +
    '<div class="ddm-bottom">' + evidenceChip(doc.evidenceType, { short:true, sources:[doc.id] }) + '</div>' +
  '</div>';
}

function renderDocMap(d) {
  const docs = d.documents || [];
  const root = docs.find(x => x.role === 'governing') || docs[0];
  const children = docs.filter(x => x !== root);
  const missingDocs = docs.filter(x => x.evidenceType === 'unavailable');
  const conflicts = d.documentConflicts || [];

  const treeHtml =
    '<div class="ddm-tree">' +
      '<div class="ddm-root">' + docNode(root, true) + '</div>' +
      '<div class="ddm-branch"></div>' +
      '<div class="ddm-children">' + children.map(c => docNode(c, false)).join('') + '</div>' +
    '</div>';

  const mapInsights =
    insight(docs.length + ' documents make up this deal; <strong>' + missingDocs.length +
      '</strong> (' + missingDocs.map(x => x.type).join(', ') + ') are referenced in the ' + esc(root.name) +
      ' but were not provided in this session.', 'warn') +
    insight('The MSA (' + esc(root.id) + ') is the sole governing instrument; the Order Form and SOW-01 operate under it. No amendments or Change Orders exist yet for this new agreement, so there are no term-evolution edges to show. That absence is honest, not a gap.', '');

  const docMapCard = saCard('Document Relationship Map', treeHtml + mapInsights,
    { icon:'doc', sub: docs.length + ' documents &middot; ' + missingDocs.length + ' unavailable' });

  /* ---- Document family register ---- */
  const invCols = [
    { key:'id', label:'ID', width:'64px' },
    { key:'name', label:'Document', render: r => '<strong>' + esc(r.name) + '</strong>' },
    { key:'role', label:'Role', render: r => esc(roleLabel(r.role)) },
    { key:'status', label:'Status', render: r => esc(r.status) },
    { key:'date', label:'Date', render: r => r.date ? esc(r.date) : '&mdash;', sortVal: r => r.date || '' },
    { key:'pages', label:'Pages', align:'num', render: r => r.pages != null ? r.pages : '&mdash;' },
    { key:'evidence', label:'Evidence', sort:false, render: r => evidenceChip(r.evidenceType, { short:true, sources:[r.id] }) }
  ];
  const invTable = dataTable(invCols, docs, {
    zebra:true, dense:true, id:'tbl-doc-inventory',
    expand: r => {
      const related = (r.relatedTo || []).map(id => { const rd = findDoc(id, d); return rd ? rd.type + ' (' + rd.id + ')' : id; }).join(', ');
      const lim = (r.limitations || []).length ? insight(esc(r.limitations.join(' ')), 'warn') : '';
      return '<div class="kv"><dt>Source</dt><dd>' + esc(r.sourceType) + '</dd>' +
        '<dt>Related to</dt><dd>' + (related || '&mdash;') + '</dd></div>' + lim;
    }
  });
  const invNote = insight('No document-retention/records-schedule field is carried on this document set in this session. Retention class is not shown below (would render here once available). ' + evidenceChip('unavailable', { short:true }));
  const invCard = saCard('Document Family Register', invTable + invNote, { icon:'sources', accent:'teal' });

  /* ---- Governing terms & precedence ---- */
  const precRows = docs.map(doc =>
    '<dt>' + esc(roleLabel(doc.role)) + '</dt><dd><strong>' + esc(doc.type) + '</strong> &mdash; ' + esc(doc.name) +
      (doc.evidenceType === 'unavailable' ? ' ' + evidenceChip('unavailable', { short:true }) : '') + '</dd>').join('');
  const precInner = '<dl class="kv">' + precRows + '</dl>' +
    insight('Precedence inferred from each document’s stated role (governing &rarr; ordering/scope &rarr; data/security); ' +
      'no explicit order-of-precedence clause appeared in the reviewed text. ' + evidenceChip('inference', { short:true }));
  const precCard = saCard('Governing Terms & Precedence', precInner, { icon:'scale', accent:'emph' });

  /* ---- Cross-document consistency / conflicts. BUG FIX: reads d.documentConflicts[],
   * never a hardcoded array. relation: 'conflict' | 'changed-by' | 'gap'. ---- */
  const RELATION_LABEL = { conflict:'Conflict check', 'changed-by':'Changed by', gap:'Gap (missing doc)' };
  const crossCols = [
    { key:'docs', label:'Documents', sort:false, render: r => docTypeOf(r.docA, d) + ' &harr; ' + docTypeOf(r.docB, d) },
    { key:'relation', label:'Dimension', render: r => esc(RELATION_LABEL[r.relation] || r.relation) },
    { key:'topic', label:'Topic', sort:false, render: r => r.topic },
    { key:'consistency', label:'Consistency', render: r => r.consistent ? statusPill('aligned','Aligned') : statusPill('deviation','Gap'), sortVal: r => r.consistent ? 1 : 0 },

    { key:'note', label:'Note', sort:false, render: r => '<span class="tiny muted">' + esc(r.note) + '</span>' }
  ];
  const crossTable = dataTable(crossCols, conflicts, { zebra:true, dense:true, id:'tbl-crossdoc' });
  const gapRelCount = conflicts.filter(c => !c.consistent).length;
  const crossInsights =
    insight('<strong>' + gapRelCount + '</strong> of ' + conflicts.length + ' cross-document checks are not consistent. Every one of them is a <strong>gap created by a missing exhibit</strong> (the DPA or the Security Exhibit), not a contradiction between documents that ARE in session.', gapRelCount ? 'warn' : '') +
    insight('No directly contradicting clause language was found between the three present documents (MSA, SOW-01, Order Form).');
  const crossCard = saCard('Cross-Document Consistency & Conflicts', crossTable + crossInsights,
    { icon:'scale', sub: conflicts.length + ' checks' });

  /* ---- Missing documents (gapCards) ---- */
  const missingHtml = missingDocs.map(md => {
    const gap = gapForDocId(md.id, d);
    const body = '<div class="kv" style="margin-bottom:6px">' +
      '<dt>Referenced at</dt><dd>' + esc(md.sourceType) + '</dd>' +
      (gap ? '<dt>Why it matters</dt><dd>' + esc(gap.whyItMatters) + '</dd>' +
             '<dt>Possible source</dt><dd>' + esc(gap.possibleSource) + '</dd>' : '') +
      '</div>' +
      (md.limitations || []).map(l => '<div class="tiny muted">' + esc(l) + '</div>').join('') +

      jumpLink('View in Critical Unknowns →', JUMP_GAPS) + '</div>';
    return gapCard(md.type + ', ' + md.name, body);
  }).join('<div class="divider"></div>');
  const missingCard = saCard('Missing Documents', missingHtml || '<div class="card-note">No referenced documents are missing.</div>',
    { icon:'gap', accent:'danger', sub: missingDocs.length + ' unavailable' });

  return '<div class="tab-intro"><h2>Documents &amp; Conflicts</h2><p class="q">Inventory, relationship structure, governing precedence and cross-document gaps for the MSA + SOW-01 + Order Form set. ' +
    coverageBadge(d.deal.evidenceCoverage) + '</p></div>' +

      '<div class="col-8">' + invCard + '</div>' +

      '<div class="col-7">' + crossCard + '</div>' +
      '<div class="col-5">' + missingCard + '</div>' +
    '</div>';
}

/* ---- Protection Score gauge (semicircular, banded, mandatory methodology) --- */
function polar(cx, cy, r, deg) {
  const rad = (deg * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}
function arcPath(cx, cy, r, startDeg, endDeg) {
  const s = polar(cx, cy, r, startDeg), e = polar(cx, cy, r, endDeg);
  const large = (startDeg - endDeg) > 180 ? 1 : 0;
  return 'M ' + s.x.toFixed(2) + ' ' + s.y.toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + e.x.toFixed(2) + ' ' + e.y.toFixed(2);
}
// Only Critical uses red. Locked palette (plum/teal/burnt-orange + red-critical-only).
const PROTECTION_BANDS = [
  { key:'Critical', range:'below 45', v:'var(--danger-bar)' },
  { key:'Weak',     range:'45–64',    v:'var(--warn-bar)' },
  { key:'Adequate', range:'65–79',    v:'var(--sec)' },
  { key:'Strong',   range:'80–100',   v:'var(--ok-bar)' }
];
function bandColor(band) {
  const hit = PROTECTION_BANDS.find(b => b.key.toLowerCase() === String(band || '').toLowerCase());
  return hit ? hit.v : 'var(--mut2)';
}
function protectionGauge(protection) {
  const score = clamp(Math.round(protection.score), 0, 100);
  const cx = 110, cy = 104, r = 82, sw = 20;
  const bg = arcPath(cx, cy, r, 180, 0);
  const fg = arcPath(cx, cy, r, 180, 180 - 1.8 * score);
  const color = bandColor(protection.band);
  const svg =
    '<svg viewBox="0 0 220 122" class="pg-svg" role="img" aria-label="Protection score ' + score + ' of 100, band ' + esc(protection.band) + '">' +
      '<path d="' + bg + '" stroke="var(--line2)" stroke-width="' + sw + '" fill="none" stroke-linecap="round"/>' +
      (score > 0 ? '<path d="' + fg + '" stroke="' + color + '" stroke-width="' + sw + '" fill="none" stroke-linecap="round"/>' : '') +
    '</svg>';
  const legend = PROTECTION_BANDS.map(b => {
    const cur = b.key.toLowerCase() === String(protection.band || '').toLowerCase();
    return '<span class="pg-leg' + (cur ? ' pg-leg-cur' : '') + '"><i style="background:' + b.v + '"></i>' + esc(b.key) + ' ' + esc(b.range) + '</span>';
  }).join('');
  return '<div class="pg-wrap">' + svg +
      '<div class="pg-score" style="color:' + color + '">' + score + '<span class="pg-max">/100</span></div>' +
      '<div class="pg-band">' + esc(protection.band) + ' protection</div>' +
    '</div>' +
    '<div class="pg-legend">' + legend + '</div>' +
    '<div class="divider"></div>' +
    '<div class="card-note" style="margin-top:0"><strong>Methodology.</strong> ' + esc(protection.methodology) + '</div>' +
    '<div style="margin-top:8px">' + evidenceChip(protection.evidenceType) + '</div>';
}

/* ---- Deduction table ---- */

  const check = insight('Deductions total <strong>&minus;' + totalPts + '</strong> points: 100 &minus; ' + totalPts + ' = <strong>' + (100 - totalPts) +
    '</strong>' + (reconciles ? ', matching the displayed score.' : ', does not match the displayed score (' + protection.score + '); flag for data QA.'),
    reconciles ? '' : 'danger');
  return saCard('Protection Score, Deductions', table + check, { icon:'flag', accent:'plum', sub: rows.length + ' deviations scored' });
}

        (m ? esc(m.name) + ' (' + esc(dl.milestone) + ')' : esc(dl.milestone)) + ' &middot; owner: ' + esc(dl.owner) +

  const timelineInsight = insight('Data onboarding (M2) is the schedule’s critical dependency &mdash; every later milestone chains from it, and buyer HRIS/payroll access is due within 5 days of kickoff.', 'warn');
  const timelineCard = saCard('Delivery Timeline', ganttHtml + delivLegend + timelineInsight + paymentReconciliationHtml(d),

  /* ---- Dependencies & risk ---- */

  /* ---- Acceptance analysis ---- */

    { key:'id', label:'ID', width:'56px' },
    { key:'deliverable', label:'Deliverable', width:'70px', render: r => esc(r.deliverable) },

  const accTable = dataTable(accCols, acceptance, { zebra:true, dense:true, id:'tbl-acceptance',
    rowClass: r => r.defined ? '' : 'rowtint-warn' });
  const undefinedCount = acceptance.filter(a => !a.defined).length;
  const accInsight = insight('<strong>' + undefinedCount + '</strong> of ' + acceptance.length + ' acceptance criteria have no objective pass/fail standard &mdash; links to the deemed-acceptance finding in Legal &amp; Protection.', undefinedCount ? 'warn' : '');
  const accCard = saCard('Acceptance Analysis', accTable + accInsight, { icon:'flag', accent:'teal' });

  /* ---- RACI ---- */
  const raci = sc.raci || { roles:[], rows:[] };
  const raciCols = [{ key:'activity', label:'Activity', sort:false,
      render: r => '<strong>' + esc(r.activity) + '</strong>' + (r.ambiguous ? ' <span class="pill warn" title="Ambiguous accountability">!</span>' : '') }]
    .concat(raci.roles.map((role, i) => ({ key:'role' + i, label: role, sort:false, render: r => raciCell(r.vals[i]) })));
  const raciRows = raci.rows || [];
  const raciTable = dataTable(raciCols, raciRows, { zebra:false, dense:true, id:'tbl-raci', sortable:false,
    rowClass: r => r.ambiguous ? 'rowtint-warn' : '',
    expand: r => r.note ? insight(esc(r.note), 'warn') + ' ' + evidenceChip(r.evidenceType, { short:true }) : null });
  const ambiguousCount = raciRows.filter(r => r.ambiguous).length;
  const raciLegend = '<div class="tiny muted" style="margin-top:8px">R = Responsible &middot; A = Accountable &middot; C = Consulted &middot; I = Informed. ' +
    ambiguousCount + ' of ' + raciRows.length + ' activities are flagged (two Accountable owners, or none) &mdash; expand for detail.</div>';
  const raciCard = saCard('Responsibility (RACI, compact)', raciTable + raciLegend, { icon:'raci', sub: ambiguousCount + ' flagged' });

  /* ---- SLA/KPI register & change control ---- */
  const slaCols = [
    { key:'metric', label:'Metric', render: r => esc(r.metric) },
    { key:'target', label:'Target', render: r => esc(r.target) },
    { key:'playbook', label:'Playbook', render: r => esc(r.playbook) },
    { key:'remedy', label:'Remedy', sort:false, render: r => esc(r.remedy) },
    { key:'status', label:'Status', render: r => statusPill(r.status) },
    { key:'issue', label:'Finding', sort:false, render: r => r.issueId ? issueJump(r.issueId) : '&mdash;' }

  const slaTable = dataTable(slaCols, sc.serviceLevels || [], { zebra:true, dense:true, id:'tbl-sla',
    rowClass: r => r.status === 'deviation' ? 'rowtint-danger' : (r.status === 'partial' ? 'rowtint-warn' : '') });
  const changeHtml = (sc.changeControl || []).map(c => insight(esc(c.text) + ' ' + evidenceChip(c.evidenceType, { short:true }))).join('');
  const slaCard = saCard('SLA / KPI Register & Change Control', slaTable + '<div class="divider"></div>' + changeHtml, { icon:'shield', accent:'emph' });

  return '<div class="grid">' +
      '<div class="col-8">' + timelineCard + '</div>' +
      '<div class="col-4">' + depCard + '</div>' +
      '<div class="col-6">' + scopeCard + '</div>' +
      '<div class="col-6">' + accCard + '</div>' +
      '<div class="col-7">' + raciCard + '</div>' +
      '<div class="col-5">' + slaCard + '</div>' +
    '</div>';
}

      'This engagement is classified as <strong>' + esc(cs) + '</strong>. No accompanying Statement of Work was provided in this session, so delivery scope, milestones, acceptance criteria, RACI and SLAs cannot be assessed here. If a SOW exists outside this session, request it before relying on this tab for delivery-performance review. ' + evidenceChip('unavailable'));

<script>
/* =============================================================================
 * tab-commercials.js, "ECONOMICS" primary tab builder for the Deal artifact.
 *   (display name ECONOMICS; id / jump namespace stays `commercials`)
 *
 * Exposes:  window.renderTab_commercials(d)  ->  HTML string for the whole tab
 *           (subtab bar + 3 subtab panels), plus window.DealTabs.commercials.
 *
 * Question the tab answers: "What is it worth, what should I pay?"
 *
 * Subtabs (3):
 *   3A  Deal Table & ZOPA   (data-subpanel="commercials/deal")
 *   3B  Pro-forma           (data-subpanel="commercials/proforma")
 *   3C  Scenarios & Sens.   (data-subpanel="commercials/scenarios")
 *
 * Reads ONLY from dashboardData (param d). Every rendered number already lives in
 * data.js (commercialLines / scenarios / benchmarks / assumptions / proforma /
 * issues) and is looked up by id, never restated. The pro-forma numbers are
 * PRECOMPUTED; this file renders them; it does NOT port the pv-12 engine.
 *
 * THE ONLY LIVE MATH ON THIS TAB is npv(cashflows, rate): moving the WACC slider
 * (assumptions ASM-5) re-discounts proforma.cashflowByYear at the slider rate and
 * repaints the NPV read + the NPV-vs-rate curve marker. Everything else (scenario
 * ladder, sensitivity tornado, savings waterfall, deal table) is static, drawn
 * straight from the internally-coherent data object. See DEAL-DESIGN-DECISION.md
 * PART 1 "Tab 3, ECONOMICS" and PART 2 §2-3 ("reuse pv-12" = render precomputed).
 * ========================================================================== */
(function (global) {
'use strict';

/* ---------- 0. local utils (helpers.js owns the exported API) ------------- */
function clampp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function sumF(arr, f) { return (arr || []).reduce((s, x) => s + (f(x) || 0), 0); }
function findLine(d, id) { return (d.commercialLines || []).find(l => l.id === id) || {}; }
function findIssue(d, id) { return (d.issues || []).find(i => i.id === id); }
function assumVal(d, id, fb) { const a = (d.assumptions || []).find(x => x.id === id); return a ? a.value : fb; }
// compact money with a clean minus sign (helpers' money() renders "$-350K")
function M(n) { if (n == null || isNaN(n)) return '—'; return (n < 0 ? '−' : '') + money(Math.abs(n), { compact: true }); }
function setText(id, t) { const e = document.getElementById(id); if (e) e.textContent = t; }

// THE only live calculation on this tab. Discounts each year at period i+1, the
// convention the data is built on (verified: nets at 6% -> npvCurve rate 6; cost
// outflows PV at 6% -> tcoSummary.netTerm). cashflows = array of per-year numbers.
function npv(cashflows, ratePct) {
  const r = (ratePct || 0) / 100;
  return (cashflows || []).reduce((s, v, i) => s + v / Math.pow(1 + r, i + 1), 0);
}

function negPill(level) {
  const lvl = String(level || '').toLowerCase();
  return '<span class="pill ' + (lvl === 'high' ? 'info' : lvl === 'medium' ? 'muted' : 'muted') + '">' + esc(level || '—') + '</span>';
}
function compPill(level) {
  const lvl = String(level || '').toLowerCase();
  return '<span class="pill ' + (lvl === 'moderate' ? 'info' : 'muted') + '">Comparability: ' + esc(level) + '</span>';
}
function confPill(c) {
  const k = String(c || '').toLowerCase();
  return '<span class="pill ' + (k === 'high' ? 'ok' : k === 'low' ? 'warn' : 'info') + '">' + esc(c || '—') + '</span>';
}
function matPill(m) {
  const k = String(m || '').toLowerCase();
  return '<span class="pill ' + (k === 'high' ? 'warn' : k === 'low' ? 'muted' : 'info') + '">' + esc(m || '—') + '</span>';
}

/* ---------- 1. 3A, DEAL TABLE & ZOPA ------------------------------------- */
// In-row bar: domain [target .. ask] (ask is always the max of the four for
// every line). Teal band = ZOPA (target -> max-acceptable); plum mark = supplier
// ask (sits above the zone); dotted tick = fallback.
function zopaBar(l) {
  const lo = l.target, hi = l.supplierAmount, span = (hi - lo) || 1;
  const pos = v => clampp((v - lo) / span * 100, 0, 100);
  const maxPct = pos(l.maximumAcceptable), fbPct = pos(l.fallback);
  return '<div class="zbar" title="ZOPA ' + M(lo) + '–' + M(l.maximumAcceptable) +
    '; fallback ' + M(l.fallback) + '; supplier ask ' + M(hi) + '">' +
    '<span class="z-band" style="left:0;width:' + maxPct.toFixed(1) + '%"></span>' +
    '<span class="z-fb" style="left:' + fbPct.toFixed(1) + '%"></span>' +
    '<span class="z-mark z-ask"></span></div>';
}
// benchmark -> line mapping (BENCH-int is the platform $/emp figure = CL-1;
// BENCH-svc is the implementation day-rate = CL-2). No line link in the data.
function benchForLine(d, id) {
  const map = { 'CL-1': 'BENCH-int', 'CL-2': 'BENCH-svc' };
  const bid = map[id];
  return bid ? (d.benchmarks || []).find(b => b.id === bid) : null;
}
function benchChip(d, id) {
  const b = benchForLine(d, id);
  return b ? '<span class="jump" data-jump="el:' + esc(b.id) + '" title="' + esc(b.item) + '">' + esc(b.comparability) + '</span>'
           : '<span class="tiny muted">—</span>';
}
function renderDealTable(d) {
  const cols = [
    { key: 'item', label: 'Line item', render: r => '<strong>' + esc(r.item) + '</strong><div class="tiny muted">' + esc(r.unit) + ' · ' + esc(r.frequency) + '</div>' },
    { key: 'ask', label: 'Ask (Y1)', align: 'num', sortVal: r => r.supplierAmount, render: r => M(r.supplierAmount) },
    { key: 'target', label: 'Target', align: 'num', sortVal: r => r.target, render: r => M(r.target) },
    { key: 'fallback', label: 'Fallback', align: 'num', sortVal: r => r.fallback, render: r => M(r.fallback) },
    { key: 'max', label: 'Max', align: 'num', sortVal: r => r.maximumAcceptable, render: r => M(r.maximumAcceptable) },
    { key: 'zopa', label: 'Ask vs target · ZOPA', sort: false, render: r => zopaBar(r) },
    { key: 'bench', label: 'Bench', sort: false, render: r => benchChip(d, r.id) },
    { key: 'negotiability', label: 'Neg.', render: r => negPill(r.negotiability) }
  ];
  return dataTable(cols, d.commercialLines || [], {
    id: 'cml-deal-table', zebra: true, dense: true,
    expand: r => '<div class="kv">' +
      '<dt>Quantity</dt><dd>' + esc(r.quantity) + ' ' + esc(r.unit) + '</dd>' +
      '<dt>ZOPA (target ↔ max)</dt><dd class="mono">' + M(r.target) + ' ↔ ' + M(r.maximumAcceptable) + '</dd>' +
      '<dt>Ask premium over max</dt><dd class="mono">' + M(r.supplierAmount - r.maximumAcceptable) + '</dd>' +
      '<dt>Evidence</dt><dd>' + evidenceChip(r.evidenceType, { sources: r.sourceIds }) +
        ' <span class="tiny muted">ask is a contract figure; target / fallback / max are calculated positions</span></dd></div>'
  });
}
const ZOPA_LEGEND =
  '<div class="legend" style="margin-top:10px">' +
    '<span><i style="background:var(--teal-t);border:1px solid var(--teal-d)"></i>ZOPA (target → max-acceptable)</span>' +
    '<span><i style="background:var(--plum)"></i>Supplier ask</span>' +
    '<span><i style="width:2px;border-left:2px dotted var(--mut2);background:transparent"></i>Fallback</span>' +
  '</div>';
function renderDealTotals(d) {
  const lines = d.commercialLines || [];
  const askY1 = sumF(lines, l => l.supplierAmount), tgtY1 = sumF(lines, l => l.target), maxY1 = sumF(lines, l => l.maximumAcceptable);
  const sc = id => ((d.scenarios || []).find(s => s.id === id) || {}).total;
  const askT = sc('SC-ask'), tgtT = sc('SC-target'), maxT = sc('SC-max');
  const col = (lbl, val) => '<div class="dt-col"><div class="k-lbl">' + lbl + '</div><div class="dt-vals">' + val + '</div></div>';
  return '<div class="deal-totals">' +
    col('Year-1 all-in', 'Ask <b>' + M(askY1) + '</b> · Target <b>' + M(tgtY1) + '</b> · Max <b>' + M(maxY1) + '</b>') +
    col('3-yr TCV (initial term)', 'Ask <b>' + M(askT) + '</b> · Target <b>' + M(tgtT) + '</b> · Max <b>' + M(maxT) + '</b>') +
    col('Total-deal ZOPA (3-yr)', '<b>' + M(tgtT) + ' ↔ ' + M(maxT) + '</b> ' + evidenceChip('calculated', { short: true })) +
  '</div>' +
  insight('The supplier ask (' + M(askT) + ' over the term) sits <strong>above</strong> the walk-away max (' + M(maxT) +
    '); any settlement inside ' + M(tgtT) + '–' + M(maxT) + ' is within the zone, with <strong>' + M(tgtT) +
    '</strong> the defensible target. Year-1 line totals reconcile to the scenario Year-1 figures.');
}
function renderDiscountArchitecture(d) {
  const lines = d.commercialLines || [];
  const disc = l => (l.supplierAmount - l.target);
  const platform = lines.filter(l => l.id === 'CL-1'), services = lines.filter(l => l.id !== 'CL-1');
  const platDisc = sumF(platform, disc), svcDisc = sumF(services, disc);
  const platAsk = sumF(platform, l => l.supplierAmount), svcAsk = sumF(services, l => l.supplierAmount);
  const platPct = platAsk ? Math.round(platDisc / platAsk * 100) : 0;
  const svcPct = svcAsk ? Math.round(svcDisc / svcAsk * 100) : 0;
  const maxD = Math.max(platDisc, svcDisc, 1);
  const perLine = lines.map(l => {
    const dd = disc(l), p = l.supplierAmount ? Math.round(dd / l.supplierAmount * 100) : 0;
    return '<div class="disc-line"><span>' + esc(l.item) + '</span><span class="mono">' + M(dd) + ' · ' + p + '%</span></div>';
  }).join('');
  return saCard('Discount Architecture',
    barRow('Platform (defensible)', platDisc, maxD, M(platDisc) + ' · ~' + platPct + '%', { color: 'pri', title: 'Platform line discount to internal precedent' }) +
    barRow('Services & support (loaded)', svcDisc, maxD, M(svcDisc) + ' · ~' + svcPct + '%', { color: 'emph', title: 'Implementation, support, connectors, training' }) +
    '<div style="margin-top:10px">' + perLine + '</div>' +
    insight('Platform value is benchmark-defensible (~' + platPct + '% to the 2024 internal precedent); implementation, support and connectors are day-rate / loaded lines carrying the largest percentage concessions (~' + svcPct + '%). Separate the two in the room. ' + jumpLink('ISS-12 →', 'tab:contract/sub:legal')),
    { accent: 'plum', icon: 'money', sub: evidenceChip('calculated', { short: true }) });
}
function renderRenewalBand(d) {
  const iss = ['ISS-04', 'ISS-11'].map(id => findIssue(d, id)).filter(Boolean);
  const rows = iss.map(i =>
    '<div class="rn-item"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
      severityPill(i.priority) + '<strong style="flex:1 1 200px;min-width:0">' + esc(i.title) + '</strong>' +
      evidenceChip(i.evidenceType, { sources: i.sourceIds, short: true }) + '</div>' +
    '<dl class="kv" style="margin-top:6px">' +
      '<dt>As drafted</dt><dd>' + esc(i.supplierPosition) + '</dd>' +
      '<dt>Protection ask</dt><dd>' + esc(i.recommendedPosition) + ' ' + jumpLink('Terms →', 'tab:contract/sub:legal') + '</dd>' +
    '</dl></div>').join('<div class="divider"></div>');
  return saCard('Renewal & Price Protection', rows +
    insight('Auto-renewal (ISS-04) and the uncapped post-term uplift (ISS-11) compound: a missed 90-day window locks another year at an unbounded increase. A rate lock / CPI cap is the single highest-value commercial protection after the platform discount.', 'warn'),
    { accent: 'emph', icon: 'clock' });
}
function renderBenchmarks(d) {
  const bs = d.benchmarks || [];
  if (!bs.length) {
    return gapCard('No comparable benchmark in this session', 'No internal precedent or credible external comparison was available at generation time; no fabricated market percentiles are shown. ' + jumpLink('Gaps →', 'tab:brief'));

// SVG NPV-vs-rate curve. Re-rendered on WACC change to move the live marker.
function renderNpvCurve(d, wacc) {
  const pf = d.proforma || {};
  const curve = (pf.npvCurve || []).slice().sort((a, b) => a.rate - b.rate);
  if (!curve.length) return gapCard('No NPV curve', 'NPV-vs-rate data not available in this session.');
  const be = pf.breakEven || {}, band = (pf.wacc || {}).band || {};
  const xMax = Math.max.apply(null, curve.map(p => p.rate).concat([be.rate || 0, 12]));
  const yMax = Math.max.apply(null, curve.map(p => p.npv).concat([1]));
  const W = 340, H = 172, padL = 46, padR = 14, padT = 14, padB = 30, pw = W - padL - padR, ph = H - padT - padB;
  const X = r => padL + (r / xMax) * pw, Y = v => padT + (1 - v / yMax) * ph;
  const line = curve.map(p => X(p.rate).toFixed(1) + ',' + Y(p.npv).toFixed(1)).join(' ');
  const area = X(curve[0].rate).toFixed(1) + ',' + Y(0).toFixed(1) + ' ' + line + ' ' + X(curve[curve.length - 1].rate).toFixed(1) + ',' + Y(0).toFixed(1);
  const wx = X(clampp(wacc, 0, xMax));
  const wnpv = npv((pf.cashflowByYear || []).map(y => y.net), wacc);
  const wy = Y(clampp(wnpv, 0, yMax));
  const bandRect = (band.target != null && band.ceiling != null)
    ? '<rect x="' + X(band.target).toFixed(1) + '" y="' + padT + '" width="' + (X(band.ceiling) - X(band.target)).toFixed(1) + '" height="' + ph + '" fill="var(--emph-t)" opacity="0.5"></rect>' : '';
  const beMark = (be.rate != null)
    ? '<line x1="' + X(be.rate).toFixed(1) + '" y1="' + padT + '" x2="' + X(be.rate).toFixed(1) + '" y2="' + (padT + ph) + '" stroke="var(--danger-bar)" stroke-width="1.5" stroke-dasharray="2 2"></line>' +
      '<text x="' + X(be.rate).toFixed(1) + '" y="' + (padT - 3) + '" text-anchor="end" font-size="9" fill="var(--danger)">break-even ' + be.rate + '%</text>' : '';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="npv-svg" role="img" aria-label="NPV of the value case versus discount rate">' +
    '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT + ph) + '" stroke="var(--line2)"></line>' +
    '<line x1="' + padL + '" y1="' + (padT + ph) + '" x2="' + (padL + pw) + '" y2="' + (padT + ph) + '" stroke="var(--line2)"></line>' +
    '<text x="' + (padL - 5) + '" y="' + (Y(yMax) + 3).toFixed(1) + '" text-anchor="end" font-size="9" fill="var(--mut)">' + M(yMax) + '</text>' +
    '<text x="' + (padL - 5) + '" y="' + Y(0).toFixed(1) + '" text-anchor="end" font-size="9" fill="var(--mut)">$0</text>' +
    bandRect +
    '<polygon points="' + area + '" fill="var(--teal-t)" opacity="0.55"></polygon>' +
    '<polyline points="' + line + '" fill="none" stroke="var(--teal-d)" stroke-width="2"></polyline>' +
    beMark +
    '<line x1="' + wx.toFixed(1) + '" y1="' + padT + '" x2="' + wx.toFixed(1) + '" y2="' + (padT + ph) + '" stroke="var(--emph)" stroke-width="1.5" stroke-dasharray="3 2"></line>' +
    '<circle cx="' + wx.toFixed(1) + '" cy="' + wy.toFixed(1) + '" r="3.5" fill="var(--emph)" stroke="var(--surface)" stroke-width="1.5"></circle>' +
    '<text x="' + clampp(wx, padL + 2, padL + pw - 78).toFixed(1) + '" y="' + (padT + 10) + '" font-size="9" fill="var(--emph-tx)" font-weight="700">WACC ' + wacc + '% · ' + M(wnpv) + '</text>' +
    '<text x="' + padL + '" y="' + (H - 8) + '" text-anchor="start" font-size="9" fill="var(--mut)">0%</text>' +
    '<text x="' + (padL + pw).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="end" font-size="9" fill="var(--mut)">' + xMax + '%</text>' +
    '<text x="' + (padL + pw / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9" fill="var(--mut)">discount rate →</text>' +
  '</svg>';
}
function renderSavingsWaterfall(d) {
  const sw = (d.proforma || {}).savingsWaterfall || [];
  if (!sw.length) return saCard('Savings Waterfall vs Supplier Ask', gapCard('No savings waterfall', 'Baseline-to-target reconciliation not available.'), { accent: 'teal', icon: 'trade' });
  const steps = sw.map(s => {
    if (s.kind === 'baseline') return { label: s.label, value: s.delta, kind: 'total', display: M(s.delta) };
    if (s.kind === 'net') return { label: s.label, value: s.delta, kind: 'final', display: M(s.delta) };
    return { label: s.label, value: Math.abs(s.delta), kind: 'down', display: (s.delta < 0 ? '−' : '+') + M(Math.abs(s.delta)) };
  });
  const ask = sw.find(s => s.kind === 'baseline') || { delta: 0 }, net = sw.find(s => s.kind === 'net') || { delta: 0 };
  const saved = ask.delta - net.delta, pctOff = ask.delta ? Math.round(saved / ask.delta * 100) : 0;
  return saCard('Savings Waterfall vs Supplier Ask',
    waterfall(steps, {}) +
    insight('The two anchor bars are the supplier ask (' + M(ask.delta) + ') and the negotiated target (' + M(net.delta) + '); the bars between are the negotiated reductions, sized by magnitude. Total removed: <strong>' + M(saved) + '</strong> (' + pctOff + '% off the ask) across the 3-year term.'),

// Precomputed static tornado from proforma.sensitivity (NOT a live recompute).
function renderTornado(d) {
  const rows = ((d.proforma || {}).sensitivity || []).slice();
  if (!rows.length) return gapCard('No sensitivity data', 'Precomputed sensitivity not available in this session.');
  rows.forEach(r => { r._swing = Math.abs((r.high || 0) - (r.low || 0)); });
  rows.sort((a, b) => b._swing - a._swing);
  const dMin = Math.min.apply(null, rows.map(r => r.low));
  const dMax = Math.max.apply(null, rows.map(r => r.high));
  const span = (dMax - dMin) || 1;
  const base = rows[0].base;
  const basePct = (base - dMin) / span * 100;
  const body = rows.map(r => {
    const loPct = (r.low - dMin) / span * 100, hiPct = (r.high - dMin) / span * 100;
    return '<div class="tor-row"><div class="tor-lbl">' + esc(r.driver) + '<div class="tiny muted mono">' + M(r.low) + ' – ' + M(r.high) + '</div></div>' +
      '<div class="tor-track"><span class="tor-base" style="left:' + basePct.toFixed(1) + '%"></span>' +
      '<span class="tor-bar tor-lo" style="left:' + loPct.toFixed(1) + '%;width:' + (basePct - loPct).toFixed(1) + '%"></span>' +
      '<span class="tor-bar tor-hi" style="left:' + basePct.toFixed(1) + '%;width:' + (hiPct - basePct).toFixed(1) + '%"></span></div></div>';
  }).join('');
  return '<div class="tornado">' + body + '</div>' +
    '<div class="tiny muted" style="margin-top:8px">Centre line = target 3-yr TCV (' + M(base) + '). Teal = lower cost, orange = higher cost. Precomputed static ranges, not a live recompute.</div>';
}
