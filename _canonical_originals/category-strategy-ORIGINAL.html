const m = D.meta;

function f$(v){if(!v&&v!==0)return"";var a=Math.abs(v);if(a>=1e9)return"$"+(v/1e9).toFixed(2)+"B";if(a>=1e6)return"$"+(v/1e6).toFixed(1)+"M";if(a>=1e3)return"$"+(v/1e3).toFixed(0)+"K";return"$"+v.toFixed(0);}
function fP(v){return v==null?"":v.toFixed(1)+"%";}
function Metric({label,value,sub,accent,warn,good}){var bar=accent?R:warn?R:good?GRN:BD;return <div style={{background:accent?WARM:warn?RISK:good?OK:"#fff",borderRadius:8,padding:"14px 16px",borderLeft:"4px solid "+bar,minWidth:0}}><div style={{fontSize:10,fontWeight:700,color:accent?R:LT,textTransform:"uppercase",letterSpacing:"0.05em"}}>{label}</div><div style={{fontFamily:"Georgia,serif",fontSize:22,fontWeight:700,color:warn?R:good?GRN:DK,marginTop:4}}>{value}</div>{sub&&<div style={{fontSize:11,color:MUT,marginTop:2}}>{sub}</div>}</div>;}
function Card({title,note,children}){return <div style={{background:"#fff",borderRadius:8,padding:18,border:"1px solid "+BD,marginBottom:14}}>{title&&<div style={{fontFamily:"Georgia,serif",fontSize:13,fontWeight:700,color:DK,marginBottom:12,display:"flex",alignItems:"center",gap:8}}><div style={{width:3,height:14,background:R,borderRadius:2}}/>{title}{note&&<span style={{fontFamily:"Arial",fontSize:10,fontWeight:600,color:MUT,marginLeft:"auto"}}>{note}</span>}</div>}{children}</div>;}
function Pillar({c,k,t,d}){return <div style={{background:"#fff",borderRadius:8,padding:16,border:"1px solid "+BD,borderTop:"3px solid "+c,flex:1,minWidth:0}}><div style={{fontFamily:"Georgia,serif",fontSize:20,fontWeight:700,color:c}}>{k}</div><div style={{fontSize:12,fontWeight:700,color:DK,marginTop:4}}>{t}</div><div style={{fontSize:11,color:MUT,marginTop:4,lineHeight:1.5}}>{d}</div></div>;}
function Tip({active,payload,label}){if(!active||!payload||!payload.length)return null;return <div style={{background:DK,borderRadius:6,padding:"10px 14px",color:"#fff",fontSize:12}}>{label&&<div style={{fontWeight:600,color:LT}}>{label}</div>}{payload.map(function(p,i){return <div key={i}><strong>{typeof p.value==="number"?p.value.toLocaleString("en-US"):p.value}</strong></div>;})}</div>;}
function StateBanner({kind,msg}){var map={NEEDS_INPUT:[AMB,WARM,"Needs input"],NOT_APPLICABLE:[MUT,CARD,"Not applicable"],RESEARCH_PENDING:[MUT,CARD,"Research pending"]};var c=map[kind]||map.NOT_APPLICABLE;return <div style={{background:c[1],border:"1px solid "+c[0]+"55",borderLeft:"4px solid "+c[0],borderRadius:8,padding:"12px 16px",marginBottom:14}}><span style={{fontSize:10,fontWeight:700,letterSpacing:"0.06em",color:c[0],textTransform:"uppercase"}}>{c[2]}</span><div style={{fontSize:12,color:DK,marginTop:4,lineHeight:1.5}}>{msg}</div></div>;}
function STable({columns,rows}){var _s=useState({col:0,dir:"asc"});var sort=_s[0];var setSort=_s[1];var _q=useState("");var q=_q[0];var setQ=_q[1];var filtered=useMemo(function(){var r=rows;if(q){var lq=q.toLowerCase();r=rows.filter(function(row){return row.some(function(c){return String(c.d).toLowerCase().indexOf(lq)>=0;});});}return r.slice().sort(function(a,b){var av=a[sort.col].v!=null?a[sort.col].v:a[sort.col].d;var bv=b[sort.col].v!=null?b[sort.col].v:b[sort.col].d;if(av<bv)return sort.dir==="asc"?-1:1;if(av>bv)return sort.dir==="asc"?1:-1;return 0;});},[rows,sort,q]);return <div><div style={{marginBottom:8}}><input value={q} onChange={function(e){setQ(e.target.value);}} placeholder="Search..." style={{padding:"6px 12px",borderRadius:6,border:"1px solid "+BD,fontSize:12,width:220}}/><span style={{fontSize:11,color:LT,marginLeft:8}}>{filtered.length} of {rows.length}</span></div><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>{columns.map(function(h,i){var active=sort.col===i;return <th key={i} onClick={function(){setSort({col:i,dir:active&&sort.dir==="desc"?"asc":"desc"});}} style={{padding:"7px 8px",fontWeight:600,color:active?R:MUT,fontSize:11,borderBottom:"2px solid "+BD,cursor:"pointer",textAlign:h.a||"left",whiteSpace:"nowrap"}}>{h.l}{active?(sort.dir==="asc"?" ^":" v"):""}</th>;})}</tr></thead><tbody>{filtered.map(function(row,ri){return <tr key={ri} style={{background:ri%2===0?"#fff":CARD}}>{row.map(function(cell,ci){return <td key={ci} style={{padding:"6px 8px",fontSize:12,borderBottom:"1px solid "+BD,textAlign:columns[ci].a||"left",fontWeight:cell.b?700:400,color:cell.c||DK}}>{cell.d}</td>;})}</tr>;})}</tbody></table></div></div>;}

function Dashboard(){
  var _t=useState("Overview");var tab=_t[0];var setTab=_t[1];
  var _dd=useState(null);var drawer=_dd[0];var setDrawer=_dd[1];

      <div style={{padding:"18px 24px 40px",maxWidth:1280,margin:"0 auto"}}>

      {/* TAB 1: OVERVIEW */}

          </Card>
        </div>
        <Card title="Key Data-Driven Findings">

            <Pillar c={R} k={fP(m.topShare)} t="Supplier Alpha Concentration" d="Largest vendor at 18.2% of spend. Growth trajectory (+10.9% YoY) indicates increasing dependency. Monitor for single-source risk in Subcategory A."/>
            <Pillar c={AMB} k={m.tail100+" vendors"} t="Tail Effort Mismatch" d={m.tail100+" vendors billed under $100K for just "+m.tail100Pct+"% of category spend. Each consumes equal contracting effort. Consolidation opportunity identified."}/>

        </div>
      </div>}

      {/* TAB 2: PARETO & TAIL (with consolidation) */}

        </div>
        <Card title="Pareto Distribution (CY2024)">
          <ResponsiveContainer width="100%" height={280}><ComposedChart data={D.pareto.map(function(p){return{name:p.n.length>14?p.n.slice(0,12)+"..":p.n,spend:p.s,cumPct:p.cumPct};})}><CartesianGrid strokeDasharray="3 3" stroke={BD}/><XAxis dataKey="name" tick={{fontSize:9,fill:MUT}} angle={-30} textAnchor="end" height={60}/><YAxis yAxisId="left" tickFormatter={function(v){return f$(v);}} tick={{fontSize:10,fill:MUT}}/><YAxis yAxisId="right" orientation="right" domain={[0,100]} tickFormatter={function(v){return v+"%";}} tick={{fontSize:10,fill:MUT}}/><Tooltip content={Tip}/><ReferenceLine yAxisId="right" y={80} stroke={AMB} strokeDasharray="5 5" label={{value:"80%",fill:AMB,fontSize:10}}/><Bar yAxisId="left" dataKey="spend" name="Spend" radius={[4,4,0,0]}>{D.pareto.map(function(p,i){return <Cell key={i} fill={p.cumPct<=80?R:p.cumPct<=95?AMB:MUT}/>;})}</Bar><Line yAxisId="right" dataKey="cumPct" name="Cumulative %" stroke={BLU} strokeWidth={2} dot={false}/></ComposedChart></ResponsiveContainer>

            rows={D.suppliers.map(function(s){return[
              {d:s.r,v:s.r},{d:<span onClick={function(){setDrawer(drawer===s.r?null:s.r);}} style={{cursor:"pointer",color:BLU,textDecoration:"underline"}}>{s.n}</span>,v:s.n},{d:f$(s.tot),v:s.tot},{d:fP(s.share),v:s.share},{d:f$(s.s3),v:s.s3},{d:f$(s.s4),v:s.s4},{d:f$(s.s5),v:s.s5},{d:(s.yoy>0?"+":"")+fP(s.yoy),v:s.yoy,c:s.yoy>20?R:s.yoy<0?GRN:DK},{d:s.sbe?"Yes":"",c:s.sbe?GRN:MUT}
            ];})}/>
        </Card>

        {drawer&&<Card title={"Deep Dive: "+D.suppliers.find(function(s){return s.r===drawer;}).n} note="Click name above to close">
          {function(){var s=D.suppliers.find(function(x){return x.r===drawer;});return <div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:14}}>
              <Metric label="3-Year Total" value={f$(s.tot)}/><Metric label="CY2024" value={f$(s.s4)}/><Metric label="Share" value={fP(s.share)}/><Metric label="YoY Growth" value={(s.yoy>0?"+":"")+fP(s.yoy)} warn={s.yoy>20} good={s.yoy<5&&s.yoy>=0}/>
            </div>
            <ResponsiveContainer width="100%" height={160}><BarChart data={[{yr:"CY2023",spend:s.s3},{yr:"CY2024",spend:s.s4},{yr:"CY2025 YTD",spend:s.s5}]}><CartesianGrid strokeDasharray="3 3" stroke={BD}/><XAxis dataKey="yr" tick={{fontSize:11,fill:MUT}}/><YAxis tickFormatter={function(v){return f$(v);}} tick={{fontSize:10,fill:MUT}} width={55}/><Tooltip content={Tip}/><Bar dataKey="spend" name="Spend" radius={[4,4,0,0]} fill={BLU}/></BarChart></ResponsiveContainer>
            <div style={{fontSize:12,color:MUT,marginTop:8}}>Subcategory, BU, and contract coverage breakdowns populated from source data. Rate-vs-volume decomposition shows whether YoY change is driven by price increases or consumption changes.</div>
          </div>;}()}
        </Card>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <Card title="New Large Vendors (CY2025)">{D.newVendors.map(function(v,i){return <div key={i} style={{fontSize:12,padding:"4px 0"}}><strong>{v.n}</strong> -- {f$(v.s)}</div>;})}</Card>
          <Card title="Exiting Vendors (CY2025)">{D.exitVendors.map(function(v,i){return <div key={i} style={{fontSize:12,padding:"4px 0"}}><strong>{v.n}</strong> -- {f$(v.s)}</div>;})}</Card>
        </div>
      </div>}

      {/* TAB 4: SUBCATEGORIES */}
      {tab==="Subcategories"&&<div>
        <Card title="Spend by Subcategory (Annual)">
          <ResponsiveContainer width="100%" height={250}><BarChart data={D.subcats.map(function(sc){return{name:sc.n,CY2023:sc.s3,CY2024:sc.s4,"CY2025 YTD":sc.s5};})}><CartesianGrid strokeDasharray="3 3" stroke={BD}/><XAxis dataKey="name" tick={{fontSize:10,fill:MUT}}/><YAxis tickFormatter={function(v){return f$(v);}} tick={{fontSize:10,fill:MUT}} width={55}/><Tooltip content={Tip}/><Bar dataKey="CY2023" fill={PAL[0]} radius={[4,4,0,0]}/><Bar dataKey="CY2024" fill={PAL[1]} radius={[4,4,0,0]}/><Bar dataKey="CY2025 YTD" fill={BD} radius={[4,4,0,0]}/></BarChart></ResponsiveContainer>
        </Card>
      </div>}

      {/* TAB 5: MARKET & KRALJIC */}
      {tab==="Market & Kraljic"&&<div>
        <StateBanner kind="RESEARCH_PENDING" msg="Market intelligence populated from web search at analysis time. Porter's Five Forces, pricing environment, and Kraljic positioning are researched fresh for each category. This illustrative view shows the layout structure."/>
        <Card title="Porter's Five Forces">
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:10}}>
            {[{f:"Buyer Power",s:"Medium",c:AMB},{f:"Supplier Power",s:"Medium",c:AMB},{f:"New Entrants",s:"Low",c:GRN},{f:"Substitutes",s:"Low",c:GRN},{f:"Rivalry",s:"High",c:R}].map(function(p,i){return <Pillar key={i} c={p.c} k={p.s} t={p.f} d="Assessment derived from current market research with cited sources and confidence flags."/>;})}
          </div>
        </Card>
        <Card title="Kraljic Positioning">
          <div style={{fontSize:12,lineHeight:1.6}}>Category positioned in the <strong>Leverage</strong> quadrant (high profit impact, low supply risk). Multiple qualified suppliers exist. Strategy implication: competitive pressure is the primary lever. Sourcing approach: competitive bidding with dual-source structure.</div>
        </Card>
      </div>}

      {/* TAB 6: RISK */}
      {tab==="Risk"&&<div>
        <Card title="Risk Register">
          <STable columns={[{l:"Risk"},{l:"Driver"},{l:"Likelihood",a:"center"},{l:"Impact",a:"center"},{l:"Mitigation"}]}
            rows={[
              [{d:"Supplier Alpha concentration",b:true},{d:"18.2% of spend, growing"},{d:"Medium",c:AMB},{d:"High",c:R},{d:"Develop secondary source in Subcategory A"}],
              [{d:"Rate escalation pressure",b:true},{d:"Contractual CPI-linked increases"},{d:"High",c:R},{d:"Medium",c:AMB},{d:"Negotiate rate caps at renewal"}],
              [{d:"Geographic concentration",b:true},{d:"62% US-based suppliers"},{d:"Low",c:GRN},{d:"Low",c:GRN},{d:"Monitor; no action required at current levels"}]
            ]}/>
        </Card>
      </div>}

      {/* TAB 7: STRATEGY (NEEDS_INPUT) */}
      {tab==="Strategy"&&<div>
        <StateBanner kind="NEEDS_INPUT" msg="Strategy recommendations are shaped by your input on business priorities, constraints, and team structure. Claude will present data-derived proposals and ask you to confirm or adjust. Provide your priorities to populate this tab."/>
        <Card title="Strategy Options (Proposed, pending confirmation)">
          <div style={{fontSize:12,color:MUT,lineHeight:1.6}}>Three strategy options will be developed from the spend data and market research, with a recommended option, execution pillars, and supplier tiering. Options are specific to this category's data profile, not generic templates.</div>
        </Card>
      </div>}

      {/* TAB 8: SAVINGS & SCORECARD (NEEDS_INPUT) */}
      {tab==="Savings & Scorecard"&&<div>
        <StateBanner kind="NEEDS_INPUT" msg="Savings targets and scorecard KPIs require your input. Claude will present data-derived estimates (consolidation opportunities, rate benchmarks, renewal timing) and ask you to confirm realistic targets. Provide your savings context to populate this tab."/>
        <Card title="Savings Pipeline (Estimated ranges, pending confirmation)">
          <div style={{fontSize:12,color:MUT,lineHeight:1.6}}>Savings opportunities are identified from the data: tail consolidation, rate renegotiation windows, volume leverage. Each carries an estimated range and confidence level. Committed targets are set only after your confirmation.</div>
        </Card>
      </div>}

      {/* TAB 9: SUPPLIER DEVELOPMENT */}
      {tab==="Supplier Development"&&<div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:14}}>
          <Metric label="SBE Spend (CY24)" value={f$(m.sbe24)} accent/><Metric label="SBE Rate (CY24)" value={fP(m.sbeRate24)} warn={m.sbeRate24<10}/><Metric label="SBE Rate (CY23)" value={fP(m.sbeRate23)}/><Metric label="Target" value="10.0%" sub="Corporate goal"/>
        </div>
        <Card title="Supplier Development Trend">
          <ResponsiveContainer width="100%" height={180}><ComposedChart data={[{yr:"CY2023",rate:m.sbeRate23,spend:m.sbe23},{yr:"CY2024",rate:m.sbeRate24,spend:m.sbe24}]}><CartesianGrid strokeDasharray="3 3" stroke={BD}/><XAxis dataKey="yr" tick={{fontSize:11,fill:MUT}}/><YAxis tickFormatter={function(v){return fP(v);}} tick={{fontSize:10,fill:MUT}} domain={[0,15]}/><Tooltip content={Tip}/><ReferenceLine y={10} stroke={R} strokeDasharray="5 5" label={{value:"10% target",fill:R,fontSize:10}}/><Bar dataKey="rate" name="SBE Rate" fill={GRN} radius={[4,4,0,0]}/></ComposedChart></ResponsiveContainer>
        </Card>
      </div>}

      {/* TAB 10: RATIONALIZATION */}
      {tab==="Rationalization"&&<div>
        <Card title="Most Fragmented Subcategories">
          <STable columns={[{l:"Subcategory"},{l:"Vendors",a:"center"},{l:"Top 3 Share",a:"right"},{l:"Assessment"}]}
            rows={[
              [{d:"Subcategory D",b:true},{d:"28",v:28},{d:"42%",v:42},{d:"Highly fragmented. Consolidation candidate.",c:R}],
              [{d:"Subcategory E",b:true},{d:"22",v:22},{d:"55%",v:55},{d:"Moderately fragmented. Review tail vendors.",c:AMB}],
              [{d:"Subcategory A",b:true},{d:"15",v:15},{d:"78%",v:78},{d:"Concentrated. No action needed.",c:GRN}]
            ]}/>
        </Card>
        <Card title="Multi-Subcategory Vendors (Consolidation Candidates)">
          <div style={{fontSize:12,color:MUT,lineHeight:1.6}}>Vendors serving 3+ subcategories are potential consolidation anchors. Redirect fragmented subcategory spend to vendors who already serve adjacent areas, reducing vendor count without adding new relationships.</div>
        </Card>
      </div>}

      {/* TAB 11: TREND & CHANGE */}
      {tab==="Trend & Change"&&<div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:14}}>
          <Metric label="Total Change (CY23 to CY24)" value={f$(D.trendDecomp.totalChange)} sub={"+"+fP(m.yoy2324)+" YoY"} accent/>
          <Metric label="From New Suppliers" value={f$(D.trendDecomp.newSuppliers)} good/>
          <Metric label="From Exiting Suppliers" value={f$(D.trendDecomp.exitingSuppliers)}/>
          <Metric label="From Existing Growth" value={f$(D.trendDecomp.existingGrowth)} warn={D.trendDecomp.existingGrowth>5000000}/>
        </div>
        <Card title="Top Swing Drivers (CY2023 to CY2024)">
          <STable columns={[{l:"Supplier"},{l:"Change",a:"right"},{l:"Cause"}]}
            rows={D.trendDecomp.topDrivers.map(function(d){return[
              {d:d.n,b:true},{d:(d.delta>0?"+":"")+f$(d.delta),v:d.delta,c:d.delta>0?R:GRN},{d:d.cause}
            ];})}/>
        </Card>
        <Card title="Change Decomposition">
          <div style={{fontSize:12,lineHeight:1.6}}>The {f$(D.trendDecomp.totalChange)} increase decomposes into: <strong>{f$(D.trendDecomp.newSuppliers)}</strong> from new suppliers entering the category, <strong>{f$(Math.abs(D.trendDecomp.exitingSuppliers))}</strong> offset from exiting suppliers, and <strong>{f$(D.trendDecomp.existingGrowth)}</strong> from growth in existing supplier relationships. Rate-vs-volume analysis shows whether growth is driven by price increases or consumption changes.</div>
        </Card>
      </div>}

      </div>
      <div style={{background:DK,padding:"10px 24px",display:"flex",justifyContent:"space-between",fontSize:10,color:MUT}}>
        <div>Data: NEUTRAL ILLUSTRATIVE | Vendor identity: VENDOR_PARENT2 with Vendor Name fallback | Supplier Development from SBE/WBE/MBE classification columns</div>
        <div>Company Confidential | category-strategy v4.0 | 2026</div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Dashboard));

</script></body></html>
